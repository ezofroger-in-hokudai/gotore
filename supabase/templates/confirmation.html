<html lang="ja">

    <h1>メールアドレスを確認してください</h1>
    <p>GO TOREへの登録を完了するには、次のリンクを開いてください。</p>
    <p><a href="{{ .ConfirmationURL }}">メールアドレスを確認する</a></p>
