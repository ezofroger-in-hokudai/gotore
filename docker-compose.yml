services:
  backend:
    build:
      context: ./backend
    env_file:
      - backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_NAME: GO TORE API
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:59322/postgres
      SUPABASE_URL: http://host.docker.internal:59321
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    env_file:
      - frontend/.env.local
    depends_on:
      - backend
    environment:
      PORT: 3000
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
