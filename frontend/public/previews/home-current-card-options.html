<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-GOTORE ホーム・現行カード比較</title><style>

50%;background:#4a4d55;font-size:10px}.person:nth-child(2){background:#806761}.person:nth-child(3){background:#52756b}.metrics{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:17px;border-top:1px solid var(--l);border-bottom:1px solid var(--l)}.metrics div{padding:11px 7px 10px 0}.metrics div+div{padding-left:10px;border-left:1px solid var(--l)}.metrics label{display:block;color:var(--m);font-size:9px;font-weight:700}.metrics b{display:block;margin-top:4px;font-size:16px}.live-line{display:flex;align-items:center;gap:8px;margin-bottom:16px;padding:11px 0;border-top:1px solid var(--l);border-bottom:1px solid var(--l)}.dot{width:7px;height:7px;border-radius:50%;background:var(--r)}.live-line button{margin-left:auto;border:0;background:none;color:var(--m);font-size:12px}.filters{display:flex;gap:7px;overflow:hidden;margin:0 -20px 15px;padding:0 20px}.filter{flex:none;min-height:36px;border:1px solid var(--l);border-radius:8px;padding:6px 11px;background:var(--p);color:var(--m);font-size:12px}.filter.on{border-color:#efcaca;background:var(--s);color:var(--r);font-weight:700}.section{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px}.section h2{margin:0;font-size:16px}.section span{color:var(--m);font-size:11px}.feed{border-top:1px solid var(--l)}.workout{padding:14px 0;border-bottom:1px solid var(--l)}.workout header{display:flex;justify-content:space-between;gap:8px}.workout h3,.workout p{margin:0}.workout h3{font-size:14px}.workout time,.meta,.total{color:var(--m);font-size:11px}.meta{margin-top:4px!important}.menu{margin-top:9px;border-left:2px solid var(--l);padding-left:10px}.exercise{display:flex;justify-content:space-between;gap:8px;margin-top:5px;font-size:12px}.exercise:first-child{margin-top:0}.exercise span{color:var(--m);white-space:nowrap}.total{margin-top:8px!important}.react{display:flex;gap:6px;margin-top:10px}.stamp{min-height:30px;border:1px solid var(--l);border-radius:7px;padding:4px 9px;background:var(--p);font-size:12px}.detail{margin-left:auto;border:0;background:none;color:var(--m);font-size:12px}.start{position:absolute;right:20px;bottom:82px;min-height:52px;border:0;border-radius:10px;padding:0 18px;background:var(--r);box-shadow:0 5px 13px #0003;color:#fff;font-weight:700}.nav{position:absolute;right:0;bottom:0;left:0;display:grid;grid-template-columns:repeat(4,1fr);min-height:66px;border-top:1px solid var(--l);background:var(--p)}.nav span{text-align:center;padding:21px 0;color:var(--m);font-size:12px}.nav .on{border-top:2px solid var(--r);color:var(--r);font-weight:700}
</style><body><div class=tabs><button data-v=a aria-pressed=true>A 現行カード継続</button><button data-v=b aria-pressed=false>B カード＋要約</button><button data-v=c aria-pressed=false>C カード＋LIVE行</button><button data-v=d aria-pressed=false>D カードなし</button></div><p class=note>黒いLIVEカードは追加しません。現行のグループカードを残す量だけを比較する4案です。</p><div class=phone><header class=head><div class=logo>E-GO<b>TORE</b></div><button class=bell>♧</button></header><main class=main><div class=title><h1>ホーム</h1><button>グループ一覧</button></div><section class="view on" data-p=a><div class=group-card><header><div><small>YOUR TEAM</small><h2>GO TORE</h2></div><b>›</b></header><div class=stats><div><label class=live>● LIVE</label><b>2人</b><div class=people><i class=person>み</i><i class=person>た</i></div></div><div><label>TODAY</label><b>4人</b><small>18セット</small></div></div></div><div class=filters><button class="filter on">すべて</button><button class=filter>GO TORE</button><button class=filter>朝トレ部</button></div><div class=section><h2>トレーニング</h2><span>新しい順</span></div><div class=feed data-feed></div></section><section class=view data-p=b><div class=group-card><header><div><small>YOUR TEAM</small><h2>GO TORE</h2></div><b>›</b></header><div class=people><i class=person>み</i><i class=person>た</i><i class=person>ゆ</i></div></div><div class=metrics><div><label class=live>● LIVE</label><b>2人</b></div><div><label>TODAY</label><b>4人</b></div><div><label>SETS</label><b>18</b></div><div><label>VOLUME</label><b>18.6t</b></div></div><div class=section><h2>トレーニング</h2><span>新しい順</span></div><div class=feed data-feed></div></section><section class=view data-p=c><div class=group-card><header><div><small>YOUR TEAM</small><h2>GO TORE</h2></div><b>›</b></header><div class=stats><div><label>TODAY</label><b>4人</b></div><div><label>VOLUME</label><b>18.6t</b></div></div></div><div class=live-line><i class=dot></i><b>みお、たくみがトレーニング中</b><button>見る ›</button></div><div class=filters><button class="filter on">すべて</button><button class=filter>GO TORE</button><button class=filter>朝トレ部</button></div><div class=section><h2>トレーニング</h2><span>新しい順</span></div><div class=feed data-feed></div></section><section class=view data-p=d><div class=metrics><div><label class=live>● LIVE</label><b>2人</b></div><div><label>TODAY</label><b>4人</b></div><div><label>SETS</label><b>18</b></div><div><label>VOLUME</label><b>18.6t</b></div></div><div class=live-line><i class=dot></i><b>みお、たくみがトレーニング中</b><button>見る ›</button></div><div class=section><h2>トレーニング</h2><span>新しい順</span></div><div class=feed data-feed></div></section></main><button class=start>START</button><nav class=nav><span class=on>ホーム</span><span>グループ</span><span>履歴</span><span>設定</span></nav></div><template id=w><article class=workout><header><h3></h3><time></time></header><p class=meta></p><div class=menu><div class=exercise><b></b><span></span></div><div class=exercise><b></b><span></span></div><div class=exercise><b></b><span></span></div></div><p class=total>総負荷 3,920 kg</p><div class=react><button class=stamp>🔥 2</button><button class=stamp>👏</button><button class=stamp>💪</button><button class=detail>詳細 ›</button></div></article></template><script>const d=[['みお','GO TORE · 胸・肩 · 3種目 · 9セット','10:42',['ベンチプレス','60 kg × 8 × 3'],['インクライン','45 kg × 10 × 3'],['ペックフライ','30 kg × 12 × 3']],['たくみ','朝トレ部 · 脚 · 2種目 · 6セット','10:30',['スクワット','80 kg × 6 × 3'],['レッグプレス','140 kg × 10 × 3'],['','']]];document.querySelectorAll('[data-feed]').forEach(f=>d.forEach(x=>{let n=w.content.cloneNode(true);n.querySelector('h3').textContent=x[0];n.querySelector('.meta').textContent=x[1];n.querySelector('time').textContent=x[2];n.querySelectorAll('.exercise').forEach((e,i)=>{e.querySelector('b').textContent=x[i+3][0];e.querySelector('span').textContent=x[i+3][1];if(!x[i+3][0])e.remove()});f.append(n)}));document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.dataset.p===b.dataset.v))});</script></body></html>
