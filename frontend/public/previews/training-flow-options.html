<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GO TORE — トレーニング導線</title>
<style>
:root{color-scheme:light;--bg:#f4f4f5;--panel:#fff;--text:#17191d;--muted:#656a74;--line:#dedfe3;--accent:#d32f2f;--soft:#fff0f0;--good:#24754b}[data-theme=dark]{color-scheme:dark;--bg:#111214;--panel:#1b1d20;--text:#f5f5f7;--muted:#a1a6af;--line:#33363d;--accent:#ff625b;--soft:#392327;--good:#8addae}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.intro{max-width:940px;margin:auto;padding:32px 20px 14px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--accent)}h1{margin:6px 0;font-size:29px;letter-spacing:-.04em}.intro p{margin:0;color:var(--muted)}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.tools button{min-height:40px;border:1px solid var(--line);background:var(--panel);padding:7px 11px;border-radius:0}.tools button[aria-pressed=true]{background:var(--text);color:var(--panel);border-color:var(--text)}.tools .theme{margin-left:auto}.wrap{max-width:940px;margin:auto;padding:8px 20px 40px;display:grid;grid-template-columns:210px minmax(290px,430px);justify-content:center;gap:24px}.flow{padding-top:14px}.flow button{width:100%;min-height:43px;border:0;border-left:1px solid var(--line);background:transparent;text-align:left;padding:8px 12px;color:var(--muted)}.flow button[aria-current=true]{border-left:3px solid var(--accent);background:var(--soft);color:var(--accent);font-weight:800}.flow small{display:block;font-size:10px;margin-top:1px;color:inherit}.phone{min-height:720px;border:1px solid #353a43;background:var(--bg);overflow:hidden;position:relative}.status{height:31px;padding:10px 18px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:800}.screen{padding:8px 16px 20px}.header{min-height:45px;display:flex;justify-content:space-between;align-items:center;gap:8px}.header h2{margin:0;font-size:20px;letter-spacing:-.04em}.finish{border:0;background:none;color:var(--accent);font-size:11px;min-height:44px;padding:8px 0;white-space:nowrap}.primary,.secondary{min-height:48px;width:100%;padding:10px 14px;font-weight:750;border-radius:0}.primary{border:1px solid var(--accent);background:var(--accent);color:#fff}.secondary{border:1px solid var(--line);background:var(--panel);color:var(--text)}.start{padding-top:45px}.start h2{font-size:25px;letter-spacing:-.05em;margin:0 0 5px}.start p{color:var(--muted);margin:0 0 28px}.start .previous{margin-top:25px;border-top:1px solid var(--line);padding-top:10px}.previous small{color:var(--muted)}.previous b{display:block;margin-top:4px;font-size:17px}.menu{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0}.menu p{margin:0 0 6px;color:var(--muted);font-size:11px}.track{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none}.menu-item{flex:0 0 auto;white-space:nowrap}.menu-item b{display:block;font-size:13px}.menu-item span{font-size:11px;color:var(--muted)}.stats{display:grid;grid-template-columns:1.3fr .65fr 1fr;border-bottom:1px solid var(--line);padding:10px 0}.stat small{display:block;color:var(--muted);font-size:10px}.stat b{display:block;font-size:18px;letter-spacing:-.04em}.stat:last-child b{color:var(--good);font-size:12px;padding-top:4px;letter-spacing:0}.parts{display:grid;grid-template-columns:repeat(4,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line);margin:12px 0}.part{min-height:49px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel);font-size:12px}.part i{display:block;width:5px;height:5px;border:1px solid currentColor;margin:0 auto 3px}.part[aria-pressed=true]{color:var(--accent);background:var(--soft);font-weight:800}.part[aria-pressed=true] i{background:var(--accent);border-color:var(--accent)}.rows{border-top:1px solid var(--line)}.exercise{width:100%;min-height:57px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 0;display:grid;grid-template-columns:1fr auto;text-align:left;align-items:center}.exercise strong{display:block;font-size:15px}.exercise small{color:var(--muted);font-size:11px}.exercise span:last-child{color:var(--muted);font-size:17px;padding:0 6px}.add{width:100%;min-height:46px;margin-top:14px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:18px}.comparison{border-top:1px solid var(--line);margin-top:5px}.set{display:grid;grid-template-columns:20px 1fr 28px 1fr;gap:4px;min-height:45px;align-items:center;border-bottom:1px solid var(--line);font-size:12px}.set .now{color:var(--text);font-weight:750}.set .before{color:var(--muted)}.dock{position:absolute;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}.dock .input{display:flex;gap:8px;margin-bottom:9px}.value{flex:1;border-bottom:1px solid var(--line);padding:7px 0;font-size:17px;font-weight:750}.value small{font-size:11px;color:var(--muted);font-weight:400}.sheet{position:absolute;inset:0;background:#0005;display:flex;align-items:end}.sheet>div{width:100%;background:var(--panel);padding:18px 16px 22px;border-top:1px solid var(--line)}.sheet h3{margin:0 0 12px;font-size:18px}.sheet p{margin:0 0 15px;color:var(--muted);font-size:12px}.sheet .secondary{margin-bottom:8px}.result{padding-top:46px;text-align:center}.result h2{font-size:25px;letter-spacing:-.05em;margin:0 0 6px}.result p{color:var(--muted);margin:0}.result-number{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:28px 0 16px;padding:14px}.result-number small{display:block;color:var(--muted);font-size:11px}.result-number b{font-size:29px;letter-spacing:-.06em}.result-meta{display:flex;justify-content:center;gap:22px;margin-bottom:25px}.result-meta b{font-size:18px}.note{max-width:940px;margin:-25px auto 30px;padding:0 20px;color:var(--muted);font-size:12px}@media(max-width:650px){.intro{padding:22px 16px 12px}h1{font-size:25px}.tools .theme{margin-left:0}.wrap{display:block;padding:5px 0 30px}.flow{display:flex;overflow-x:auto;padding:0 16px 12px}.flow button{flex:0 0 auto;width:auto;border:1px solid var(--line);margin-right:5px}.flow button[aria-current=true]{border-left:3px solid var(--accent)}.phone{border-left:0;border-right:0;min-height:720px}.note{padding:0 16px}}
</style>
<header class="intro"><span class="eyebrow">GO TORE / 導線の試作</span><h1>始めて、記録して、終える。</h1><p>画面単体ではなく、開始から結果までの戻り方を含めた確認用です。</p><div class="tools"><button data-style="A" aria-pressed="true">A セット一覧</button><button data-style="B" aria-pressed="false">B 軸つき</button><button class="theme" data-theme>ダーク</button></div></header>
<main class="wrap"><nav class="flow" aria-label="トレーニングの流れ"><button data-step="start" aria-current="true">1　開始<small>前回を確認</small></button><button data-step="select">2　種目<small>部位を絞る</small></button><button data-step="record">3　入力<small>セットを保存</small></button><button data-step="finish">4　終了<small>まだ続ける</small></button><button data-step="result">5　結果<small>次へ戻る</small></button></nav><section class="phone"><div class="status"><span>9:41</span><span>● ▰</span></div><div class="screen" id="screen"></div></section></main><p class="note">部位は複数選択の和集合で絞り込みます。種目選択に戻っても、選択部位・今日のメニュー・入力済みセットを保持する前提です。</p>
<script>
const query=new URLSearchParams(location.search);const steps=new Set(["start","select","record","finish","result"]);let step=steps.has(query.get("step"))?query.get("step"):"start",style=query.get("style")==="B"?"B":"A",parts=new Set(["胸","腕"]);const partNames=["胸","背中","脚","肩","腕","腹筋","お尻","他"],items=[["ベンチプレス","72.5kg × 8"],["トライセプスプレスダウン","25kg × 12"],["ダンベルフライ","14kg × 12"]];
const header=(title,finish=false)=>`<header class="header"><h2>${title}</h2>${finish?'<button class="finish" data-step="finish">今日のトレーニング終了</button>':""}</header>`;const menu=()=>`<section class="menu"><p>今日のメニュー</p><div class="track"><div class="menu-item"><b>ベンチプレス</b><span>72.5 × 8　70 × 10　70 × 10</span></div><div class="menu-item"><b>ラットプルダウン</b><span>55 × 10　55 × 10</span></div></div></section>`;const stats=()=>`<section class="stats"><div class="stat"><small>総負荷</small><b>3,240kg</b></div><div class="stat"><small>セット</small><b>5</b></div><div class="stat"><small>先週比</small><b>+420kg</b></div></section>`;const partsView=()=>`<div class="parts">${partNames.map(p=>`<button class="part" data-part="${p}" aria-pressed="${parts.has(p)}"><i></i>${p}</button>`).join("")}</div>`;const list=()=>`<div class="rows">${items.map(([name,last],i)=>style==="B"?`<button class="exercise" data-record="${name}"><span><strong>${i+1}　${name}</strong><small>${last}</small></span><span>›</span></button>`:`<button class="exercise" data-record="${name}"><span><strong>${name}</strong><small>${last}</small></span><span>›</span></button>`).join("")}</div>`;
function render(){let html="";if(step==="start")html=`<div class="start">${header("トレーニング")}<h2>今日も、記録する。</h2><p>セットを残していきます。</p><button class="primary" data-step="select">トレーニングを開始</button><section class="previous"><small>前回</small><b>3,820kg　9 SET</b><small>胸・背中・腕</small></section></div>`;if(step==="select")html=`${header("種目を選択",true)}${menu()}${stats()}${partsView()}${list()}<button class="add" data-add>＋</button>`;if(step==="record")html=`${header("ベンチプレス",true)}<div class="comparison"><div class="set"><span>1</span><span class="now">72.5kg × 8</span><span>⌫</span><span class="before">70kg × 8</span></div><div class="set"><span>2</span><span class="now">70kg × 10</span><span>⌫</span><span class="before">70kg × 10</span></div><div class="set"><span>3</span><span class="now">70kg × 10</span><span>⌫</span><span class="before">—</span></div></div><div class="dock"><div class="input"><div class="value">72.5 <small>kg</small></div><div class="value">8 <small>回</small></div></div><button class="primary" data-step="select">次の種目へ</button></div>`;if(step==="finish")html=`${header("ベンチプレス")}<div class="comparison"><div class="set"><span>1</span><span class="now">72.5kg × 8</span><span>⌫</span><span class="before">70kg × 8</span></div><div class="set"><span>2</span><span class="now">70kg × 10</span><span>⌫</span><span class="before">70kg × 10</span></div></div><div class="sheet"><div><h3>トレーニング終了</h3><p>保存したセットは履歴で確認できます。</p><button class="secondary" data-step="record">まだ続ける</button><button class="primary" data-step="result">今日のトレーニング終了</button></div></div>`;if(step==="result")html=`<div class="result">${header("トレーニング結果")}<h2>おつかれさまでした。</h2><p>9.24　保存済み</p><div class="result-number"><small>総負荷</small><b>5,460kg</b></div><div class="result-meta"><span><b>3</b> 種目</span><span><b>9</b> セット</span></div><button class="primary" data-step="start">ホーム</button><button class="secondary" data-history>履歴</button></div>`;document.querySelector("#screen").innerHTML=html;document.querySelectorAll(".flow [data-step]").forEach(b=>b.setAttribute("aria-current",String(b.dataset.step===step)));}document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.step){step=b.dataset.step;history.replaceState(null,"",`?step=${step}&style=${style}`);render()}else if(b.dataset.part){parts.has(b.dataset.part)?parts.delete(b.dataset.part):parts.add(b.dataset.part);render()}else if(b.dataset.record){step="record";history.replaceState(null,"",`?step=${step}&style=${style}`);render()}else if(b.dataset.add){step="select";document.querySelector("#screen").insertAdjacentHTML("beforeend",'<div class="sheet"><div><h3>種目</h3><button class="secondary">新しい種目を追加</button><button class="secondary">種目を管理</button><button class="primary" data-close>閉じる</button></div></div>')}else if(b.dataset.close!==undefined){render()}else if(b.dataset.style){style=b.dataset.style;history.replaceState(null,"",`?step=${step}&style=${style}`);document.querySelectorAll("[data-style]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));render()}else if(b.dataset.theme!==undefined){const dark=document.documentElement.dataset.theme!=="dark";document.documentElement.dataset.theme=dark?"dark":"";b.textContent=dark?"ライト":"ダーク"}});render();
</script>
</html>
