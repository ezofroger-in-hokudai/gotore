      document.addEventListener("click",event=>{if(suppressCalendarClick&&event.target.closest("[data-day]")){event.preventDefault();event.stopPropagation()}},true);
      document.addEventListener("keydown",event=>{
        if(calendarVariant!==1||!event.target.matches(".month-calendar")||!(["ArrowLeft","ArrowRight"].includes(event.key)))return;
        const next=monthShift+(event.key==="ArrowRight"?1:-1);
        if(next< -10||next>0)return;
        event.preventDefault();monthShift=next;monthMotion=event.key==="ArrowRight"?"newer":"older";render();document.querySelector(".month-calendar")?.focus();
      });
      const refinementOptions=[
        {label:"A このまま",note:"採用済みの見た目と操作。月とグラフはそれぞれ独立して送る。"},
        {label:"B 月を連動",note:"カレンダーを送るとグラフの月も選択。グラフの点からもその月へ移る。"},
        {label:"C 6か月推移",note:"カレンダーはそのまま。月グラフを6点に広げ、長めの変化を見る。"}
      ];
      let refinementVariant=0,lastRenderedMonthShift=null,lastRenderedVariant=null,lastRenderedGrain=null;
      const threeMonthSeries=series,threeMonthMaxPage=maxPage,originalShiftPage=shiftPage,refinementRender=render;
      const monthOffsetFor=start=>{const [year,month]=start.slice(0,7).split("-").map(Number);return (year-2026)*12+month-9};
      series=function(){
        if(refinementVariant!==2||grain!=="month")return threeMonthSeries();
        return Array.from({length:6},(_,index)=>{
          const date=new Date(Date.UTC(2026,3-page*6+index,1));
          return monthPeriod(date.getUTCFullYear(),date.getUTCMonth()+1);
        }).filter(period=>period.end>="2025-11-03").map(period=>{
          const items=allRecords.filter(record=>record.day>=period.start&&record.day<=period.end).flatMap(setsFor),numbers=stats(items);
          const candidates=items.filter(item=>metric==="weight"?item.weight===numbers.weight:item.weight>0&&item.reps<=10&&Math.abs(item.weight*(1+item.reps/30)-(numbers.rm??0))<.001);
          return {...period,value:numbers[metric],source:candidates[0]?.name??""};
        });
      };
      maxPage=function(){return refinementVariant===2&&grain==="month"?1:threeMonthMaxPage()};
      shiftPage=function(direction){
        if(refinementVariant===0||grain==="week")return originalShiftPage(direction);
        if(grain==="all")return;
        const next=Math.max(0,Math.min(maxPage(),page+direction));
        if(next===page)return;
        page=next;motion=direction>0?"older":"newer";point=series().length-1;
        if(refinementVariant===1)monthShift=monthOffsetFor(series()[point].start);
        render();
      };
      render=function(reset=false){
        if(refinementVariant===1&&grain==="month"&&(monthShift!==lastRenderedMonthShift||lastRenderedVariant!==1)){
          page=Math.floor(-monthShift/3);
          const target=new Date(Date.UTC(2026,8+monthShift,1)).toISOString().slice(0,7);
          point=Math.max(0,series().findIndex(item=>item.start.slice(0,7)===target));
        }
        if(refinementVariant===2&&grain==="month"&&(lastRenderedVariant!==2||lastRenderedGrain!=="month"))point=5;
        refinementRender(reset);
        document.getElementById("refinement-options").innerHTML=refinementOptions.map((option,index)=>`<button type="button" data-refinement-option="${index}" aria-pressed="${refinementVariant===index}">${option.label}</button>`).join("");
        document.getElementById("refinement-note").textContent=refinementOptions[refinementVariant].note;
        lastRenderedMonthShift=monthShift;lastRenderedVariant=refinementVariant;lastRenderedGrain=grain;
      };
      document.addEventListener("click",event=>{
        const option=event.target.closest("[data-refinement-option]");
        if(!option)return;
        refinementVariant=Number(option.dataset.refinementOption);
        grain="month";page=0;point=refinementVariant===2?5:2;monthShift=0;monthMotion="";overlay="";
        render();
      });
      document.addEventListener("click",event=>{
        if(refinementVariant!==1||!(["month","all"].includes(grain)))return;
        const target=event.target.closest("[data-point]");
        if(!target)return;
        const period=series()[Number(target.dataset.point)];
        if(period)monthShift=monthOffsetFor(period.start);
      },true);
      render();
    </script>
  </body>
</html>
