<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GO TORE — 種目選択 B</title>
<style>
:root{--bg:#f4f4f5;--panel:#fff;--text:#17191d;--muted:#656a74;--line:#dedfe3;--accent:#d32f2f;--shade:#e8e8eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}button,summary{font:inherit;color:inherit;cursor:pointer}.intro{max-width:430px;margin:auto;padding:28px 16px 14px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--accent)}h1{margin:5px 0;font-size:26px;letter-spacing:-.04em}.intro p{margin:0;color:var(--muted)}.phone{max-width:430px;min-height:760px;margin:auto;background:var(--bg);border:1px solid #353a43;overflow:hidden;position:relative}.status{height:29px;padding:8px 16px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:800}.screen{padding:6px 16px 18px}.heading{min-height:48px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.heading h2{margin:0;font-size:20px;letter-spacing:-.04em}.finish{border:0;background:transparent;color:var(--accent);min-height:44px;padding:8px 0;font-size:11px;white-space:nowrap}.groups{display:flex;gap:16px;overflow:hidden;border-bottom:1px solid var(--line)}.groups button{min-width:max-content;min-height:43px;border:0;border-bottom:2px solid transparent;background:transparent;padding:6px 0;color:var(--muted);font-size:12px}.groups button[aria-current=true]{border-bottom-color:var(--accent);color:var(--accent);font-weight:800}.people{display:flex;gap:14px;min-height:75px;align-items:center;overflow:hidden;border-bottom:1px solid var(--line)}.person{width:49px;flex:0 0 49px;border:0;background:transparent;padding:5px 0;text-align:center;color:var(--muted);font-size:10px}.person b{display:block;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.person[aria-current=true]{color:var(--accent)}.avatar{--photo:linear-gradient(135deg,#e3bda4,#76645d);position:relative;display:block;width:38px;height:38px;margin:auto;border-radius:50%;background:var(--photo)}.avatar.live{outline:2px solid var(--accent);outline-offset:2px}.avatar.live::after{content:"";position:absolute;width:10px;height:10px;right:-4px;bottom:-3px;border:2px solid var(--bg);border-radius:50%;background:var(--accent)}.avatar.two{--photo:linear-gradient(135deg,#8fa6c9,#d9cec0)}.avatar.three{--photo:linear-gradient(135deg,#d1aa87,#574b4a)}.avatar.four{--photo:linear-gradient(135deg,#aa8dbb,#e1d3a7)}details{border-bottom:1px solid var(--line)}summary{display:flex;align-items:center;min-height:47px;list-style:none;font-size:13px;font-weight:700}summary::-webkit-details-marker{display:none}summary span{margin-left:auto;margin-right:10px;color:var(--muted);font-size:11px;font-weight:400}summary::after{content:"…";font-size:20px;letter-spacing:1px;color:var(--muted);font-weight:400}.menu-exercise{padding:7px 0;border-top:1px solid var(--line)}.menu-exercise b{font-size:13px}.sets{display:flex;flex-direction:column;gap:2px;margin-top:3px;font-size:12px;font-variant-numeric:tabular-nums}.parts{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));border-bottom:1px solid var(--line);margin-top:12px}.part{min-width:0;min-height:46px;border:0;border-bottom:2px solid transparent;background:transparent;padding:5px 0 3px;white-space:nowrap;font-size:10px;color:var(--muted)}.part[aria-pressed=true]{border-bottom-color:var(--accent);color:var(--accent);font-weight:800}.options{border-top:1px solid var(--line)}.option{width:100%;min-height:59px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:8px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.option b{display:block;font-size:15px}.option small{display:block;margin-top:2px;color:var(--muted);font-size:11px}.arrow{color:var(--muted);font-size:18px;padding:0 5px}.new{width:100%;min-height:46px;border:1px solid var(--line);background:var(--panel);margin-top:14px;color:var(--muted);font-size:18px}.sheet{position:absolute;inset:0;background:#0004;display:flex;align-items:end}.sheet-card{width:100%;max-height:580px;overflow:auto;background:var(--panel);border-top:1px solid var(--line);padding:16px}.sheet-card h3{margin:0;font-size:18px}.sheet-card .close{position:absolute;right:18px;border:0;background:transparent;color:var(--muted);font-size:20px}.workout-meta{display:flex;gap:14px;border-bottom:1px solid var(--line);padding:8px 0;color:var(--muted);font-size:11px}.workout-meta b{color:var(--text);font-size:14px}.exercise{padding:8px 0;border-bottom:1px solid var(--line)}.exercise b{display:block;font-size:13px}.stamps{display:flex;align-items:center;gap:7px;padding-top:11px}.stamps button{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;background:var(--panel);font-size:15px}.stamps button:first-child{border-color:var(--accent);background:#fff0f0}.stamps .more{margin-left:auto;border:0;color:var(--muted);font-size:19px}.confirm{padding-bottom:20px}.confirm p{color:var(--muted);font-size:12px}.primary,.secondary{width:100%;min-height:48px;border-radius:0;font-weight:700}.primary{border:1px solid var(--accent);background:var(--accent);color:#fff}.secondary{border:1px solid var(--line);background:var(--panel);color:var(--text);margin-bottom:8px}
</style>
<header class="intro"><span class="eyebrow">GO TORE / 採用案 B</span><h1>仲間を開いて、次の種目へ。</h1><p>終了と今日のトレーニングを戻した、実装対象の種目選択案です。</p></header>
<section class="phone"><div class="status"><span>9:41</span><span>● ▰</span></div><div class="screen"><header class="heading"><h2>種目を選択</h2><button class="finish" data-finish>今日のトレーニング終了</button></header><nav class="groups"><button aria-current="true">すべて</button><button>北大ジム</button><button>研究室</button></nav><div class="people"><button class="person" data-person aria-current="true"><i class="avatar live"></i><b>佐藤</b></button><button class="person" data-person><i class="avatar two"></i><b>田中</b></button><button class="person" data-person><i class="avatar three live"></i><b>山本</b></button><button class="person" data-person><i class="avatar four"></i><b>鈴木</b></button></div><details><summary>今日のトレーニング <span>2種目　5セット</span></summary><div class="menu-exercise"><b>ベンチプレス</b><div class="sets"><span>72.5kg × 8回</span><span>70kg × 10回</span><span>70kg × 10回</span></div></div><div class="menu-exercise"><b>ラットプルダウン</b><div class="sets"><span>55kg × 10回</span><span>55kg × 10回</span></div></div></details><nav class="parts"><button class="part" aria-pressed="true">胸</button><button class="part">背中</button><button class="part">脚</button><button class="part">肩</button><button class="part" aria-pressed="true">腕</button><button class="part">腹筋</button><button class="part">お尻</button><button class="part">他</button></nav><div class="options"><button class="option"><span><b>ダンベルフライ</b><small>3日前</small></span><span class="arrow">›</span></button><button class="option"><span><b>トライセプスプレスダウン</b><small>10日以上前</small></span><span class="arrow">›</span></button></div><button class="new">＋</button></div></section>
<script>const phone=document.querySelector('.phone');const card=()=>`<div class="sheet"><section class="sheet-card"><button class="close" data-close>×</button><h3>佐藤</h3><div class="workout-meta"><span><b>3</b> 種目</span><span><b>9</b> セット</span><span>北大ジム</span></div><div class="exercise"><b>ベンチプレス</b><div class="sets"><span>72.5kg × 8回</span><span>70kg × 10回</span><span>70kg × 10回</span></div></div><div class="exercise"><b>ダンベルフライ</b><div class="sets"><span>14kg × 12回</span><span>14kg × 12回</span></div></div><div class="stamps"><button>💪</button><button>🔥</button><button>👏</button><button class="more">…</button></div></section></div>`;const finish=()=>`<div class="sheet"><section class="sheet-card confirm"><button class="close" data-close>×</button><h3>トレーニング終了</h3><p>保存したセットは履歴で確認できます。</p><button class="secondary" data-close>まだ続ける</button><button class="primary">今日のトレーニング終了</button></section></div>`;document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.person!==undefined)phone.insertAdjacentHTML('beforeend',card());if(b.dataset.finish!==undefined)phone.insertAdjacentHTML('beforeend',finish());if(b.dataset.close!==undefined)phone.querySelector('.sheet')?.remove()});</script>
</html>
