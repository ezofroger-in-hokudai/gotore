<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GO TORE — BESTアイコン</title>
<style>
:root{--bg:#f4f4f5;--panel:#fff;--text:#17191d;--muted:#656a74;--line:#dedfe3;--accent:#d32f2f;--orange:#ef7c20}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.intro{max-width:730px;margin:auto;padding:30px 20px 15px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.14em}h1{margin:5px 0;font-size:28px;letter-spacing:-.04em}.intro p{margin:0;color:var(--muted)}.samples{max-width:730px;margin:auto;padding:0 20px 40px;display:grid;grid-template-columns:repeat(5,minmax(105px,1fr));gap:10px}.sample{min-height:175px;border:1px solid var(--line);background:var(--panel);padding:15px 10px;text-align:center}.sample h2{margin:0;color:var(--muted);font-size:12px;font-weight:600}.sample p{margin:7px 0 0;color:var(--muted);font-size:11px}.person{display:inline-block;margin-top:24px}.avatar{position:relative;display:block;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#e3bda4,#76645d);outline:2px solid var(--accent);outline-offset:2px}.avatar::after{content:"";position:absolute;width:12px;height:12px;right:-5px;bottom:-4px;border:2px solid var(--panel);border-radius:50%;background:var(--accent)}.best{position:absolute;right:-10px;top:-12px;z-index:1;line-height:1}.fire{font-size:18px}.bolt{color:#e6a100;font-size:22px;font-weight:900;text-shadow:0 1px 0 #fff}.spark{color:#e48c12;font-size:22px;text-shadow:0 1px 0 #fff}.trophy{font-size:18px}.rise{display:grid;place-items:center;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:16px;font-weight:900;box-shadow:0 1px 2px rgb(0 0 0 / .15)}.caption{display:block;margin-top:11px;font-size:11px;color:var(--accent);font-weight:800}@media(max-width:620px){.intro{padding:22px 16px 12px}.samples{grid-template-columns:repeat(2,1fr);padding:0 16px 30px}.sample{min-height:158px}.sample:last-child{grid-column:1 / -1}}
</style>
<header class="intro"><span class="eyebrow">GO TORE / BESTアイコンだけ</span><h1>最高記録の印。</h1><p>どれも右上だけに置き、LIVEの赤い輪と右下の点は変えません。条件は最高重量または推定1RMの更新です。</p></header>
<main class="samples"><article class="sample"><h2>A　炎</h2><span class="person"><i class="avatar"><em class="best fire">🔥</em></i><b class="caption">佐藤</b></span><p>熱量が最も伝わる</p></article><article class="sample"><h2>B　稲妻</h2><span class="person"><i class="avatar"><em class="best bolt">⚡</em></i><b class="caption">佐藤</b></span><p>瞬発的で強い</p></article><article class="sample"><h2>C　きらめき</h2><span class="person"><i class="avatar"><em class="best spark">✦</em></i><b class="caption">佐藤</b></span><p>軽く、静かな達成感</p></article><article class="sample"><h2>D　トロフィー</h2><span class="person"><i class="avatar"><em class="best trophy">🏆</em></i><b class="caption">佐藤</b></span><p>記録更新と分かりやすい</p></article><article class="sample"><h2>E　上向き</h2><span class="person"><i class="avatar"><em class="best rise">↗</em></i><b class="caption">佐藤</b></span><p>数字が伸びた印</p></article></main></html>
