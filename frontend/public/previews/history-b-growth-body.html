      function workoutsFor(day,index){if(special[day])return special[day];if((index*11+Math.floor(index/7)*5)%17<8)return[];const base=["ベンチプレス","スクワット","ラットプルダウン"][index%3],second=catalog[(index*7)%catalog.length][0],names=[...new Set([base,second])];return[{time:"18:00",items:names.map((name,j)=>{const weight=base===name?45+index%8*3:18+index%5*4;return{name,sets:[[weight,8],[weight,8],[weight-5,10]]}})}]}

      }
      function maxPage(){return grain==="month"?3:grain==="week"?7:0}
      function monthPeriod(year,month){const start=`${year}-${String(month).padStart(2,"0")}-01`,last=new Date(Date.UTC(year,month,0)).getUTCDate(),end=`${year}-${String(month).padStart(2,"0")}-${String(last).padStart(2,"0")}`;return{label:`${month}月`,start,end}}
      function series(){
        let source;
        if(grain==="all")source=Array.from({length:11},(_,index)=>{const date=new Date(Date.UTC(2025,10+index,1));return monthPeriod(date.getUTCFullYear(),date.getUTCMonth()+1)});
        else if(grain==="month")source=Array.from({length:3},(_,index)=>{const date=new Date(Date.UTC(2026,6-page*3+index,1));return monthPeriod(date.getUTCFullYear(),date.getUTCMonth()+1)});
        else source=Array.from({length:6},(_,index)=>{const date=new Date(Date.UTC(2026,8,21)+((index-5)-page*6)*7*86400000),start=date.toISOString().slice(0,10),end=new Date(date.getTime()+6*86400000).toISOString().slice(0,10);return{label:`${Number(start.slice(5,7))}/${Number(start.slice(8,10))}`,start,end}});
        const periods=source.filter(period=>period.end>="2025-11-03").map(period=>{const items=allRecords.filter(record=>record.day>=period.start&&record.day<=period.end).flatMap(setsFor),numbers=stats(items),candidates=items.filter(item=>metric==="weight"?item.weight===numbers.weight:item.weight>0&&item.reps<=10&&Math.abs(item.weight*(1+item.reps/30)-(numbers.rm??0))<.001);return{...period,value:numbers[metric],source:candidates[0]?.name??""}});
        if(grain!=="all")return periods;
        let running=0,sourceName="";
        return periods.map(period=>{if(metric==="volume")running+=period.value??0;else if((period.value??0)>running){running=period.value;sourceName=period.source}return{...period,value:running,source:sourceName}});
      }
      function smoothPath(points){if(!points.length)return"";let path=`M${points[0][0]} ${points[0][1]}`;for(let i=0;i<points.length-1;i++){const p0=points[Math.max(0,i-1)],p1=points[i],p2=points[i+1],p3=points[Math.min(points.length-1,i+2)],c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;path+=` C${c1x} ${c1y},${c2x} ${c2y},${p2[0]} ${p2[1]}`}return path}
      function graph(){
        const values=series(),selected=values[point]??values.at(-1),numbers=values.map(item=>item.value).filter(value=>value!==null),minimum=numbers.length?Math.min(...numbers):0,maximum=numbers.length?Math.max(...numbers):1,min=metric==="volume"?0:Math.max(0,minimum-10),max=Math.max(maximum+1,metric==="volume"?1:minimum+20),y=value=>111-((value-min)/(max-min))*88,step=values.length>1?275/(values.length-1):0;
        const points=values.map((item,index)=>item.value===null?null:[24+index*step,y(item.value)]),curve=smoothPath(points.filter(Boolean));
        const marks=values.map((item,index)=>{if(item.value===null)return"";const x=24+index*step;return grain==="all"||metric!=="volume"?`<circle cx="${x}" cy="${y(item.value)}" r="${index===point?4.8:3}" fill="${index===point?'#d32f2f':'#fff'}" stroke="#d32f2f" stroke-width="2"/><circle data-point="${index}" cx="${x}" cy="${y(item.value)}" r="12" fill="transparent"/>`:`<rect data-point="${index}" x="${x-12}" y="${y(item.value)}" width="24" height="${111-y(item.value)}" rx="3" fill="${index===point?'#d32f2f':'#eaa19d'}"/>`}).join("");
        const metricNames={volume:"総負荷",weight:"最大重量",rm:"最大推定1RM"};
        const periodTabs=`<div class="period-tabs" aria-label="グラフの集計期間">${[["week","週"],["month","月"],["all","全期間"]].map(([key,label])=>`<button type="button" data-grain="${key}" aria-pressed="${grain===key}">${label}</button>`).join("")}</div>`;
        const metricTabs=`<div class="metric-tabs" aria-label="グラフの指標">${Object.entries(metricNames).map(([key,name])=>`<button type="button" data-metric="${key}" aria-pressed="${metric===key}">${name}</button>`).join("")}</div>`;
        const label=grain==="all"?"2025年11月–2026年9月":grain==="month"?`${values[0].label}–${values.at(-1).label}`:`${Number(values[0].start.slice(5,7))}/${Number(values[0].start.slice(8,10))}–${Number(values.at(-1).end.slice(5,7))}/${Number(values.at(-1).end.slice(8,10))}`;
        const line=(grain==="all"||metric!=="volume")&&curve?`<path class="trend-line" d="${curve}" fill="none" stroke="#d32f2f" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>`:"";
        const labels=values.map((item,index)=>`<span aria-label="${item.label}">${grain==="all"&&index%2===1&&index!==values.length-1?"":item.label}</span>`).join("");
        const pager=grain==="all"?`<div class="graph-pagination all-period"><span>開始から現在までの推移</span></div>`:`<div class="graph-pagination"><button type="button" data-page="older" ${page>=maxPage()?"disabled":""}>‹ 過去へ</button><span>グラフを横にスワイプ</span><button type="button" data-page="newer" ${page===0?"disabled":""}>新しく ›</button></div>`;
        return `<div class="graph-card graph-variant-1"><div class="graph-head"><h2>記録の推移</h2></div>${metricTabs}<p class="graph-period">${label} · ${grain==="all"?metric==="volume"?"累計":"それまでの最高値":metric==="volume"?"期間の合計":"期間の最高値"}</p><div class="graph-value"><strong>${selected.value===null?"—":format(selected.value)}<small>${selected.value===null?"":"kg"}</small></strong><span>${selected.label}${metric!=="volume"&&scope.kind!=="exercise"&&selected.source?` · ${selected.source}`:""}</span></div><div class="period-row"><span>表示単位</span>${periodTabs}</div><div class="graph-swipe-shell motion-${motion}" aria-label="${grain==="all"?"全期間の推移":"左右にスワイプして表示期間を移動"}">${grain!=="all"&&page<maxPage()?'<span class="graph-peek graph-peek-left" aria-hidden="true"></span>':""}<svg class="graph-svg" viewBox="0 0 320 132" role="img" aria-label="${scope.label}の${metricNames[metric]}を${grain==="week"?"週別":grain==="month"?"月別":"全期間"}で表示"><path d="M18 111H308M18 67H308M18 22H308" fill="none" stroke="#e9eaec" stroke-width="1"/>${line}${marks}</svg>${grain!=="all"&&page>0?'<span class="graph-peek graph-peek-right" aria-hidden="true"></span>':""}</div><div class="graph-labels" style="grid-template-columns:repeat(${values.length},1fr)">${labels}</div>${pager}<p class="graph-help">${metric==="volume"?"重量 × 回数の合計。":"最高値は足し合わせず、実際の1セットから選ぶ。"}ヒートマップと同じ表示範囲です。</p></div>`;
      }
      function shiftPage(direction){if(grain==="all")return;const next=Math.max(0,Math.min(maxPage(),page+direction));if(next===page)return;page=next;motion=direction>0?"older":"newer";point=grain==="month"?2:5;render()}
      function dayDetails(){const selected=records.find(record=>record.day===selectedDay),allItems=selected.workouts.flatMap(workout=>workout.items.flatMap(item=>item.sets.map(([weight,reps])=>({weight,reps})))),total=stats(allItems),used=parts.filter(part=>selected.workouts.some(workout=>workout.items.some(item=>itemPart.get(item.name)===part)));return `<div class="sheet-head"><h2>${dayLabel(selectedDay)}の全メニュー</h2><button type="button" class="close" data-close aria-label="閉じる">×</button></div><p class="muted" style="font-size:12px">${selected.workouts.length}回 · ${total.sets}セット · ${format(total.volume)}kg</p><div class="day-parts"><b>鍛えた部位</b>${used.length?used.map(part=>`<span>${part}</span>`).join(""):"<span>記録なし</span>"}</div>${selected.workouts.map(workout=>{const items=workout.items.flatMap(item=>item.sets.map(([weight,reps])=>({weight,reps}))),sum=stats(items);return `<article class="workout"><div class="workout-title"><b>${workout.time}</b><small>${workout.items.length}種目 · ${sum.sets}セット · ${format(sum.volume)}kg</small></div>${workout.items.map(item=>`<div class="exercise-row"><h3>${item.name}<small>${item.sets.length}セット</small></h3>${item.sets.map(([weight,reps],index)=>`<div class="set-row"><span>${index+1}セット</span><b>${weight?`${weight}kg`:"自重"} × ${reps}回</b></div>`).join("")}</div>`).join("")}</article>`}).join("")}`}
      function bodyStatus(){
        const recent=new Map();
        for(const record of records.filter(item=>item.day>="2026-09-26"&&item.day<="2026-09-28"))for(const workout of record.workouts)for(const item of workout.items){const part=itemPart.get(item.name);if(part)recent.set(part,record.day)}
        const active=part=>recent.has(part)?"true":"false";
        const frame=`<ellipse class="body-base" cx="65" cy="17" rx="10" ry="12"/><rect class="body-base" x="60" y="27" width="10" height="9" rx="3"/>
          <path class="body-base" d="M50 35 Q58 31 65 36 Q72 31 80 35 Q88 36 91 46 L86 85 Q84 101 84 114 Q73 121 65 121 Q57 121 46 114 Q46 101 44 85 L39 46 Q42 36 50 35Z"/>
          <path class="body-base" d="M41 40 Q32 39 29 52 L23 77 Q21 84 19 102 Q18 109 22 112 Q27 115 29 107 L32 88 L40 62 Q45 48 41 40Z M89 40 Q98 39 101 52 L107 77 Q109 84 111 102 Q112 109 108 112 Q103 115 101 107 L98 88 L90 62 Q85 48 89 40Z"/>
          <path class="body-base" d="M49 113 Q57 119 65 119 L64 151 Q61 166 59 189 Q59 195 52 196 L42 198 Q40 194 47 188 Q47 165 46 151 L44 126Z M81 113 Q73 119 65 119 L66 151 Q69 166 71 189 Q71 195 78 196 L88 198 Q90 194 83 188 Q83 165 84 151 L86 126Z"/>`;
        const shoulders=`<g data-part="肩" data-active="${active("肩")}"><path d="M39 41 Q46 34 52 40 L48 57 Q44 58 37 55Z M91 41 Q84 34 78 40 L82 57 Q86 58 93 55Z"/></g>`;
        const arms=`<g data-part="腕" data-active="${active("腕")}"><path d="M32 54 L40 57 Q38 68 34 81 L27 80Z M98 54 L90 57 Q92 68 96 81 L103 80Z M27 83 L33 84 L28 105 Q27 109 23 107Z M103 83 L97 84 L102 105 Q103 109 107 107Z"/></g>`;
        const legs=`<g data-part="脚" data-active="${active("脚")}"><path d="M49 120 Q58 123 63 121 L62 151 Q56 160 50 151Z M81 120 Q72 123 67 121 L68 151 Q74 160 80 151Z M50 155 Q56 159 61 154 L58 186 Q54 192 50 185Z M80 155 Q74 159 69 154 L72 186 Q76 192 80 185Z"/></g>`;
        const front=`<g>${frame}${shoulders}<g data-part="胸" data-active="${active("胸")}"><path d="M51 43 Q57 39 64 44 L64 66 Q57 69 49 62Z M79 43 Q73 39 66 44 L66 66 Q73 69 81 62Z"/></g>${arms}<g data-part="腹筋" data-active="${active("腹筋")}"><path d="M51 69 Q65 73 79 69 L78 99 Q65 105 52 99Z"/></g>${legs}<path class="anatomy-detail" d="M65 72V99 M54 79H76 M53 89H77"/></g>`;
        const back=`<g transform="translate(128,0)">${frame}${shoulders}<g data-part="背中" data-active="${active("背中")}"><path d="M49 43 Q65 38 81 43 L82 78 Q74 88 65 91 Q56 88 48 78Z"/></g>${arms}<g data-part="お尻" data-active="${active("お尻")}"><path d="M50 101 Q58 99 65 103 L65 119 Q56 122 48 115Z M80 101 Q72 99 65 103 L65 119 Q74 122 82 115Z"/></g>${legs}<path class="anatomy-detail" d="M65 45V92"/></g>`;
        return `<div class="body-card"><div class="body-head"><span><small>BODY STATUS · 試作</small><h2>最近使った部位</h2></span><b>直近3日</b></div><div class="body-model"><svg viewBox="0 0 258 204" role="img" aria-label="直近3日で使った部位の人体図。色付き: ${[...recent.keys()].join("・")||"なし"}">${front}${back}</svg><div class="body-labels"><span>前</span><span>後</span></div></div><div class="recent-parts">${parts.filter(part=>recent.has(part)).map(part=>`<span>${part}<small>${Number("2026-09-28".slice(8))-Number(recent.get(part).slice(8))}日前</small></span>`).join("")||"<span>最近の記録はありません</span>"}</div><p class="body-foot">9/26–9/28の記録の主部位から表示。疲労の測定ではありません。</p></div>`;
      }
      function pickerRows(){
        const query=search.trim().toLocaleLowerCase("ja-JP"),matches=catalog.filter(([name,part])=>name.toLocaleLowerCase("ja-JP").includes(query)&&(partFilter==="すべて"||partFilter===part));
        return `<button type="button" class="all-row" data-choose-all><b>全種目</b><small>すべての記録</small></button><p class="picker-caption">部位から探す</p><div class="part-chips" role="group" aria-label="部位で絞り込み">${parts.map(part=>`<button type="button" data-filter-part="${part}" aria-pressed="${partFilter===part}">${part}</button>`).join("")}</div>${partFilter!=="すべて"?`<button type="button" class="part-row" data-choose-part="${partFilter}"><b>${partFilter}全体を見る</b><small>部位の合計</small></button>`:""}<p class="picker-caption">種目を選ぶ · ${matches.length}件</p>${matches.map(([name,part])=>`<button type="button" class="picker-row" data-choose-exercise="${name}"><b>${name}</b><small>${part}</small></button>`).join("")}${matches.length?"":"<p class=\"muted\">該当する種目はありません</p>"}`;

      function overlayContent(){if(!overlay)return"";const content=overlay==="day"?dayDetails():`<div class="sheet-head"><h2>表示する記録</h2><button type="button" class="close" data-close aria-label="閉じる">×</button></div><input class="search" id="scopeSearch" type="search" placeholder="種目名で検索" value="${search.replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;")}" aria-label="種目名で検索"/><div id="pickerRows">${pickerRows()}</div>`;return `<div class="overlay" data-backdrop><div class="sheet" role="dialog" aria-label="${overlay==="day"?"その日の全メニュー":"表示する記録"}"><div class="sheet-body">${content}</div></div></div>`}
      function render(reset=false){const phone=document.getElementById("phone"),scroll=phone.querySelector(".screen")?.scrollTop??0;phone.innerHTML=`<header class="app-header"><div class="logo">E-GO<span>TORE</span></div></header><div class="screen"><p class="eyebrow">MY HISTORY</p><h1>自分の積み重ね</h1><p class="intro">2025年11月から</p><div class="lifetime"><p class="lifetime-label">全種目・これまでの総負荷</p><div class="lifetime-number">${format(lifetimeStats.volume)}<small>kg</small></div><div class="lifetime-row"><div><strong>${lifetimeWorkouts}回</strong><small>トレーニング</small></div><div><strong>${format(lifetimeStats.sets)}</strong><small>セット</small></div></div></div><button type="button" class="scope-button" data-open-scope><span><small>表示する記録 · ヒートマップとグラフ共通</small><b>${scope.label}</b></span><span class="arrow">⌄</span></button><section class="section"><div class="section-head"><h2>トレーニングの足あと</h2><small>直近13週間</small></div>${heatmap()}</section><section class="section">${graph()}</section><section class="section">${bodyStatus()}</section></div><button type="button" class="start" aria-label="記録を開始する見本">START</button><nav class="bottom-nav" aria-label="メインナビゲーション"><button type="button">ホーム</button><button type="button">グループ</button><button type="button" class="on" aria-current="page">履歴</button><button type="button">設定</button></nav>${overlayContent()}`;phone.querySelector(".screen").scrollTop=reset?0:scroll}
      function setScope(kind,value,label){scope={kind,value,label};overlay="";motion="fade";point=grain==="week"?5:grain==="all"?10:2;render()}
      document.addEventListener("click",event=>{const day=event.target.closest("[data-day]");if(day){selectedDay=day.dataset.day;overlay="day";render();return}if(event.target.closest("[data-open-day]")){overlay="day";render();return}if(event.target.closest("[data-open-scope]")){overlay="scope";search="";partFilter="すべて";render();return}if(event.target.closest("[data-close]")||event.target.hasAttribute("data-backdrop")){overlay="";render();return}if(event.target.closest("[data-choose-all]")){setScope("all","","全種目");return}const part=event.target.closest("[data-choose-part]");if(part){setScope("part",part.dataset.choosePart,`${part.dataset.choosePart}全体`);return}const exercise=event.target.closest("[data-choose-exercise]");if(exercise){setScope("exercise",exercise.dataset.chooseExercise,exercise.dataset.chooseExercise);return}const filter=event.target.closest("[data-filter-part]");if(filter){partFilter=partFilter===filter.dataset.filterPart?"すべて":filter.dataset.filterPart;document.getElementById("pickerRows").innerHTML=pickerRows();return}const g=event.target.closest("[data-grain]");if(g){grain=g.dataset.grain;page=0;motion="fade";point=grain==="week"?5:grain==="all"?10:2;render();return}const pager=event.target.closest("[data-page]");if(pager){shiftPage(pager.dataset.page==="older"?1:-1);return}const m=event.target.closest("[data-metric]");if(m){metric=m.dataset.metric;motion="fade";render();return}const selected=event.target.closest("[data-point]");if(selected){point=Number(selected.dataset.point);render()}});
      document.addEventListener("input",event=>{if(event.target.id==="scopeSearch"){search=event.target.value;document.getElementById("pickerRows").innerHTML=pickerRows()}});
      document.addEventListener("keydown",event=>{if(event.key==="Escape"&&overlay){overlay="";render()}});
      let swipeStartX=null,swipeShell=null;
      document.addEventListener("pointerdown",event=>{if(grain==="all")return;swipeShell=event.target.closest(".graph-swipe-shell");if(swipeShell)swipeStartX=event.clientX});
      document.addEventListener("pointermove",event=>{if(swipeStartX===null||!swipeShell)return;const delta=Math.max(-45,Math.min(45,(event.clientX-swipeStartX)*.3));swipeShell.style.transform=`translateX(${delta}px)`});
      document.addEventListener("pointerup",event=>{if(swipeStartX===null)return;const delta=event.clientX-swipeStartX;if(swipeShell)swipeShell.style.transform="";swipeStartX=null;swipeShell=null;if(Math.abs(delta)>40)shiftPage(delta>0?1:-1)});
      document.addEventListener("pointercancel",()=>{if(swipeShell)swipeShell.style.transform="";swipeStartX=null;swipeShell=null});
      render();
