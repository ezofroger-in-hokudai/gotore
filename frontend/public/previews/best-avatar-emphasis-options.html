<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GO TORE — BEST強調</title>
<style>
:root{--bg:#f4f4f5;--panel:#fff;--text:#17191d;--muted:#656a74;--line:#dedfe3;--accent:#d32f2f;--best:#ef7c20}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.intro{max-width:820px;margin:auto;padding:30px 20px 15px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.14em}h1{margin:5px 0;font-size:28px;letter-spacing:-.04em}.intro p{margin:0;color:var(--muted)}.samples{max-width:820px;margin:auto;padding:0 20px 40px;display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:12px}.sample{min-height:210px;border:1px solid var(--line);background:var(--panel);padding:16px 10px;text-align:center}.sample h2{margin:0;color:var(--muted);font-size:12px;font-weight:600}.sample p{margin:8px 0 0;color:var(--muted);font-size:11px}.person{display:inline-block;margin-top:30px}.avatar{position:relative;display:block;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#e3bda4,#76645d);outline:2px solid var(--accent);outline-offset:2px}.avatar::after{content:"";position:absolute;width:12px;height:12px;right:-5px;bottom:-4px;border:2px solid var(--panel);border-radius:50%;background:var(--accent)}.fire{position:absolute;right:-10px;top:-11px;font-size:18px;line-height:1;z-index:2}.avatar.ring{outline:3px solid var(--best);outline-offset:3px}.avatar.halo{box-shadow:0 0 0 5px #ffe4cf,0 0 13px #f5a358}.avatar.corner::before{content:"";position:absolute;right:-4px;top:-4px;width:17px;height:17px;border-top:3px solid var(--best);border-right:3px solid var(--best);border-radius:0 8px 0 0}.name{display:block;position:relative;min-height:18px;margin-top:12px;font-size:12px;font-weight:800}.name.under::after{content:"";position:absolute;left:50%;bottom:-3px;width:16px;height:2px;transform:translateX(-50%);background:var(--best)}.caption{display:block;margin-top:12px;font-size:11px;color:var(--accent);font-weight:800}@media(max-width:620px){.intro{padding:22px 16px 12px}.samples{grid-template-columns:repeat(2,1fr);padding:0 16px 30px}.sample{min-height:190px}}
</style>
<header class="intro"><span class="eyebrow">GO TORE / BESTアイコンの強調だけ</span><h1>最高記録をどう目立たせるか。</h1><p>右下の赤い点はLIVE。最高重量または推定1RMを更新した人だけ、以下のいずれかを追加します。</p></header>
<main class="samples"><article class="sample"><h2>A　右上の炎</h2><span class="person"><i class="avatar"><em class="fire">🔥</em></i><b class="name">佐藤</b></span><p>図を使うなら一番自然</p></article><article class="sample"><h2>B　オレンジの外周</h2><span class="person"><i class="avatar ring"></i><b class="name">佐藤</b></span><p>図なしで勲章感を出す</p></article><article class="sample"><h2>C　淡い発光</h2><span class="person"><i class="avatar halo"></i><b class="name">佐藤</b></span><p>一番やる気が出るが控えめ</p></article><article class="sample"><h2>D　名前下の短い線</h2><span class="person"><i class="avatar corner"></i><b class="name under">佐藤</b></span><p>静かで、画面を汚さない</p></article></main></html>
