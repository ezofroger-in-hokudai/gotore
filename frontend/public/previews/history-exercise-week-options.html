<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-GOTORE 履歴・種目選択と週表示の3案</title>
    <style>
      :root{color-scheme:light;--ink:#202127;--red:#d32f2f;--paper:#f5f5f6;--line:#e1e2e5;--muted:#696b71;--track:#ececef}
      *{box-sizing:border-box}html,body{margin:0;min-height:100%}
      body{background:#e9eaed;color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
      button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #d32f2f66;outline-offset:2px}
      .controls{position:sticky;top:0;z-index:20;padding:10px 12px;background:#fffffff7;border-bottom:1px solid #d4d5d8;backdrop-filter:blur(10px)}
      .controls-inner{max-width:760px;margin:auto}.controls-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.controls-title strong{font-size:15px}.controls-title small{color:var(--muted);font-size:11px}
      .option-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px;padding:4px;border-radius:8px;background:var(--track)}
      .option-tabs button{min-height:42px;padding:4px;border:0;border-radius:6px;background:transparent;color:#62646a;font-size:11px;font-weight:700}.option-tabs button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0002}
      .option-note{margin:7px 2px 0;min-height:17px;color:#57595f;font-size:11px}
      .stage{display:flex;justify-content:center;padding:14px 0 24px}.phone{position:relative;display:flex;flex-direction:column;width:min(100%,390px);height:min(844px,calc(100dvh - 154px));min-height:520px;overflow:hidden;background:var(--paper);box-shadow:0 16px 42px #16181e2b}
      .app-header{flex:none;display:flex;align-items:center;height:48px;padding:0 16px;background:var(--ink);color:#fff}.logo{font-size:22px;font-weight:900;letter-spacing:-.7px}.logo span{color:#ff625b}
      .screen{flex:1;overflow-y:auto;padding:15px 16px 120px;scrollbar-width:thin}h1,h2,h3,p{margin:0}h1{font-size:21px;line-height:1.25}h2{font-size:16px;line-height:1.3}h3{font-size:13px}
      .eyebrow{color:var(--red);font-size:10px;font-weight:800;letter-spacing:.12em}.intro{margin:3px 0 15px;color:var(--muted);font-size:12px}.muted{color:var(--muted)}
      .section{margin-top:19px}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:9px}.section-head small{color:var(--muted);font-size:11px}
      .lifetime{padding:15px;border-radius:12px;background:var(--ink);color:#fff}.lifetime-label{color:#c7c8ce;font-size:11px}.lifetime-number{margin:3px 0 13px;font-size:32px;font-weight:850;line-height:1.15;letter-spacing:-1.4px;white-space:nowrap}.lifetime-number small{margin-left:3px;font-size:15px;letter-spacing:0}
      .lifetime-row{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #55575d}.lifetime-row div{padding:10px 0 0}.lifetime-row div+div{padding-left:15px;border-left:1px solid #55575d}.lifetime-row strong{font-size:17px}.lifetime-row small{margin-left:4px;color:#c7c8ce;font-size:11px}
      .heatmap-card,.graph-card{padding:12px 11px;border:1px solid var(--line);border-radius:11px;background:#fff}
      .month-labels{display:flex;justify-content:space-around;margin:0 0 7px 16px;color:var(--muted);font-size:10px}.heatmap-wrap{display:flex;gap:5px}.weekdays{display:grid;grid-template-rows:repeat(7,11px);gap:3px;width:15px;color:var(--muted);font-size:9px;line-height:11px}
      .heatmap{display:grid;flex:1;grid-auto-flow:column;grid-template-rows:repeat(7,11px);grid-auto-columns:minmax(0,1fr);gap:3px}.heatmap button{min-width:0;width:100%;height:11px;padding:0;border:0;border-radius:2px;background:#e9eaec}
      .heatmap button[data-level="1"]{background:#f6d8d6}.heatmap button[data-level="2"]{background:#eaa19d}.heatmap button[data-level="3"]{background:#d95550}.heatmap button[data-level="4"]{background:#ad2525}.heatmap button[aria-pressed="true"]{outline:2px solid #27282d;outline-offset:1px}
      .heatmap-foot{display:flex;justify-content:space-between;gap:6px;margin-top:8px;color:var(--muted);font-size:10px}.heatmap-key{display:flex;align-items:center;gap:3px;white-space:nowrap}.heatmap-key i{width:9px;height:9px;border-radius:2px;background:#e9eaec}.heatmap-key i:nth-of-type(2){background:#f6d8d6}.heatmap-key i:nth-of-type(3){background:#eaa19d}.heatmap-key i:nth-of-type(4){background:#d95550}.heatmap-key i:nth-of-type(5){background:#ad2525}
      .day-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:12px}.day-head small{color:var(--muted);font-size:11px}.day-open{min-height:36px;padding:0 2px;border:0;background:transparent;color:var(--red);font-size:12px;font-weight:700}
      .day-records{margin-top:7px}.workout{padding:10px 0;border-top:1px solid var(--line)}.workout:first-child{border-top:0}.workout-title{display:flex;justify-content:space-between;gap:5px;font-size:12px}.workout-title small{color:var(--muted);font-size:10px}.exercise-row{margin-top:9px;padding:9px 10px;border-radius:7px;background:#f5f5f6}.exercise-row h3{display:flex;justify-content:space-between;gap:6px;margin-bottom:4px}.exercise-row h3 small{color:var(--muted);font-size:10px;font-weight:500}.set-row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;color:#55575c;font-size:11px}.set-row b{color:var(--ink);font-size:11px}
      .graph-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.exercise-trigger{max-width:160px;min-height:40px;padding:0 11px;border:1px solid #cfd0d3;border-radius:7px;background:#fff;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.exercise-trigger span{margin-left:5px;color:var(--muted)}
      .graph-selection{max-width:145px;overflow:hidden;color:var(--muted);font-size:11px;text-overflow:ellipsis;white-space:nowrap}
      .quick-exercises{display:flex;gap:5px;margin-top:10px;overflow-x:auto;scrollbar-width:none}.quick-exercises button{flex:none;min-height:38px;padding:0 10px;border:1px solid var(--line);border-radius:19px;background:#fff;color:#55575d;font-size:11px;font-weight:700}.quick-exercises button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}.quick-exercises button:last-child{color:var(--red)}
      .scale-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:11px;padding:4px;border-radius:7px;background:var(--track)}.scale-tabs button,.metric-tabs button{min-height:39px;padding:3px;border:0;border-radius:5px;background:transparent;color:#62646a;font-size:12px;font-weight:700}.scale-tabs button[aria-pressed="true"],.metric-tabs button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0002}
      .metric-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:7px;padding:4px;border-radius:7px;background:var(--track)}.metric-tabs button{font-size:10px}
      .graph-period{margin-top:12px;color:var(--muted);font-size:11px}.graph-value{display:flex;align-items:baseline;gap:7px;margin-top:2px}.graph-value strong{font-size:28px;line-height:1.2;letter-spacing:-1px}.graph-value small{font-size:13px;letter-spacing:0}.graph-value span{color:var(--muted);font-size:11px}
      .graph-svg{display:block;width:100%;height:128px;margin-top:5px;overflow:visible}.graph-labels{display:grid;grid-template-columns:repeat(6,1fr);color:var(--muted);font-size:10px;text-align:center}.graph-help{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);color:var(--muted);font-size:10px}
      .bottom-nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);height:66px;border-top:1px solid var(--line);background:#fff}.bottom-nav button{position:relative;border:0;background:transparent;color:#73757a;font-size:12px}.bottom-nav button.on{color:var(--red);font-weight:800}.bottom-nav button.on:before{content:"";position:absolute;top:0;left:20%;right:20%;height:2px;background:var(--red)}
      .start{position:absolute;right:16px;bottom:78px;z-index:4;width:112px;height:52px;border:0;border-radius:12px;background:var(--red);color:#fff;box-shadow:0 7px 20px #661d1d46;font-weight:900;letter-spacing:.08em}
      .overlay{position:absolute;inset:48px 0 0;z-index:8;background:#0007}.sheet{position:absolute;right:0;bottom:0;left:0;display:flex;flex-direction:column;max-height:82%;padding:14px 16px 23px;border-radius:18px 18px 0 0;background:#fff;box-shadow:0 -12px 32px #0002}.sheet-body{overflow-y:auto}.sheet-head,.page-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.sheet-head h2,.page-head h2{font-size:18px}.close{width:44px;height:44px;border:0;border-radius:50%;background:#f0f0f2;font-size:22px}
      .picker-page{position:absolute;inset:48px 0 66px;z-index:8;overflow-y:auto;padding:14px 16px;background:var(--paper)}.picker-page .picker-body{padding-bottom:20px}.back{min-height:44px;padding:0 5px;border:0;background:transparent;font-weight:700}
      .search{width:100%;height:45px;padding:0 12px;border:1px solid #bfc1c6;border-radius:8px;background:#fff;font-size:16px}.picker-caption{margin:12px 1px 5px;color:var(--muted);font-size:11px}
      .picker-row{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:45px;padding:8px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;font-size:13px}.picker-row span{color:var(--muted);font-size:11px}
      .part-tabs{display:flex;gap:5px;margin:9px 0;overflow-x:auto;scrollbar-width:none}.part-tabs button{flex:none;min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:18px;background:#fff;font-size:11px}.part-tabs button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
      .detail-page{position:absolute;inset:48px 0 66px;z-index:8;overflow-y:auto;padding:14px 16px 24px;background:var(--paper)}.detail-page .workout{padding:12px;background:#fff;border:1px solid var(--line);border-radius:9px;margin:9px 0}
      @media(max-width:520px){.controls-title small{display:none}.stage{padding:0}.phone{width:100%;height:calc(100dvh - 110px);min-height:480px;box-shadow:none}}
    </style>
  </head>
  <body>
    <aside class="controls" aria-label="比較する案"><div class="controls-inner"><div class="controls-title"><strong>履歴・選択と週表示 3案</strong><small>架空データを用いた操作可能なプレビュー</small></div><div class="option-tabs" id="options"></div><p class="option-note" id="note"></p></div></aside>
    <main class="stage"><div class="phone" id="phone"></div></main>
    <script>
      const optionInfo=[
        {label:"A 検索シート",note:"種目は検索シート。日付の全メニューはヒートマップ直下で展開。"},
        {label:"B 一覧ページ",note:"種目は部位で絞れる一覧。日付の全メニューは独立した詳細面。"},
        {label:"C 最近＋検索",note:"最近の種目だけ即切替。検索と日付の全メニューは下から開く。"}
      ];
      const catalog=[
        ["ベンチプレス","胸"],["ダンベルフライ","胸"],["インクラインベンチプレス","胸"],["チェストプレス","胸"],["腕立て伏せ","胸"],["ケーブルクロスオーバー","胸"],
        ["スクワット","脚"],["レッグプレス","脚"],["デッドリフト","脚"],["ランジ","脚"],["レッグカール","脚"],["レッグエクステンション","脚"],
        ["ラットプルダウン","背中"],["懸垂","背中"],["シーテッドロー","背中"],["ベントオーバーロー","背中"],["ワンハンドロー","背中"],
        ["ショルダープレス","肩"],["サイドレイズ","肩"],["リアレイズ","肩"],["アップライトロー","肩"],
        ["アームカール","腕"],["ハンマーカール","腕"],["トライセプスプレスダウン","腕"],["ディップス","腕"],
        ["クランチ","腹筋"],["レッグレイズ","腹筋"],["プランク","腹筋"],["ヒップスラスト","お尻"],["グルートブリッジ","お尻"]
      ];
      const dayWorkouts=[
        {time:"朝 07:35",items:[{name:"ベンチプレス",sets:[[70,5],[65,8],[60,10]]},{name:"ダンベルフライ",sets:[[16,10],[16,10],[14,12]]},{name:"ショルダープレス",sets:[[24,8],[22,10],[20,12]]}]},
        {time:"夜 19:10",items:[{name:"スクワット",sets:[[80,8],[80,8],[75,10],[70,12]]},{name:"ラットプルダウン",sets:[[50,10],[50,10],[45,12]]},{name:"アームカール",sets:[[14,10],[14,10]]}]}
      ];
      const sampleDays={"2026-09-27":dayWorkouts,"2026-09-24":[{time:"18:20",items:[{name:"スクワット",sets:[[90,5],[85,8],[80,10]]},{name:"レッグプレス",sets:[[120,10],[120,10],[110,12]]}]}],"2026-09-21":[{time:"09:15",items:[{name:"懸垂",sets:[[0,8],[0,7],[0,6]]},{name:"ラットプルダウン",sets:[[50,10],[45,12],[45,12]]}]}]};
      const months=["4月","5月","6月","7月","8月","9月"],weeks=["8/17","8/24","8/31","9/7","9/14","9/21"];
      const allSeries={month:{volume:[28000,30500,32000,33700,35000,37790],weight:[85,90,90,95,95,100],rm:[106,111,114,118,120,126]},week:{volume:[7100,8500,7600,9400,8100,10400],weight:[90,95,90,95,100,100],rm:[115,118,115,120,126,126]}};
      let option=0,grain="month",metric="volume",exercise="全種目",selectedPoint=5,selectedDay="2026-09-27",dayOpen=false,overlay="",search="",part="すべて";
      const first=new Date(Date.UTC(2026,5,29));
      const format=(value)=>Number(value).toLocaleString("ja-JP");
      const dayLabel=(day)=>`${Number(day.slice(5,7))}月${Number(day.slice(8,10))}日`;
      const totals=(workouts)=>{let sets=0,volume=0;for(const workout of workouts)for(const item of workout.items)for(const [weight,reps] of item.sets){sets++;volume+=weight*reps}return{sets,volume}};
      function dayLevel(index){return(index*11+Math.floor(index/7)*5)%17<8?0:1+((index*3+Math.floor(index/6))%4)}
      function dayRecords(day,index){if(sampleDays[day])return sampleDays[day];if(!dayLevel(index))return[];const value=32+dayLevel(index)*4;return[{time:"18:00",items:[{name:"ベンチプレス",sets:[[value,8],[value,8],[value-5,10]]},{name:"ラットプルダウン",sets:[[45,10],[45,10],[40,12]]}]}]}
      function menuDetails(workouts){return workouts.map((workout)=>{const total=totals([workout]);return `<article class="workout"><div class="workout-title"><b>${workout.time}のトレーニング</b><small>${workout.items.length}種目 · ${total.sets}セット · ${format(total.volume)}kg</small></div>${workout.items.map((item)=>`<div class="exercise-row"><h3>${item.name}<small>${item.sets.length}セット</small></h3>${item.sets.map(([weight,reps],index)=>`<div class="set-row"><span>${index+1}セット</span><b>${weight?`${weight}kg`:"自重"} × ${reps}回</b></div>`).join("")}</div>`).join("")}</article>`}).join("")}
      function heatmap(){const cells=Array.from({length:91},(_,index)=>{const day=new Date(first.getTime()+index*86400000).toISOString().slice(0,10);const level=sampleDays[day]?Math.max(2,Math.min(4,Math.ceil(totals(sampleDays[day]).volume/3000))):dayLevel(index);return `<button type="button" data-day="${day}" data-level="${level}" aria-label="${dayLabel(day)} ${level?"記録あり":"記録なし"}" aria-pressed="${selectedDay===day}"></button>`}).join("");const index=Math.round((Date.parse(`${selectedDay}T00:00:00Z`)-first.getTime())/86400000),workouts=dayRecords(selectedDay,index),total=totals(workouts);return `<div class="heatmap-card"><div class="month-labels"><span>7月</span><span>8月</span><span>9月</span></div><div class="heatmap-wrap"><div class="weekdays"><span>月</span><span></span><span>水</span><span></span><span>金</span><span></span><span>日</span></div><div class="heatmap">${cells}</div></div><div class="heatmap-foot"><span>6/29–9/27 · 日別の総負荷</span><span class="heatmap-key">少 <i></i><i></i><i></i><i></i><i></i> 多</span></div><div class="day-head"><b>${dayLabel(selectedDay)}</b><small>${workouts.length?`${workouts.length}回 · ${total.sets}セット · ${format(total.volume)}kg`:"記録なし"}</small></div>${option===0&&workouts.length?`<button type="button" class="day-open" data-toggle-day aria-expanded="${dayOpen}">${dayOpen?"メニューを閉じる":"全メニューを見る　›"}</button>`:""}${option===0&&dayOpen?`<div class="day-records">${menuDetails(workouts)}</div>`:""}${option!==0&&workouts.length?`<button type="button" class="day-open" data-show-day>全メニューを見る　›</button>`:""}</div>`}
      function series(){if(exercise==="全種目")return allSeries[grain][metric];const index=Math.max(0,catalog.findIndex(([name])=>name===exercise));const base=allSeries[grain][metric];const factor=.16+(index%7)*.045;return base.map((value,i)=>metric==="volume"?Math.round(value*factor/100)*100:Math.round((value*.48+index*2+i*1.5)*2)/2)}
      function graph(){const values=series(),names=grain==="month"?months:weeks,value=values[selectedPoint],min=metric==="volume"?0:Math.min(...values)-12,max=Math.max(...values)*1.12,y=(v)=>111-((v-min)/(max-min))*88;const points=values.map((v,i)=>`${24+i*55},${y(v)}`).join(" ");const marks=values.map((v,i)=>metric==="volume"?`<rect data-point="${i}" x="${12+i*55}" y="${y(v)}" width="24" height="${111-y(v)}" rx="3" fill="${i===selectedPoint?'#d32f2f':'#eaa19d'}"><title>${names[i]} ${format(v)}kg</title></rect>`:`<circle cx="${24+i*55}" cy="${y(v)}" r="${i===selectedPoint?5:3.5}" fill="${i===selectedPoint?'#d32f2f':'#fff'}" stroke="#d32f2f" stroke-width="2"/><circle data-point="${i}" cx="${24+i*55}" cy="${y(v)}" r="18" fill="transparent"><title>${names[i]} ${format(v)}kg</title></circle>`).join("");const caption=exercise==="全種目"&&metric!=="volume"?" · スクワット":"";return `<div class="graph-card"><div class="graph-top"><h2>記録の推移</h2>${option===2?`<span class="graph-selection">${exercise}</span>`:`<button type="button" class="exercise-trigger" data-picker>${exercise}<span>⌄</span></button>`}</div>${option===2?`<div class="quick-exercises">${["全種目","ベンチプレス","スクワット"].map(name=>`<button type="button" data-quick="${name}" aria-pressed="${exercise===name}">${name}</button>`).join("")}<button type="button" data-picker>⌕ 種目を探す</button></div>`:""}<div class="scale-tabs" aria-label="グラフの期間単位"><button type="button" data-grain="week" aria-pressed="${grain==="week"}">週ごと</button><button type="button" data-grain="month" aria-pressed="${grain==="month"}">月ごと</button></div><div class="metric-tabs" aria-label="グラフの指標"><button type="button" data-metric="volume" aria-pressed="${metric==="volume"}">総負荷</button><button type="button" data-metric="weight" aria-pressed="${metric==="weight"}">最大重量</button><button type="button" data-metric="rm" aria-pressed="${metric==="rm"}">最大推定1RM</button></div><p class="graph-period">${grain==="week"?"8/17–9/27 · 週別":"4月–9月 · 月別"} · ${metric==="volume"?"合計":"期間内の最高値"}</p><div class="graph-value"><strong>${format(value)}<small>kg</small></strong><span>${names[selectedPoint]}${caption}</span></div><svg class="graph-svg" viewBox="0 0 320 132" role="img" aria-label="${exercise}の${metric}を${grain==="week"?"週別":"月別"}で表示"><path d="M18 111H308M18 67H308M18 22H308" fill="none" stroke="#e9eaec" stroke-width="1"/>${metric==="volume"?"":`<polyline points="${points}" fill="none" stroke="#d32f2f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`}${marks}</svg><div class="graph-labels">${names.map(name=>`<span>${name}</span>`).join("")}</div><p class="graph-help">${grain==="week"?"月曜始まりの1週間ごと。":"月ごと。"}${metric==="volume"?"保存した重量 × 回数の合計。":exercise==="全種目"?"全種目のうち最高の1セット。該当種目も表示。":"選択した種目の最高の1セット。"}</p></div>`}
      function pickerRows(){const query=search.trim().toLocaleLowerCase("ja-JP"),recent=["ベンチプレス","スクワット","ラットプルダウン"],matched=catalog.filter(([name,body])=>(part==="すべて"||body===part)&&name.toLocaleLowerCase("ja-JP").includes(query)&&(query||option===1||!recent.includes(name)));return `<button type="button" class="picker-row" data-choose="全種目"><b>全種目</b><span>すべての記録</span></button>${option===1?`<div class="part-tabs">${["すべて","胸","背中","脚","肩","腕","腹筋","お尻"].map(name=>`<button type="button" data-part="${name}" aria-pressed="${part===name}">${name}</button>`).join("")}</div>`:""}<p class="picker-caption">${query?`${matched.length}件`:(option===1?`${part}の種目`:"最近使った種目")}</p>${!query&&option!==1?recent.map(name=>`<button type="button" class="picker-row" data-choose="${name}"><b>${name}</b><span>最近</span></button>`).join(""):""}${matched.map(([name,body])=>`<button type="button" class="picker-row" data-choose="${name}"><b>${name}</b><span>${body}</span></button>`).join("")}${matched.length?"":"<p class=\"picker-caption\">該当する種目はありません</p>"}`}
      function overlayContent(){if(!overlay)return"";if(overlay==="picker"){const content=`<div class="${option===1?"page-head":"sheet-head"}"><h2>種目を選択</h2><button type="button" class="close" data-close aria-label="閉じる">×</button></div><input class="search" id="exerciseSearch" type="search" placeholder="種目名で検索" value="${search.replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;")}" aria-label="種目名で検索"/><div id="pickerRows">${pickerRows()}</div>`;return option===1?`<div class="picker-page"><div class="picker-body">${content}</div></div>`:`<div class="overlay" data-backdrop><div class="sheet" role="dialog" aria-label="種目を選択"><div class="sheet-body">${content}</div></div></div>`}const index=Math.round((Date.parse(`${selectedDay}T00:00:00Z`)-first.getTime())/86400000),workouts=dayRecords(selectedDay,index),total=totals(workouts),content=`<div class="${option===1?"page-head":"sheet-head"}"><h2>${dayLabel(selectedDay)}の全メニュー</h2><button type="button" class="close" data-close aria-label="閉じる">×</button></div><p class="muted" style="font-size:12px">${workouts.length}回 · ${total.sets}セット · ${format(total.volume)}kg</p><div class="day-records">${menuDetails(workouts)}</div>`;return option===1?`<div class="detail-page">${content}</div>`:`<div class="overlay" data-backdrop><div class="sheet" role="dialog" aria-label="その日の全メニュー"><div class="sheet-body">${content}</div></div></div>`}
      function render(reset=false){document.getElementById("options").innerHTML=optionInfo.map((item,i)=>`<button type="button" data-option="${i}" aria-pressed="${i===option}">${item.label}</button>`).join("");document.getElementById("note").textContent=optionInfo[option].note;const phone=document.getElementById("phone"),scroll=phone.querySelector(".screen")?.scrollTop??0;phone.innerHTML=`<header class="app-header"><div class="logo">E-GO<span>TORE</span></div></header><div class="screen"><p class="eyebrow">MY HISTORY</p><h1>自分の積み重ね</h1><p class="intro">2025年11月から</p><div class="lifetime"><p class="lifetime-label">これまでの総負荷</p><div class="lifetime-number">246,380<small>kg</small></div><div class="lifetime-row"><div><strong>84回</strong><small>トレーニング</small></div><div><strong>1,026</strong><small>セット</small></div></div></div><section class="section"><div class="section-head"><h2>トレーニングの足あと</h2><small>直近13週間</small></div>${heatmap()}</section><section class="section">${graph()}</section></div><button type="button" class="start" aria-label="記録を開始する見本">START</button><nav class="bottom-nav" aria-label="メインナビゲーション"><button type="button">ホーム</button><button type="button">グループ</button><button type="button" class="on" aria-current="page">履歴</button><button type="button">設定</button></nav>${overlayContent()}`;phone.querySelector(".screen").scrollTop=reset?0:scroll}
      document.addEventListener("click",event=>{const optionButton=event.target.closest("[data-option]");if(optionButton){option=Number(optionButton.dataset.option);overlay="";dayOpen=false;part="すべて";search="";render(true);return}const day=event.target.closest("[data-day]");if(day){selectedDay=day.dataset.day;dayOpen=option===0;overlay=option===0?"":"day";render();return}if(event.target.closest("[data-toggle-day]")){dayOpen=!dayOpen;render();return}if(event.target.closest("[data-show-day]")){overlay="day";render();return}if(event.target.closest("[data-picker]")){overlay="picker";search="";part="すべて";render();return}if(event.target.closest("[data-close]")||(event.target.hasAttribute("data-backdrop"))){overlay="";render();return}const chosen=event.target.closest("[data-choose]");if(chosen){exercise=chosen.dataset.choose;overlay="";selectedPoint=5;render();return}const body=event.target.closest("[data-part]");if(body){part=body.dataset.part;document.getElementById("pickerRows").innerHTML=pickerRows();return}const quick=event.target.closest("[data-quick]");if(quick){exercise=quick.dataset.quick;selectedPoint=5;render();return}const scale=event.target.closest("[data-grain]");if(scale){grain=scale.dataset.grain;selectedPoint=5;render();return}const measure=event.target.closest("[data-metric]");if(measure){metric=measure.dataset.metric;selectedPoint=5;render();return}const point=event.target.closest("[data-point]");if(point){selectedPoint=Number(point.dataset.point);render()}});
      document.addEventListener("input",event=>{if(event.target.id==="exerciseSearch"){search=event.target.value;document.getElementById("pickerRows").innerHTML=pickerRows()}});
      document.addEventListener("keydown",event=>{if(event.key==="Escape"&&overlay){overlay="";render()}});
      render();
    </script>
  </body>
</html>
