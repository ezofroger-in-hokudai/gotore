<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>E-GOTORE タイムライン絞り込み4案</title>
    <style>
      :root { --red:#df2f35; --ink:#202127; --muted:#747881; --line:#d9dbe0; --page:#f5f5f6; }
      * { box-sizing:border-box; }
      body { margin:0; background:#e5e6e9; color:#17181c; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif; }
      button { font:inherit; }
      .variants { position:sticky; top:0; z-index:50; display:flex; gap:8px; overflow-x:auto; padding:10px; background:rgba(229,230,233,.97); border-bottom:1px solid #cfd1d6; scrollbar-width:none; }
      .variants button { flex:0 0 auto; min-height:36px; padding:0 14px; border:1px solid #c8cbd1; border-radius:20px; background:#fff; color:#555a64; font-size:12px; font-weight:750; }
      .variants button[aria-pressed="true"] { border-color:var(--ink); background:var(--ink); color:#fff; }
      .stage { width:min(100%,430px); margin:14px auto 40px; }
      .option { display:none; }
      .option.is-active { display:block; }
      .note { margin:0 4px 10px; }
      .note h1 { margin:0; font-size:17px; }
      .note p { margin:3px 0 0; color:#646973; font-size:11px; }
      .phone { position:relative; height:844px; overflow-y:auto; overscroll-behavior:contain; background:var(--page); border-radius:20px; box-shadow:0 14px 45px rgba(22,24,30,.18); scrollbar-width:none; }
      .phone::-webkit-scrollbar,.group-track::-webkit-scrollbar,.filter-tabs::-webkit-scrollbar,.filter-chips::-webkit-scrollbar { display:none; }
      .head { position:sticky; top:0; z-index:20; height:48px; display:flex; align-items:center; padding:0 16px; background:var(--ink); color:#fff; font-size:20px; font-weight:850; letter-spacing:-.7px; }
      .head span { color:#ef454c; }
      .main { padding:13px 16px 92px; }
      .summary-caption { margin:0 0 6px; color:#555a63; font-size:10px; font-weight:800; letter-spacing:.08em; }
      .summary { display:grid; grid-template-columns:repeat(4,1fr); border-bottom:1px solid var(--line); }
      .summary > div { padding:9px 3px 12px; text-align:center; }
      .summary > div+div { border-left:1px solid var(--line); }
      .summary small { display:block; min-height:15px; color:#777b84; font-size:9px; }
      .summary b { display:block; margin-top:3px; font-size:18px; }
      .summary em { margin-left:2px; font-size:9px; font-style:normal; font-weight:500; }
      .dot { display:inline-block; width:6px; height:6px; margin-right:3px; border-radius:50%; background:var(--red); vertical-align:1px; }
      .live { color:var(--red)!important; }
      .groups-label { display:flex; justify-content:space-between; margin:12px 1px 7px; color:#858991; font-size:9px; }
      .groups-label b { color:#3e4148; font-size:11px; }
      .group-track { display:flex; gap:9px; margin-inline:-16px; padding:0 16px 4px; overflow-x:auto; scroll-snap-type:x proximity; scrollbar-width:none; }
      .group-card { position:relative; flex:0 0 78%; min-height:166px; padding:14px 16px; border:2px solid transparent; border-radius:14px; background:var(--ink); color:#fff; scroll-snap-align:start; user-select:none; touch-action:pan-x; transition:transform .16s,border-color .16s; }
      .group-card.is-dragging { z-index:4; transform:scale(1.025) rotate(-1deg); border-color:#fff; opacity:.92; }
      .group-card-main { min-height:82px; margin-bottom:9px; padding-right:30px; }
      .group-card .status { display:block; min-height:18px; color:#ff696f; font-size:10px; font-weight:700; }
      .group-card h2 { margin:1px 0 6px; overflow:hidden; font-size:17px; text-overflow:ellipsis; white-space:nowrap; }
      .active-members { display:flex; align-items:center; min-height:31px; }
      .group-avatars { display:flex; align-items:center; padding-left:2px; }
      .group-person { position:relative; display:grid; width:29px; height:29px; margin-left:-6px; place-items:center; border:2px solid var(--ink); border-radius:50%; background:#555963; color:#fff; font-size:10px; }
      .group-person:first-child { margin-left:0; }
      .group-person.is-live { border-color:#ef454c; }
      .group-person.is-live::after { content:""; position:absolute; right:-1px; bottom:-1px; width:6px; height:6px; border:2px solid var(--ink); border-radius:50%; background:#ef454c; }
      .today-count { margin-left:8px; color:#c6c8ce; font-size:10px; }
      .group-card .open { position:absolute; top:35px; right:12px; width:38px; height:38px; border:0; background:transparent; color:#fff; font-size:25px; }
      .group-numbers { display:flex; gap:24px; padding-top:11px; border-top:1px solid #555861; }
      .group-numbers b { display:block; font-size:18px; }
      .group-numbers small { color:#c6c8ce; font-size:9px; }
      .feed-head { display:flex; align-items:flex-end; justify-content:space-between; min-height:38px; padding-bottom:3px; }
      .feed-head h2 { margin:0; font-size:18px; letter-spacing:-.04em; }
      .filter-tabs { display:flex; gap:20px; margin:-1px -16px 10px; padding:0 16px; overflow-x:auto; border-bottom:1px solid var(--line); scrollbar-width:none; }
      .filter-tabs button { position:relative; flex:0 0 auto; min-height:35px; padding:0 1px; border:0; background:transparent; color:#777b84; font-size:11px; }
      .filter-tabs button[aria-pressed="true"] { color:var(--red); font-weight:800; }
      .filter-tabs button[aria-pressed="true"]::after { content:""; position:absolute; right:0; bottom:-1px; left:0; height:3px; border-radius:3px 3px 0 0; background:var(--red); }
      .filter-chips { display:flex; gap:7px; margin:4px -16px 11px; padding:0 16px; overflow-x:auto; scrollbar-width:none; }
      .filter-chips button { flex:0 0 auto; min-height:34px; padding:0 14px; border:1px solid #cfd1d6; border-radius:18px; background:#fff; color:#666b74; font-size:11px; }
      .filter-chips button[aria-pressed="true"] { border-color:var(--ink); background:var(--ink); color:#fff; font-weight:750; }
      .scope-menu { position:relative; }
      .scope-menu > button { min-height:34px; padding:0 11px; border:1px solid #cfd1d6; border-radius:8px; background:#fff; font-size:11px; font-weight:750; }
      .scope-popover { position:absolute; top:39px; right:0; z-index:12; display:none; width:180px; padding:6px; border:1px solid var(--line); border-radius:12px; background:#fff; box-shadow:0 12px 30px rgba(20,22,28,.18); }
      .scope-popover.is-open { display:grid; }
      .scope-popover button { min-height:40px; padding:0 10px; border:0; border-radius:8px; background:transparent; text-align:left; }
      .scope-popover button[aria-pressed="true"] { color:var(--red); font-weight:800; }
      .scope-bar { display:flex; align-items:center; width:100%; min-height:43px; margin:3px 0 10px; padding:0 12px; border:1px solid var(--line); border-radius:10px; background:#fff; text-align:left; }
      .scope-bar small { margin-right:12px; color:#8a8e96; font-size:9px; }
      .scope-bar strong { font-size:12px; }
      .scope-bar span { margin-left:auto; color:#7c8088; font-size:18px; }
      .sheet-backdrop { position:absolute; inset:0; z-index:30; display:none; align-items:flex-end; background:rgba(20,21,25,.3); }
      .sheet-backdrop.is-open { display:flex; }
      .sheet { width:100%; padding:10px 16px calc(18px + env(safe-area-inset-bottom)); border-radius:18px 18px 0 0; background:#fff; box-shadow:0 -12px 40px rgba(20,22,28,.18); }
      .sheet::before { content:""; display:block; width:34px; height:4px; margin:0 auto 11px; border-radius:3px; background:#c7c9ce; }
      .sheet h3 { margin:0 0 8px; font-size:16px; }
      .sheet button { display:flex; align-items:center; width:100%; min-height:48px; padding:0 4px; border:0; border-bottom:1px solid #ececef; background:#fff; text-align:left; }
      .sheet button[aria-pressed="true"] { color:var(--red); font-weight:800; }
      .sheet button[aria-pressed="true"]::after { content:"✓"; margin-left:auto; }
      .record { margin-bottom:10px; padding:13px 14px; overflow:hidden; border:1px solid var(--line); border-radius:12px; background:#fff; }
      .record time { color:#777b84; font-size:10px; }
      .person { display:flex; align-items:center; gap:9px; margin-top:8px; }
      .avatar { display:grid; width:34px; height:34px; place-items:center; border-radius:50%; background:#282a30; color:#fff; font-size:12px; }
      .person strong { font-size:13px; }
      .source { display:inline-flex; margin-left:auto; padding:3px 7px; border-radius:9px; background:#f0f1f3; color:#6c7079; font-size:9px; }
      .overview { display:flex; gap:25px; margin:9px 0 10px; padding-bottom:9px; border-bottom:1px solid var(--line); }
      .overview span { color:#777b84; font-size:9px; }
      .overview b { display:block; margin-top:2px; color:#1d1e22; font-size:15px; }
      .stamps { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
      .stamps span { display:grid; width:31px; height:31px; place-items:center; border:1px solid #e2e3e6; border-radius:50%; background:#fff; font-size:18px; }
      .stamps b { letter-spacing:2px; }
      .exercise-block+.exercise-block { margin-top:14px; padding-top:2px; }
      .exercise-toggle { display:flex; align-items:center; width:100%; padding:0; border:0; background:transparent; color:inherit; text-align:left; }
      .exercise { flex:1; margin:4px 0 2px; font-size:13px; }
      .exercise-meta,.exercise-toggle i { display:none; color:#858991; font-size:10px; font-style:normal; font-weight:500; }
      .sets { width:100%; border-collapse:collapse; font-size:11px; }
      .sets th,.sets td { padding:4px 2px; border-bottom:1px solid #e4e5e8; text-align:right; }
      .sets th:first-child,.sets td:first-child { text-align:left; }
      .sets th { color:#777b84; font-weight:500; }
      .record-expand { display:none; width:100%; min-height:42px; margin-top:8px; border:0; border-top:1px solid #e1e2e6; background:#fff; color:#3f4249; font-size:11px; font-weight:750; }
      .record-expand[hidden] { display:none!important; }
      body[data-record-mode="fade"] .record:not(.is-expanded) .exercise-list { position:relative; max-height:352px; overflow:hidden; }
      body[data-record-mode="fade"] .record { position:relative; -webkit-tap-highlight-color:transparent; }
      body[data-record-mode="fade"] .record-expand { position:absolute; right:0; bottom:0; left:0; display:block; height:104px; min-height:0; margin:0; border:0; background:linear-gradient(to bottom,rgba(32,33,39,0),rgba(32,33,39,.07) 58%,rgba(32,33,39,.16)); box-shadow:inset 0 -14px 22px rgba(32,33,39,.1); }
      body[data-record-mode="summary"] .record-expand { display:block; }
      body[data-record-mode="accordion"] .exercise-block { margin:0; padding:0; border-bottom:1px solid #e4e5e8; }
      body[data-record-mode="accordion"] .exercise-toggle,body[data-record-mode="summary"] .record:not(.in-dialog) .exercise-toggle { min-height:45px; cursor:pointer; }
      body[data-record-mode="accordion"] .exercise-meta,body[data-record-mode="accordion"] .exercise-toggle i,body[data-record-mode="summary"] .record:not(.in-dialog) .exercise-meta { display:block; }
      body[data-record-mode="accordion"] .exercise-toggle i { width:22px; text-align:right; transition:transform .16s; }
      body[data-record-mode="accordion"] .exercise-block:not(.is-open) .exercise-content { display:none; }
      body[data-record-mode="accordion"] .exercise-block.is-open .exercise-toggle i { transform:rotate(180deg); }
      body[data-record-mode="summary"] .record:not(.in-dialog) .exercise-block { margin:0; padding:0; border-bottom:1px solid #e4e5e8; }
      body[data-record-mode="summary"] .record:not(.in-dialog) .exercise-toggle { cursor:default; }
      body[data-record-mode="summary"] .record:not(.in-dialog) .exercise-content { display:none; }
      .record-dialog { width:min(100%,430px); max-width:none; height:min(92dvh,780px); max-height:none; margin:auto auto 0; padding:0; overflow:hidden; border:0; border-radius:18px 18px 0 0; background:#f5f5f6; box-shadow:0 -18px 48px rgba(20,22,28,.24); }
      .record-dialog::backdrop { background:rgba(20,21,25,.38); }
      .record-dialog-head { position:sticky; top:0; z-index:2; display:flex; align-items:center; min-height:52px; padding:0 14px; border-bottom:1px solid var(--line); background:#fff; }
      .record-dialog-head strong { font-size:14px; }
      .record-dialog-head button { margin-left:auto; min-width:52px; min-height:36px; border:0; border-radius:18px; background:#eeeeF1; color:#4d5159; font-size:11px; }
      .record-dialog-content { height:calc(100% - 52px); padding:10px 12px 24px; overflow-y:auto; }
      .record-dialog .record { margin:0; }
      .record-dialog .record-expand { display:none!important; }
      .start { position:sticky; z-index:15; bottom:78px; display:block; width:112px; height:52px; margin:-58px 0 6px auto; border:0; border-radius:28px; background:var(--red); color:#fff; font-size:13px; font-weight:800; box-shadow:0 8px 20px rgba(55,25,27,.2); }
      .nav { position:sticky; z-index:14; bottom:0; display:grid; grid-template-columns:repeat(4,1fr); height:66px; margin-top:20px; border-top:1px solid var(--line); background:#fff; }
      .nav span { display:grid; place-items:center; color:#777b84; font-size:12px; }
      .nav span:first-child { border-top:2px solid var(--red); color:var(--red); font-weight:700; }
      body.adopted .variants,body.adopted .note { display:none; }
      body.adopted .stage { margin:0 auto; }
      body.adopted .phone { height:100dvh; border-radius:0; box-shadow:none; }
      @media (max-width:520px) {
        body { background:var(--page); }
        .stage { margin:0 auto; }
        .note { margin:0; padding:10px 12px 7px; background:#e5e6e9; }
        .phone { height:calc(100dvh - 107px); min-height:650px; border-radius:0; box-shadow:none; }
      }
    </style>
  </head>
  <body>
    <nav class="variants" aria-label="案を切り替え">
      <button data-show="a" aria-pressed="true">A 下線タブ</button>
      <button data-show="b" aria-pressed="false">B 小型チップ</button>
      <button data-show="c" aria-pressed="false">C 右上選択</button>
      <button data-show="d" aria-pressed="false">D 選択バー</button>
    </nav>
    <main class="stage">
      <section class="option is-active" data-option="a"><div class="note"><h1>A 下線タブ</h1><p>見出しの直下で切替。軽く、現在地を一覧できる</p></div><div class="phone"><header class="head">E-GO<span>TORE</span></header><div class="main"><div class="summary-slot"></div><div class="groups-slot"></div><div class="feed-head"><h2>みんなのトレーニング</h2></div><div class="filter-tabs filter-slot"></div><div class="records"></div></div><button class="start">START</button><nav class="nav"><span>ホーム</span><span>グループ</span><span>履歴</span><span>設定</span></nav></div></section>
      <section class="option" data-option="b"><div class="note"><h1>B 小型チップ</h1><p>押せる場所を明確にしつつ、カードとは分離</p></div><div class="phone"><header class="head">E-GO<span>TORE</span></header><div class="main"><div class="summary-slot"></div><div class="groups-slot"></div><div class="feed-head"><h2>みんなのトレーニング</h2></div><div class="filter-chips filter-slot"></div><div class="records"></div></div><button class="start">START</button><nav class="nav"><span>ホーム</span><span>グループ</span><span>履歴</span><span>設定</span></nav></div></section>
      <section class="option" data-option="c"><div class="note"><h1>C 右上選択</h1><p>一番省スペース。グループが増えても高さが変わらない</p></div><div class="phone"><header class="head">E-GO<span>TORE</span></header><div class="main"><div class="summary-slot"></div><div class="groups-slot"></div><div class="feed-head"><h2>みんなのトレーニング</h2><div class="scope-menu"><button class="menu-toggle">すべて⌄</button><div class="scope-popover filter-slot"></div></div></div><div class="records"></div></div><button class="start">START</button><nav class="nav"><span>ホーム</span><span>グループ</span><span>履歴</span><span>設定</span></nav></div></section>
      <section class="option" data-option="d"><div class="note"><h1>D 選択バー</h1><p>表示範囲を一行で明示。押すと下から選択</p></div><div class="phone"><header class="head">E-GO<span>TORE</span></header><div class="main"><div class="summary-slot"></div><div class="groups-slot"></div><div class="feed-head"><h2>みんなのトレーニング</h2></div><button class="scope-bar"><small>表示</small><strong>すべて</strong><span>›</span></button><div class="records"></div></div><button class="start">START</button><nav class="nav"><span>ホーム</span><span>グループ</span><span>履歴</span><span>設定</span></nav><div class="sheet-backdrop"><div class="sheet"><h3>表示するグループ</h3><div class="filter-slot"></div></div></div></div></section>
    </main>
    <template id="summary-template"><p class="summary-caption">TODAY</p><div class="summary" aria-label="今日の活動"><div><small class="live"><i class="dot"></i>LIVE</small><b>3<em>人</em></b></div><div><small aria-hidden="true"></small><b>7<em>人</em></b></div><div><small aria-hidden="true"></small><b>31<em>セット</em></b></div><div><small aria-hidden="true"></small><b>28,400<em>kg</em></b></div></div></template>
    <template id="groups-template"><div class="groups-label"><b>グループ</b><span>長押しで並べ替え</span></div><div class="group-track"></div></template>
    <template id="group-template"><article class="group-card"><div class="group-card-main"><span class="status"><i class="dot"></i><span class="live-count"></span>人がトレーニング中</span><h2></h2><div class="active-members"><span class="group-avatars"></span><span class="today-count"></span></div></div><button class="open" aria-label="グループ詳細">›</button><div class="group-numbers"><span><b class="set-count"></b><small>セット</small></span><span><b class="volume"></b><small>総負荷</small></span></div></article></template>
    <template id="record-template"><article class="record"><time></time><div class="person"><span class="avatar"></span><strong></strong><span class="source"></span></div><div class="overview"><span>総負荷<b class="record-volume"></b></span><span>セット<b class="record-sets"></b></span></div><div class="stamps"><span>💪</span><span>🔥</span><span>👎</span><span>🤩</span><span>👏</span><span>👺</span><b>…</b></div><div class="exercise-list"></div><button class="record-expand" type="button"></button></article></template>
    <template id="exercise-template"><section class="exercise-block"><button class="exercise-toggle" type="button"><strong class="exercise"></strong><span class="exercise-meta"></span><i>⌄</i></button><div class="exercise-content"><table class="sets"><thead><tr><th>セット</th><th>重量 kg</th><th>回数</th><th>推定1RM kg</th></tr></thead><tbody></tbody></table></div></section></template>
    <dialog class="record-dialog"><header class="record-dialog-head"><strong>トレーニング詳細</strong><button type="button">閉じる</button></header><div class="record-dialog-content"></div></dialog>
    <script>
      const params=new URLSearchParams(location.search);
      const isStress=params.has("stress");
      const recordMode=["full","fade","accordion","summary"].includes(params.get("recordMode"))?params.get("recordMode"):"full";
      document.body.dataset.recordMode=recordMode;
      const groups=[
        {id:"morning",name:"朝トレ部",today:5,live:2,sets:14,volume:"12,800kg",people:[{name:"ミオ",live:true},{name:"ユウ",live:true},{name:"タクミ",live:false},{name:"ナナ",live:false}]},
        {id:"weekend",name:"週末ワークアウト",today:3,live:1,sets:10,volume:"9,400kg",people:[{name:"ユウ",live:true},{name:"ソラ",live:false},{name:"レン",live:false}]},
        {id:"lab",name:"研究室筋トレ",today:2,live:0,sets:7,volume:"6,200kg",people:[{name:"タクミ",live:false},{name:"ナナ",live:false}]}
      ];
      if(isStress){groups[0].sets=44;groups[0].volume="32,800kg";groups[1].sets=28;groups[1].volume="24,600kg";groups[2].sets=14;groups[2].volume="15,080kg"}
      const regularRecords=[
        {group:"morning",time:"9月26日　07:42",name:"ミオ",volume:"1,890kg",sets:3,exercises:[{name:"ベンチプレス",rows:[[1,60,10,80],[2,60,8,76],[3,55,10,"73.3"]]}]},
        {group:"weekend",time:"9月26日　06:58",name:"ユウ",volume:"3,240kg",sets:4,exercises:[{name:"スクワット",rows:[[1,100,8,"126.7"],[2,100,6,120],[3,90,10,120],[4,80,10,"106.7"]]}]},
        {group:"lab",time:"9月25日　21:16",name:"タクミ",volume:"1,080kg",sets:3,exercises:[{name:"ショルダープレス",rows:[[1,40,10,"53.3"],[2,40,9,52],[3,40,8,"50.7"]]}]}
      ];
      const stressRecords=[
        {group:"morning",time:"9月26日　07:42",name:"ミオ",volume:"13,646kg",sets:22,exercises:[
          {name:"ベンチプレス",rows:[[1,100,10,"133.3"],[2,100,8,"126.7"],[3,95,10,"126.7"],[4,90,12,126],[5,80,12,112]]},
          {name:"インクラインダンベルプレス",rows:[[1,32,10,"42.7"],[2,32,10,"42.7"],[3,32,9,"41.6"],[4,32,9,"41.6"]]},
          {name:"ラットプルダウン",rows:[[1,70,10,"93.3"],[2,70,9,91],[3,65,12,91],[4,65,10,"86.7"],[5,60,12,84]]},
          {name:"シーテッドロー",rows:[[1,60,12,84],[2,60,10,80],[3,55,12,77],[4,55,10,"73.3"]]},
          {name:"ショルダープレス",rows:[[1,45,10,60],[2,45,8,57],[3,40,10,"53.3"],[4,35,12,49]]}
        ]},
        {group:"weekend",time:"9月26日　06:58",name:"ユウ",volume:"7,580kg",sets:8,exercises:[{name:"スクワット",rows:[[1,120,8,152],[2,120,6,144],[3,110,10,"146.7"],[4,100,12,140]]},{name:"レッグプレス",rows:[[1,180,12,252],[2,180,10,240],[3,160,12,224],[4,160,10,"213.3"]]}]}
      ];
      const records=isStress?stressRecords:regularRecords;
      if(params.has("adopted"))document.body.classList.add("adopted");
      const initialKey=["a","b","c","d"].includes(location.hash.slice(1))?location.hash.slice(1):"a";
      document.querySelectorAll(".variants button").forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.show===initialKey)));
      document.querySelectorAll(".option").forEach(option=>option.classList.toggle("is-active",option.dataset.option===initialKey));
      const nameOf=id=>groups.find(group=>group.id===id)?.name||"すべて";
      function enableReorder(card,track){let timer,dragging=false;card.addEventListener("pointerdown",event=>{timer=setTimeout(()=>{dragging=true;card.classList.add("is-dragging");card.setPointerCapture(event.pointerId)},320)});card.addEventListener("pointermove",event=>{if(!dragging)return;event.preventDefault();const other=[...track.children].find(item=>item!==card&&event.clientX>=item.getBoundingClientRect().left&&event.clientX<=item.getBoundingClientRect().right);if(other)track.insertBefore(card,event.clientX<other.getBoundingClientRect().left+other.offsetWidth/2?other:other.nextSibling)});const finish=()=>{clearTimeout(timer);dragging=false;card.classList.remove("is-dragging")};card.addEventListener("pointerup",finish);card.addEventListener("pointercancel",finish);card.addEventListener("pointerleave",()=>{if(!dragging)clearTimeout(timer)})}
      const detailDialog=document.querySelector(".record-dialog");
      detailDialog.querySelector(".record-dialog-head button").addEventListener("click",()=>detailDialog.close());
      detailDialog.addEventListener("click",event=>{if(event.target===detailDialog)detailDialog.close()});
      function openRecordDetail(node){const detail=node.cloneNode(true);detail.classList.add("in-dialog","is-expanded");detail.querySelector(".record-expand")?.remove();detail.querySelectorAll(".exercise-block").forEach(block=>block.classList.add("is-open"));detailDialog.querySelector(".record-dialog-content").replaceChildren(detail);detailDialog.showModal()}
      function renderRecords(option,scope="all"){
        const root=option.querySelector(".records");
        root.replaceChildren();
        records.filter(record=>scope==="all"||record.group===scope).forEach(data=>{
          const node=document.querySelector("#record-template").content.firstElementChild.cloneNode(true);
          node.querySelector("time").textContent=data.time;
          node.querySelector(".avatar").textContent=data.name[0];
          node.querySelector(".person strong").textContent=data.name;
          node.querySelector(".source").textContent=nameOf(data.group);
          node.querySelector(".record-volume").textContent=data.volume;
          node.querySelector(".record-sets").textContent=data.sets;
          const list=node.querySelector(".exercise-list");
          data.exercises.forEach((exercise,index)=>{
            const exerciseNode=document.querySelector("#exercise-template").content.firstElementChild.cloneNode(true);
            const toggle=exerciseNode.querySelector(".exercise-toggle");
            exerciseNode.querySelector(".exercise").textContent=exercise.name;
            exerciseNode.querySelector(".exercise-meta").textContent=`${exercise.rows.length}セット`;
            if(recordMode==="accordion"){
              exerciseNode.classList.toggle("is-open",index===0);
              toggle.setAttribute("aria-expanded",String(index===0));
              toggle.addEventListener("click",()=>{const open=exerciseNode.classList.toggle("is-open");toggle.setAttribute("aria-expanded",String(open))});
            }else{
              toggle.tabIndex=-1;
              toggle.setAttribute("aria-disabled","true");
            }
            const body=exerciseNode.querySelector("tbody");
            exercise.rows.forEach(row=>{const tr=document.createElement("tr");tr.innerHTML=`<td>${row[0]}</td><td><b>${row[1]}</b></td><td><b>${row[2]}</b></td><td><b>${row[3]}</b></td>`;body.append(tr)});
            list.append(exerciseNode);
          });
          const expand=node.querySelector(".record-expand");
          let toggleFade;
          if(recordMode==="fade"){
            toggleFade=()=>{const open=node.classList.toggle("is-expanded");expand.hidden=open;expand.setAttribute("aria-label",open?`${data.name}の記録を小さく表示`:`${data.name}の全セットを表示`)};
            expand.setAttribute("aria-label",`${data.name}の全セットを表示`);
            expand.addEventListener("click",event=>{event.stopPropagation();toggleFade()});
          }else if(recordMode==="summary"){
            expand.textContent="詳細を見る　›";
            expand.addEventListener("click",()=>openRecordDetail(node));
          }
          root.append(node);
          if(recordMode==="fade"){
            const collapsible=list.scrollHeight>list.clientHeight+1;
            expand.hidden=!collapsible;
            if(collapsible)node.addEventListener("click",event=>{if(event.target.closest(".stamps,.record-expand"))return;toggleFade()});
          }
        });
        option.dataset.scope=scope;
        option.querySelectorAll(".filter-slot button").forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.scope===scope)));
        const toggle=option.querySelector(".menu-toggle");
        if(toggle)toggle.textContent=`${scope==="all"?"すべて":nameOf(scope)}⌄`;
        const bar=option.querySelector(".scope-bar strong");
        if(bar)bar.textContent=scope==="all"?"すべて":nameOf(scope)
      }
      function build(option){option.querySelector(".summary-slot").append(document.querySelector("#summary-template").content.cloneNode(true));if(isStress){const values=option.querySelectorAll(".summary b");values[1].innerHTML="11<em>人</em>";values[2].innerHTML="86<em>セット</em>";values[3].innerHTML="72,480<em>kg</em>"}const groupBlock=document.querySelector("#groups-template").content.cloneNode(true);option.querySelector(".groups-slot").append(groupBlock);const track=option.querySelector(".group-track");groups.forEach(data=>{const card=document.querySelector("#group-template").content.firstElementChild.cloneNode(true);card.dataset.group=data.id;card.querySelector("h2").textContent=data.name;card.querySelector(".today-count").textContent=`${data.today}人`;const avatars=card.querySelector(".group-avatars");data.people.forEach(person=>{const avatar=document.createElement("span");avatar.className=`group-person${person.live?" is-live":""}`;avatar.textContent=person.name[0];avatar.setAttribute("aria-label",`${person.name}・${person.live?"トレーニング中":"今日トレーニング済み"}`);avatars.append(avatar)});card.querySelector(".live-count").textContent=data.live;card.querySelector(".set-count").textContent=data.sets;card.querySelector(".volume").textContent=data.volume;if(!data.live)card.querySelector(".status").style.color="#c6c8ce";card.querySelector(".open").addEventListener("click",()=>alert(`${data.name}の詳細は今回変更しません`));enableReorder(card,track);track.append(card)});const slot=option.querySelector(".filter-slot");[{id:"all",name:"すべて"},...groups].forEach(data=>{const button=document.createElement("button");button.type="button";button.dataset.scope=data.id;button.textContent=data.name;button.addEventListener("click",()=>{renderRecords(option,data.id);option.querySelector(".scope-popover")?.classList.remove("is-open");option.querySelector(".sheet-backdrop")?.classList.remove("is-open")});slot.append(button)});renderRecords(option)}
      document.querySelectorAll(".option").forEach(build);
      document.querySelectorAll(".menu-toggle").forEach(button=>button.addEventListener("click",()=>button.nextElementSibling.classList.toggle("is-open")));
      document.querySelectorAll(".scope-bar").forEach(button=>button.addEventListener("click",()=>button.closest(".phone").querySelector(".sheet-backdrop").classList.add("is-open")));
      document.querySelectorAll(".sheet-backdrop").forEach(backdrop=>backdrop.addEventListener("click",event=>{if(event.target===backdrop)backdrop.classList.remove("is-open")}));
      document.querySelectorAll(".variants button").forEach(button=>button.addEventListener("click",()=>{document.querySelectorAll(".variants button").forEach(item=>item.setAttribute("aria-pressed",String(item===button)));document.querySelectorAll(".option").forEach(option=>option.classList.toggle("is-active",option.dataset.option===button.dataset.show));history.replaceState(null,"",`#${button.dataset.show}`);const reset=()=>{const phone=document.querySelector(".option.is-active .phone");if(phone)phone.scrollTop=0;window.scrollTo(0,0)};requestAnimationFrame(reset);setTimeout(reset,120)}));
    </script>
  </body>
</html>
