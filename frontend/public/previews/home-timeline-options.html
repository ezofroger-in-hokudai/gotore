<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-GOTORE ホーム・タイムライン案</title>
    <style>
      :root{color-scheme:light;--bg:#f4f4f5;--panel:#fff;--ink:#17191d;--muted:#656a74;--line:#dedfe3;--red:#ce282b;--soft:#fff0f0;--dark:#202127} :root[data-theme=dark]{color-scheme:dark;--bg:#111214;--panel:#1b1d20;--ink:#f5f5f7;--muted:#a1a6af;--line:#33363d;--red:#e73a35;--soft:#392327;--dark:#282a30} *{box-sizing:border-box} body{margin:0;background:#e2e3e7;color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #5b9dd9;outline-offset:2px}.controls{position:sticky;top:0;z-index:4;display:flex;justify-content:center;gap:7px;flex-wrap:wrap;padding:10px;background:#fff;border-bottom:1px solid #d5d6da}.controls button{min-height:34px;padding:5px 10px;border:1px solid #b7bac1;border-radius:8px;background:#fff;color:#25272b}.controls button[aria-pressed=true]{border-color:#ce282b;background:#fff0f0;color:#9e1e22;font-weight:700}.note{max-width:430px;margin:12px auto 0;padding:0 16px;color:#4c5058;font-size:12px;line-height:1.5}.phone{position:relative;width:min(100%,430px);min-height:844px;margin:12px auto 0;overflow:hidden;background:var(--bg)}.header{height:65px;padding:20px 20px 10px;display:flex;align-items:center;justify-content:space-between}.wordmark{border:0;padding:0;background:transparent;color:var(--ink);font-size:22px;font-weight:800;letter-spacing:-.7px}.wordmark span{color:var(--red)}.icon-button{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:8px;background:transparent;color:var(--ink)}.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}main{padding:14px 20px 116px}.title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.title h1{margin:0;font-size:22px}.text{border:0;padding:10px 0;background:transparent;color:var(--muted);font-size:12px}.screen{display:none}.screen.active{display:block}.story-rail{display:flex;gap:12px;overflow:hidden;margin:0 -20px 18px;padding:0 20px}.story{width:52px;flex:none;border:0;padding:0;background:transparent;color:var(--ink);text-align:center}.portrait{display:grid;place-items:center;width:46px;height:46px;margin:auto;border:2px solid var(--line);border-radius:50%;background:#5d6068;color:#fff;font-size:12px;font-weight:700}.portrait.live{border-color:var(--red);box-shadow:0 0 0 3px var(--soft)}.story:nth-child(2) .portrait,.person:nth-child(2) .portrait{background:#806761}.story:nth-child(3) .portrait,.person:nth-child(3) .portrait{background:#52756b}.story small{display:block;overflow:hidden;margin-top:5px;font-size:10px;text-overflow:ellipsis;white-space:nowrap}.filters{display:flex;gap:7px;overflow:hidden;margin:0 -20px 19px;padding:0 20px}.filter{flex:none;min-height:36px;border:1px solid var(--line);border-radius:8px;padding:6px 11px;background:var(--panel);color:var(--muted);font-size:12px}.filter.selected{border-color:#efcaca;background:var(--soft);color:var(--red);font-weight:700}.summary{display:grid;grid-template-columns:repeat(3,1fr);margin:0 0 20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.summary div{padding:13px 7px 12px 0}.summary div+div{padding-left:12px;border-left:1px solid var(--line)}.summary label{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.05em}.summary b{display:block;margin-top:4px;font-size:19px}.dot{width:6px;height:6px;border-radius:50%;background:var(--red)}.group-line{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.group-line p{margin:0}.group-line small{color:var(--muted)}.group-line button{border:0;padding:0;background:transparent;color:var(--ink);font-weight:700}.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 8px}.section-title h2{margin:0;font-size:16px}.section-title span{color:var(--muted);font-size:11px}.feed{border-top:1px solid var(--line)}.post{padding:15px 0 13px;border-bottom:1px solid var(--line)}.post-head{display:flex;justify-content:space-between;gap:8px}.person{display:flex;gap:9px;min-width:0}.person .portrait{flex:none;width:34px;height:34px;margin:0;border-color:var(--bg);font-size:10px}.name{margin:0;font-weight:700}.exercise{overflow:hidden;max-width:185px;margin:3px 0 0;color:var(--muted);font-size:12px;text-overflow:ellipsis;white-space:nowrap}.time{color:var(--muted);font-size:11px}.record{display:flex;align-items:end;justify-content:space-between;gap:8px;margin:11px 0 10px 43px}.record small{color:var(--muted);font-size:11px}.record strong{font-size:17px}.record strong b{color:var(--red)}.reaction-row{display:flex;gap:6px;margin-left:43px}.stamp{min-height:31px;border:1px solid var(--line);border-radius:7px;padding:4px 9px;background:var(--panel);color:var(--ink);font-size:12px}.stamp.pressed{border-color:#efcaca;background:var(--soft);color:var(--red);font-weight:700}.detail{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:12px}.compact-post{display:grid;grid-template-columns:42px 1fr auto;gap:9px;padding:14px 0;border-bottom:1px solid var(--line)}.compact-post .portrait{width:34px;height:34px;border-color:var(--bg);font-size:10px}.compact-post p{margin:0}.compact-post .value{margin-top:5px;font-weight:700}.compact-post .value b{color:var(--red)}.compact-post .reaction-row{grid-column:2 / 4;margin:0}.inbox{display:flex;align-items:center;gap:10px;margin:0 0 19px;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.inbox .icon{color:var(--red)}.inbox b,.inbox small{display:block}.inbox small{margin-top:2px;color:var(--muted);font-size:11px}.inbox button{margin-left:auto;border:0;background:transparent;color:var(--muted)}.start{position:absolute;right:20px;bottom:82px;display:flex;align-items:center;gap:8px;min-height:52px;border:0;border-radius:10px;padding:0 18px;background:var(--red);box-shadow:0 5px 13px rgb(0 0 0/.18);color:#fff;font-weight:700}.start .icon{width:18px;height:18px}.nav{position:absolute;right:0;bottom:0;left:0;display:grid;grid-template-columns:repeat(4,1fr);min-height:66px;padding:0 10px;border-top:1px solid var(--line);background:var(--panel)}.nav button{position:relative;border:0;padding:21px 0;background:transparent;color:var(--muted);font-size:12px}.nav .active{color:var(--red);font-weight:700}.nav .active:before{position:absolute;top:-1px;right:25%;left:25%;height:2px;background:var(--red);content:""}@media(max-width:340px){.phone{min-height:720px}.header{padding-right:14px;padding-left:14px}main{padding-right:14px;padding-left:14px}.story-rail,.filters{margin-right:-14px;margin-left:-14px;padding-right:14px;padding-left:14px}.start{right:14px}.summary b{font-size:17px}}
    </style>
  </head>
  <body>
    <div class="controls" aria-label="案の切替"><button data-view="a" aria-pressed="true">A タイムライン</button><button data-view="b" aria-pressed="false">B 仲間レール</button><button data-view="c" aria-pressed="false">C 種目選択型</button><button data-view="d" aria-pressed="false">D 今日の活動</button><button id="theme" aria-pressed="false">暗色</button></div>
    <p class="note">グループカードを置かず、最新の記録と即時スタンプを中心にした4案です。すべて架空の表示で、保存・送信は行いません。</p>
    <div class="phone"><header class="header"><button class="wordmark">E-GO<span>TORE</span></button><button class="icon-button" aria-label="スタンプの受信一覧"><svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg></button></header><main><div class="title"><h1>ホーム</h1><button class="text">グループ一覧</button></div>
      <section class="screen active" data-panel="a"><div class="filters"><button class="filter selected">すべて</button><button class="filter">GO TORE</button><button class="filter">朝トレ部</button><button class="filter">LIVE</button></div><div class="section-title"><h2>最新の記録</h2><span>新しい順</span></div><div class="feed" data-feed></div></section>
      <section class="screen" data-panel="b"><div class="story-rail"><button class="story"><span class="portrait live">み</span><small>みお · LIVE</small></button><button class="story"><span class="portrait live">た</span><small>たくみ · LIVE</small></button><button class="story"><span class="portrait">ゆ</span><small>ゆう · 12分前</small></button><button class="story"><span class="portrait">さ</span><small>さき · 昨日</small></button></div><div class="filters"><button class="filter selected">すべて</button><button class="filter">GO TORE</button><button class="filter">朝トレ部</button></div><div class="section-title"><h2>みんなの記録</h2><span>新しい順</span></div><div class="feed" data-feed></div></section>
      <section class="screen" data-panel="c"><div class="filters"><button class="filter selected">すべて</button><button class="filter">LIVE</button><button class="filter">GO TORE</button><button class="filter">朝トレ部</button></div><div class="filters"><button class="filter selected">すべて</button><button class="filter">胸</button><button class="filter">脚</button><button class="filter">背中</button><button class="filter">肩</button></div><div class="section-title"><h2>トレーニング</h2><span>新しい順</span></div><div class="feed" data-compact-feed></div></section>
      <section class="screen" data-panel="d"><div class="summary"><div><label><i class="dot"></i>LIVE</label><b>2人</b></div><div><label>TODAY</label><b>4人</b></div><div><label>SETS</label><b>18</b></div></div><div class="group-line"><div><small>表示するグループ</small><p>すべてのグループ</p></div><button>変更 ›</button></div><div class="inbox"><svg class="icon" viewBox="0 0 24 24"><path d="M12 2v20M5 7v10M19 7v10M2 10v4M22 10v4M6 12h12"/></svg><div><b>いま 2人がトレーニング中</b><small>みお、たくみ</small></div><button>›</button></div><div class="section-title"><h2>最新の記録</h2><span>新しい順</span></div><div class="feed" data-feed></div></section>
    </main><button class="start"><svg class="icon" viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>START</button><nav class="nav"><button class="active">ホーム</button><button>グループ</button><button>履歴</button><button>設定</button></nav></div>
    <template id="post"><article class="post"><div class="post-head"><div class="person"><span class="portrait"></span><div><p class="name"></p><p class="exercise"></p></div></div><span class="time"></span></div><div class="record"><small class="sets"></small><strong class="value"></strong></div><div class="reaction-row"><button class="stamp">🔥 <span>2</span></button><button class="stamp">👏 <span>0</span></button><button class="stamp">💪 <span>0</span></button><button class="detail">詳細 ›</button></div></article></template>
    <template id="compact"><article class="compact-post"><span class="portrait"></span><div><p class="name"></p><p class="exercise"></p><p class="value"></p></div><span class="time"></span><div class="reaction-row"><button class="stamp">🔥 <span>2</span></button><button class="stamp">👏 <span>0</span></button><button class="stamp">💪 <span>0</span></button></div></article></template>
    <script>
      const records=[{name:'みお',exercise:'ベンチプレス',sets:'3種目 · 9セット',value:'60 kg × 8 回',time:'いま'},{name:'たくみ',exercise:'スクワット',sets:'2種目 · 6セット',value:'80 kg × 6 回',time:'12分前'},{name:'ゆう',exercise:'ラットプルダウン',sets:'4種目 · 12セット',value:'45 kg × 10 回',time:'38分前'}];
      function posts(target,compact=false){const template=document.querySelector(compact?'#compact':'#post');records.forEach((record,index)=>{const node=template.content.cloneNode(true);node.querySelector('.portrait').textContent=record.name.slice(0,1);node.querySelector('.name').textContent=record.name;node.querySelector('.exercise').textContent=record.exercise;node.querySelector('.value').innerHTML=index===0?'<b>60</b> kg × 8 回':record.value;node.querySelector('.time').textContent=record.time;if(!compact)node.querySelector('.sets').textContent=record.sets;target.append(node)});}
      document.querySelectorAll('[data-feed]').forEach((feed)=>posts(feed));document.querySelectorAll('[data-compact-feed]').forEach((feed)=>posts(feed,true));
      document.addEventListener('click',(event)=>{const stamp=event.target.closest('.stamp');if(stamp){const count=stamp.querySelector('span');stamp.classList.toggle('pressed');count.textContent=stamp.classList.contains('pressed')?String(Number(count.textContent)+1):String(Math.max(0,Number(count.textContent)-1))}const filter=event.target.closest('.filter');if(filter){filter.parentElement.querySelectorAll('.filter').forEach((item)=>item.classList.toggle('selected',item===filter))}});
      const views=document.querySelectorAll('[data-view]');views.forEach((button)=>button.addEventListener('click',()=>{views.forEach((item)=>item.setAttribute('aria-pressed',String(item===button)));document.querySelectorAll('[data-panel]').forEach((panel)=>panel.classList.toggle('active',panel.dataset.panel===button.dataset.view))}));document.querySelector('#theme').addEventListener('click',(event)=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'';event.currentTarget.setAttribute('aria-pressed',String(dark));event.currentTarget.textContent=dark?'明色':'暗色'});
    </script>
  </body>
</html>
