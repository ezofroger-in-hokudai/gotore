<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>E-GOTORE グループ画面 採用案</title>
  <style>
    :root{--red:#d32f2f;--ink:#202127;--muted:#6b6d73;--line:#dddfe3;--bg:#f4f4f5;--track:#e9eaed}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#e4e5e8;-webkit-tap-highlight-color:transparent}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d32f2f44;outline-offset:2px}
    .preview-bar{position:sticky;z-index:20;top:0;padding:10px 12px;background:#fffffff2;border-bottom:1px solid #d0d1d4;backdrop-filter:blur(12px)}.preview-bar>div{max-width:980px;margin:auto}.preview-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.preview-title b{font-size:15px}.preview-title span,.preview-note{color:var(--muted);font-size:11px}.preview-tabs{display:flex;gap:4px;overflow-x:auto;margin-top:8px;padding:4px;border-radius:9px;background:var(--track)}.preview-tabs button{flex:0 0 auto;min-width:64px;min-height:38px;padding:3px 10px;border:0;border-radius:7px;background:transparent;font-size:11px;font-weight:800}.preview-tabs button.on{background:#fff;box-shadow:0 1px 4px #0002}.preview-note{margin:7px 2px 0}
    .stage{display:flex;justify-content:center;padding:16px 0 40px}.phone{position:relative;width:min(100%,430px);height:min(850px,calc(100dvh - 170px));min-height:660px;overflow:hidden;background:var(--bg);box-shadow:0 16px 42px #16181e2b}.header{position:absolute;z-index:5;top:0;right:0;left:0;height:48px;padding:0 16px;display:flex;align-items:center;background:var(--ink);color:#fff}.logo{font-size:22px;font-weight:900;letter-spacing:-.7px}.logo span{color:#ff625b}.screen{position:absolute;inset:48px 0 66px;padding:14px 16px 94px;overflow-y:auto;overscroll-behavior:contain}.bottom{position:absolute;z-index:8;right:0;bottom:0;left:0;display:grid;grid-template-columns:repeat(4,1fr);height:66px;border-top:1px solid var(--line);background:#fffffff8}.bottom button{position:relative;border:0;background:transparent;color:#73757a;font-size:12px}.bottom .on{color:var(--red);font-weight:850}.bottom .on:before{content:"";position:absolute;top:0;right:18px;left:18px;height:2px;background:var(--red)}.start{position:absolute;z-index:10;right:16px;bottom:80px;width:112px;height:52px;border:0;border-radius:9px;background:var(--red);color:#fff;font-weight:900;box-shadow:0 7px 18px #55191947}
    h1,h2,h3,p{margin-top:0}h1{margin-bottom:8px;font-size:20px}h2{margin-bottom:7px;font-size:16px}.eyebrow{margin:0 0 2px;color:var(--muted);font-size:11px;font-weight:900;letter-spacing:.09em}.muted{color:var(--muted)}.small{font-size:11px}.section{margin-top:16px}.heading{display:flex;align-items:center;justify-content:space-between;gap:8px}.heading h1{margin:0}.actions{display:flex;gap:6px}.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 12px;border:1px solid #b9bbc0;border-radius:22px;background:#fff;font-size:12px;font-weight:850;white-space:nowrap}.pill svg{width:18px;height:18px;fill:none;stroke:var(--red);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.section-head h2{margin:0}.order-note{margin:2px 1px 8px;color:var(--muted);font-size:11px}.cards{display:grid;gap:10px;touch-action:pan-y}.community-card{min-height:166px;padding:16px;border:0;border-radius:14px;background:var(--ink);color:#fff;text-align:left;box-shadow:0 4px 12px #20212726;user-select:none;-webkit-user-select:none}.community-card.is-dragging{opacity:.72;transform:scale(.985);box-shadow:0 10px 28px #0004}.card-live{display:flex;min-height:18px;align-items:center;gap:5px;color:#ff625b;font-size:10px;font-weight:750}.card-live.idle{color:#c7c9cf}.dot{width:6px;height:6px;border-radius:50%;background:var(--red)}.community-card h2{margin:1px 0 7px;color:#fff;font-size:18px}.people{display:flex;align-items:center;min-height:31px;margin-bottom:9px;color:#c7c9cf;font-size:10px}.avatars{display:flex;padding-left:2px}.avatar{display:grid;place-items:center;width:29px;height:29px;margin-left:-6px;border:2px solid var(--ink);border-radius:50%;background:#555963;color:#fff;font-size:10px;font-weight:800}.avatar:first-child{margin-left:0}.avatar.live{outline:2px solid var(--red);outline-offset:1px}.people>span:last-child{margin-left:8px}.stats{display:flex;gap:24px;padding-top:11px;border-top:1px solid #555}.stats span{color:#c7c9cf;font-size:9px}.stats b{color:#fff;font-size:18px}.stats small{margin-left:2px}
    .segment{display:grid;grid-template-columns:1.2fr 1fr .8fr .8fr;gap:4px;margin-top:12px;padding:4px;border-radius:9px;background:var(--track)}.segment button{min-height:40px;padding:2px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:11px;font-weight:800}.segment button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0002}.back{min-height:38px;margin:-8px 0 5px -8px;padding:0 8px;border:0;background:transparent;color:#55575c;font-weight:800}.record{padding:13px 0;border-bottom:1px solid var(--line)}.record-head{display:flex;justify-content:space-between;gap:8px}.record p{margin:4px 0;color:var(--muted);font-size:12px}.exercise{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:12px}.white-card{padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff}.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.day-grid span{display:grid;place-items:center;aspect-ratio:1;border-radius:7px;color:var(--muted);font-size:10px}.day-grid .active{background:#f8e6e6;color:var(--red);font-weight:900}.bars{height:145px;display:flex;align-items:end;gap:9px;padding:12px 10px;border-bottom:1px solid var(--line)}.bars i{flex:1;border-radius:5px 5px 0 0;background:#d32f2f;opacity:.82}.settings{display:grid;gap:16px;padding-top:14px}.settings h3{margin:0 0 7px;font-size:13px}.setting-card{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#fff}.setting-line{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;min-height:56px;padding:8px 12px}.setting-line+.setting-line{border-top:1px solid #ececef}.setting-value{display:flex;align-items:center;gap:6px;color:#55575c;font-size:12px;font-weight:800}.text-action{min-height:38px;padding:0 8px;border:0;background:transparent;color:var(--red);font-size:11px;font-weight:850}.member-card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent}.member-list{max-height:496px;overflow:hidden;transition:max-height 160ms ease}.member-card.collapsed .member-list{max-height:220px}.member-row{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:9px;min-height:62px;padding:8px 11px}.member-row+.member-row{border-top:1px solid #ececef}.member-row .avatar{width:34px;height:34px;margin:0;border-color:#fff}.member-row b,.member-row small{display:block}.member-row small{color:var(--muted)}.owner-badge{padding:3px 7px;border-radius:10px;background:#ececef;color:#5d5f65;font-size:9px;font-weight:850}.member-fade{position:absolute;right:0;bottom:0;left:0;height:76px;border:0;background:linear-gradient(to bottom,transparent,#20212720);box-shadow:inset 0 -14px 22px #20212712}.member-card.expanded .member-fade{width:42px;height:42px;left:auto;background:transparent;box-shadow:none}.danger{width:100%;min-height:46px;border:1px solid #e7bcbc;border-radius:9px;background:#fff;color:#b32626;font-weight:850}.danger-copy{margin:6px 2px 0;color:var(--muted);font-size:10px}.danger-copy:empty{display:none}
    .overlay{position:absolute;z-index:20;inset:0;background:#11182766;opacity:0;pointer-events:none;transition:opacity 160ms ease}.overlay.open{opacity:1;pointer-events:auto}.sheet{position:absolute;z-index:21;right:0;bottom:0;left:0;height:390px;padding:8px 16px 16px;overflow-y:auto;overscroll-behavior:contain;border-radius:20px 20px 0 0;background:#fff;box-shadow:0 -12px 34px #0003;transform:translateY(105%);transition:transform 180ms ease}.sheet.compact{height:auto;min-height:230px;max-height:70%}.sheet.open{transform:translateY(0)}.handle{width:38px;height:4px;margin:0 auto 14px;border-radius:4px;background:#c9cacf}.sheet-head{display:flex;min-height:42px;align-items:center;justify-content:space-between;gap:10px}.sheet-head h2{margin:0;font-size:19px}.close{width:40px;height:40px;border:0;border-radius:50%;background:#f0f0f2;font-size:20px}.field{display:block;margin-top:16px;font-size:12px;font-weight:800}.field-head{display:flex;justify-content:space-between;margin-bottom:6px}.field-head span:last-child{color:var(--muted);font-size:10px}.field input{width:100%;height:50px;padding:0 13px;border:1px solid #bfc1c5;border-radius:9px;background:#fff;font-size:16px}.confirm{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin-top:14px;border:0;border-radius:9px;background:var(--ink);color:#fff;font-weight:850}.invite-name{margin:10px 0 2px;font-size:17px;font-weight:900}.qr-box{display:grid;place-items:center;min-height:138px;margin-top:6px;border:1px solid var(--line);border-radius:11px;background:#fafafa;text-align:center}.qr{width:96px;height:96px;border:8px solid #fff;outline:1px solid var(--line);background:repeating-conic-gradient(#202127 0% 25%,#fff 0% 50%) 50%/18px 18px}.invite-help{margin:7px 0 0;color:var(--muted);font-size:10px;text-align:center}.share{width:100%;min-height:44px;margin-top:10px}.done{width:100%;min-height:42px;margin-top:5px;border:0;background:transparent;font-weight:850}.sheet-actions{display:grid;gap:6px;margin-top:10px}.sheet-actions button{width:100%;min-height:42px;border:0;border-radius:9px;background:#f4f4f5;text-align:left;font-size:12px;font-weight:850}.sheet-actions .danger-text{background:#fff6f6;color:var(--red)}.toast{position:absolute;z-index:40;right:12px;bottom:72px;left:12px;padding:10px;border-radius:9px;background:#202127;color:#fff;text-align:center;font-size:12px;opacity:0;pointer-events:none;transition:opacity .15s}.toast.show{opacity:1}.role-toggle{display:flex;gap:5px;margin-top:8px}.role-toggle button{min-height:30px;padding:0 9px;border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--muted);font-size:10px}.role-toggle button.on{border-color:var(--ink);background:var(--ink);color:#fff}
    .confirm-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.confirm-row button{min-height:46px;border-radius:9px;font-weight:850}.confirm-cancel{border:1px solid #b9bbc0;background:#fff}.confirm-delete{border:1px solid var(--red);background:var(--red);color:#fff}.delete-copy{margin:12px 0 0;font-size:13px}.delete-warning{margin:6px 0 0;color:var(--muted);font-size:11px}.name-editor{padding:0 12px 12px;border-top:1px solid #ececef}.name-editor label{display:block;margin:10px 0 5px;font-size:11px;font-weight:800}.name-editor input{width:100%;height:42px;padding:0 10px;border:1px solid #bfc1c5;border-radius:8px;background:#fff}.name-editor button{width:100%;min-height:40px;margin-top:8px;border:0;border-radius:8px;background:var(--ink);color:#fff;font-weight:850}.leave-help{margin:10px 0 0;color:var(--muted);font-size:11px}
    @media(max-width:520px){.preview-title span{display:none}.stage{padding:0}.phone{height:calc(100dvh - 164px);min-height:620px;box-shadow:none}}@media(prefers-reduced-motion:reduce){.overlay,.sheet,.member-list,.toast{transition:none}}
    .qr-box{display:block;min-height:0;padding:0;border:0;background:none}.invite-pass{position:relative;margin:8px 0;padding:15px;border-radius:16px;background:#202127;color:#fff;text-align:center;overflow:hidden}.invite-pass:before{position:absolute;inset:0 0 auto;height:4px;background:var(--red);content:""}.invite-pass-head{display:flex;justify-content:space-between;color:#bfc2c9;font-size:10px;font-weight:850;letter-spacing:.12em}.invite-pass-head span:last-child{color:#ff7770}.invite-pass-name{margin:12px 0;font-size:18px;font-weight:850}.invite-qr-preview{position:relative;width:204px;height:204px;margin:auto;padding:12px;border-radius:12px;background:#fff}.invite-qr-preview .qr{width:180px;height:180px;border:0;outline:none;background:repeating-conic-gradient(#202127 0% 25%,#fff 0% 50%) 50%/16px 16px}.invite-qr-preview img{position:absolute;top:50%;left:50%;width:54px;height:46px;padding:2px;border-radius:8px;background:#fff;transform:translate(-50%,-50%)}.invite-pass .invite-help{color:#bfc2c9}.setting-line .name-editor{display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1;min-width:0;padding:0;border:0}.setting-line .name-editor input{flex:1;min-width:90px}.setting-line .name-editor button{width:auto;min-height:38px;margin:0;padding:0 8px}.setting-line .name-editor .cancel-name{border:1px solid var(--line);background:#fff;color:var(--ink)}
  </style>
</head>
<body>
  <aside class="preview-bar"><div>
    <div class="preview-title"><b>グループ画面 採用案</b><span>一覧から招待・参加・設定まで操作できます</span></div>
    <nav class="preview-tabs" id="previewTabs"></nav>
    <p class="preview-note" id="previewNote">架空データを使った操作プレビューです。招待QR・リンクは見本で、実際には発行されません。</p>
  </div></aside>
  <div class="stage"><main class="phone" id="phone"></main></div>
  <script>
    const icons={plus:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',door:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5M8 12h11M15 8l4 4-4 4"/></svg>',member:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.5-4 2.4-6 5.5-6 2.2 0 3.8 1 4.7 3M18 7v6M15 10h6"/></svg>',share:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="18" cy="19" r="2"/><path d="M8 11l8-5M8 13l8 5"/></svg>'};
    const routeLabels={home:'一覧',detail:'最新記録',calendar:'カレンダー',graph:'グラフ',settings:'設定',invite:'招待',join:'参加',joinConfirm:'参加確認'};
    const groups={friends:{name:'いつものトレ仲間',today:5,sets:'18',volume:'14,280',live:1,members:8},university:{name:'大学トレ部',today:3,sets:'14',volume:'11,160',live:0,members:12},morning:{name:'朝トレ部',today:2,sets:'9',volume:'7,200',live:1,members:6}};
    let route='home',detailTab='latest',role='owner',ownerName='高橋',myName='高橋',selectedMemberName='',memberExpanded=false,nameEditing=false,groupNameValue='いつものトレ仲間',editNameValue='いつものトレ仲間',order=['friends','university','morning'],sheetOpen=false,sheetStep='input',groupName='',createdGroupName='',nameLength=0,toastTimer=null;
    const people=()=>'<span class="avatars"><span class="avatar live">高</span><span class="avatar">佐</span><span class="avatar">森</span></span>';
    const groupCard=(id)=>{const group=groups[id];return `<article class="community-card" data-group="${id}" role="button" tabindex="0"><span class="card-live ${group.live?'':'idle'}">${group.live?`<i class="dot"></i>${group.live}人がトレーニング中`:'今日は活動なし'}</span><h2>${group.name}</h2><div class="people">${people()}<span>${group.today}人</span></div><div class="stats"><span><b>${group.sets}</b><small>セット</small></span><span><b>${group.volume}</b><small>kg</small></span></div></article>`};
    const pill=(icon,label,action)=>`<button class="pill" data-action="${action}">${icon?icons[icon]:''}<span>${label}</span></button>`;
    function topbar(){return `<header class="header"><div class="logo">E-GO<span>TORE</span></div></header><button class="start">START</button><nav class="bottom"><button>ホーム</button><button class="on">グループ</button><button>履歴</button><button>設定</button></nav><div class="overlay ${sheetOpen?'open':''}" data-action="close-sheet"></div><section class="sheet ${sheetOpen?'open':''} ${sheetStep.startsWith('member')||sheetStep==='transferConfirm'||sheetStep==='deleteConfirm'||sheetStep==='leaveOwner'?'compact':''}" role="dialog" aria-modal="true" aria-label="${sheetStep==='input'?'グループを作成':sheetStep==='invite'?'メンバーを招待':sheetStep==='deleteConfirm'?'グループを削除':sheetStep==='leaveOwner'?'グループから抜ける':'メンバーの設定'}">${sheetOpen?sheetContent():''}</section><div class="toast" id="toast"></div>`}
    function home(){return `<div class="heading"><h1>グループ</h1><div class="actions">${pill('plus','作成','create')}${pill('door','参加','join')}</div></div><section class="section"><div class="section-head"><h2>所属グループ</h2></div><p class="order-note">長押しドラッグで表示順を変更</p><div class="cards" id="groupCards">${order.map(groupCard).join('')}</div></section>`}
    function detailHeader(){return `<button class="back" data-route="home">‹ グループ一覧</button><div class="heading"><div><p class="eyebrow">GROUP</p><h1>${escapeHtml(groupNameValue)}</h1></div>${pill('member','招待','invite')}</div><div class="people" style="margin:4px 0 0">${people()}<span>8人</span></div>`}
    function latest(){return `<article class="record"><div class="record-head"><b>高橋</b><span class="muted small">今日 10:42</span></div><p>3種目　9セット　5,460kg</p><div class="exercise"><b>ベンチプレス</b><span>75kg × 8回</span></div><div class="exercise"><span>スクワット</span><span>100kg × 5回</span></div><div class="exercise"><span>ラットプルダウン</span><span>45kg × 12回</span></div></article><article class="record"><div class="record-head"><b>佐藤</b><span class="muted small">昨日 19:08</span></div><p>2種目　7セット　3,820kg</p><div class="exercise"><b>デッドリフト</b><span>120kg × 5回</span></div><div class="exercise"><span>ベンチプレス</span><span>70kg × 8回</span></div></article>`}
    function calendar(){return `<div class="white-card section"><div class="section-head"><button class="text-action">‹ 前月</button><b>2026年9月</b><button class="text-action">次月 ›</button></div><div class="day-grid" style="margin-top:8px">${['月','火','水','木','金','土','日',...Array.from({length:30},(_,i)=>String(i+1))].map((day,i)=>`<span class="${[4,8,12,17,21,24,27].includes(i)?'active':''}">${day}</span>`).join('')}</div></div><p class="muted small section">日付を選ぶと、その日のグループ記録を表示</p>${latest()}`}
    function graph(){return `<div class="white-card section"><div class="section-head"><b>総負荷</b><div class="role-toggle"><button class="on">週</button><button>月</button></div></div><div class="bars"><i style="height:38%"></i><i style="height:62%"></i><i style="height:48%"></i><i style="height:82%"></i><i style="height:58%"></i><i style="height:94%"></i><i style="height:72%"></i></div><p class="muted small" style="margin:8px 0 0;text-align:center">今週　62,840kg</p></div><p class="muted small section">グラフは履歴画面と同じ部品へ置き換える予定です。</p>`}
    const memberData=[{name:'佐藤',initial:'佐',last:'今日 10:42',rank:4},{name:'森',initial:'森',last:'昨日 20:05',rank:3},{name:'高橋',initial:'高',last:'昨日 18:40',rank:2},{name:'石井',initial:'石',last:'9/24',rank:1},{name:'田中',initial:'田',last:'9/20',rank:0},{name:'山本',initial:'山',last:'9/12',rank:-1},{name:'伊藤',initial:'伊',last:'記録なし',rank:-2},{name:'鈴木',initial:'鈴',last:'記録なし',rank:-3}];
    const memberRow=member=>{const isOwner=member.name===ownerName,isSelf=member.name===myName;return `<div class="member-row"><span class="avatar">${member.initial}</span><span><b>${member.name}</b><small>${isOwner?'オーナー':isSelf?'あなた · メンバー':'メンバー'}　${member.last}</small></span>${isOwner?'<span class="owner-badge">オーナー</span>':role==='owner'?`<button class="text-action" data-action="member-options" data-member="${member.name}" aria-label="${member.name}の設定">•••</button>`:''}</div>`};
    function settings(){const groupInfo=`<section><h3>グループ情報</h3><div class="setting-card"><div class="setting-line"><b>グループ名</b>${role==='owner'?`<button class="text-action" data-action="edit-name">${escapeHtml(groupNameValue)}　›</button>`:`<span class="setting-value">${escapeHtml(groupNameValue)}</span>`}</div>${role==='owner'&&nameEditing?`<div class="name-editor"><label for="editGroupName">変更後の名前</label><input id="editGroupName" maxlength="40" value="${escapeHtml(editNameValue)}"><button data-action="save-name">変更する</button></div>`:''}</div></section>`;const memberList=[...memberData].sort((a,b)=>b.rank-a.rank).map(memberRow).join('');return `<div class="settings"><div class="role-toggle"><span class="muted small" style="align-self:center">表示:</span><button data-role="owner" class="${role==='owner'?'on':''}">オーナー</button><button data-role="member" class="${role==='member'?'on':''}">メンバー</button></div>${groupInfo}<section><div class="section-head"><h3>メンバー管理</h3><span class="muted small">最近トレーニング順 · 8人</span></div><div class="member-card ${memberExpanded?'expanded':'collapsed'}" id="memberCard"><div class="member-list">${memberList}</div><button class="member-fade" aria-label="メンバー一覧を${memberExpanded?'閉じる':'展開'}"></button></div></section><section><button class="danger" data-action="leave-group">グループから抜ける</button>${role==='owner'?`<button class="danger" style="margin-top:10px" data-action="delete-group">グループを削除</button>`:''}</section></div>`}
    function routeBody(){if(route==='home')return home();if(route==='detail'||route==='calendar'||route==='graph'||route==='settings'){const active=route==='detail'?'latest':route;return `${detailHeader()}<nav class="segment"><button data-tab="latest" class="${active==='latest'?'on':''}">最新記録</button><button data-tab="calendar" class="${active==='calendar'?'on':''}">カレンダー</button><button data-tab="graph" class="${active==='graph'?'on':''}">グラフ</button><button data-tab="settings" class="${active==='settings'?'on':''}">設定</button></nav><div id="detailBody">${active==='latest'?latest():active==='calendar'?calendar():active==='graph'?graph():settings()}</div>`}if(route==='invite')return `<button class="back" data-route="detail">‹ いつものトレ仲間</button><h1>メンバーを招待</h1><p class="invite-name">いつものトレ仲間</p>${qrBox()}<button class="pill share" data-action="share">${icons.share}<span>リンクを共有</span></button>`;if(route==='join')return `<button class="back" data-route="home">‹ グループ一覧</button><h1>グループに参加</h1><p class="muted">招待リンクを開くか、QRコードを読み取ります。</p><button class="pill share" data-action="scan">QRコードを読み取る</button><p class="muted small section">招待リンクを開いたときは、参加するグループを確認できます。</p>`;if(route==='joinConfirm')return `<button class="back" data-route="join">‹ 戻る</button><h1>グループへの招待</h1><div class="white-card"><h2>朝トレ部</h2><div class="people">${people()}<span>メンバー 6人</span></div><p class="muted small">7日間有効</p></div><button class="confirm" data-action="join-confirm">このグループに参加</button><button class="done" data-route="home">参加しない</button>`;return `<button class="back" data-route="settings">‹ グループ設定</button><h1>オーナーを変更</h1><p class="muted">新しいオーナーを選びます。</p><label class="field">移譲先<select id="ownerTarget"><option>佐藤</option><option>森</option><option>石井</option></select></label><button class="confirm" data-action="confirm-transfer">オーナーを変更</button>`}
    function qrBox(){const name=sheetStep==='invite'?createdGroupName:groupNameValue;return `<div class="qr-box"><div class="invite-pass"><div class="invite-pass-head"><span>E-GOTORE</span><span>INVITE</span></div><p class="invite-pass-name">${escapeHtml(name)}</p><div class="invite-qr-preview"><div class="qr"></div><img src="/previews/wombat-barbell.svg" alt=""></div><p class="invite-help">7日間有効</p></div></div>`}
    function sheetContent(){if(sheetStep==='input')return `<div class="handle"></div><div class="sheet-head"><h2>グループを作成</h2><button class="close" data-action="close-sheet" aria-label="閉じる">×</button></div><label class="field"><span class="field-head"><span>グループ名</span><span><span id="nameCount">${nameLength}</span> / 40</span></span><input id="groupName" maxlength="40" placeholder="例：いつものトレ仲間" value="${escapeHtml(groupName)}"></label><button class="confirm" data-action="create-group">作成する</button>`;if(sheetStep==='invite')return `<div class="handle"></div><div class="sheet-head"><h2>メンバーを招待</h2><button class="close" data-action="close-sheet" aria-label="閉じる">×</button></div><p class="invite-name">${escapeHtml(createdGroupName)}</p>${qrBox()}<button class="pill share" data-action="share">${icons.share}<span>リンクを共有</span></button><button class="done" data-action="close-sheet">完了</button>`;if(sheetStep==='memberActions')return `<div class="handle"></div><div class="sheet-head"><h2>${escapeHtml(selectedMemberName)}</h2><button class="close" data-action="close-sheet" aria-label="閉じる">×</button></div><div class="sheet-actions"><button data-action="start-transfer">オーナーにする</button><button class="danger-text" data-action="remove-member">退出させる</button></div>`;if(sheetStep==='deleteConfirm')return `<div class="handle"></div><div class="sheet-head"><h2>グループを削除</h2><button class="close" data-action="close-sheet" aria-label="閉じる">×</button></div><p class="delete-copy">「${escapeHtml(groupNameValue)}」を削除しますか？</p><div class="confirm-row"><button class="confirm-cancel" data-action="close-sheet">キャンセル</button><button class="confirm-delete" data-action="confirm-delete">削除する</button></div>`;if(sheetStep==='leaveOwner')return `<div class="handle"></div><div class="sheet-head"><h2>グループから抜ける</h2><button class="close" data-action="close-sheet" aria-label="閉じる">×</button></div><p class="delete-copy">オーナーがグループを抜けるには、先に別のメンバーへオーナー権限を移譲してください。</p><button class="confirm" data-action="leave-to-members">メンバー一覧へ</button>`;return `<div class="handle"></div><div class="sheet-head"><h2>オーナーを変更</h2><button class="close" data-action="close-sheet" aria-label="閉じる">×</button></div><p class="muted">${escapeHtml(selectedMemberName)}を新しいオーナーにします。</p><button class="confirm" data-action="confirm-transfer">変更する</button>`}
    function escapeHtml(value){return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
    function toast(message){const node=document.querySelector('#toast');node.textContent=message;node.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove('show'),1800)}
    function render(){document.querySelector('#phone').innerHTML=`${topbar()}<section class="screen" id="screen">${routeBody()}</section>`;document.querySelector('#previewTabs').innerHTML=Object.entries(routeLabels).map(([key,label])=>`<button class="${route===key?'on':''}" data-preview-route="${key}">${label}</button>`).join('');bind()}
    function bind(){document.querySelectorAll('[data-preview-route]').forEach(button=>button.onclick=()=>{route=button.dataset.previewRoute;sheetOpen=false;render()});document.querySelectorAll('[data-route]').forEach(button=>button.onclick=()=>{route=button.dataset.route;render()});document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{detailTab=button.dataset.tab;route=detailTab==='latest'?'detail':detailTab;render()});document.querySelectorAll('[data-role]').forEach(button=>button.onclick=()=>{role=button.dataset.role;myName=role==='owner'?ownerName:memberData.find(member=>member.name!==ownerName)?.name||'佐藤';nameEditing=false;memberExpanded=false;render()});document.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>{const action=button.dataset.action;if(action==='create'){sheetOpen=true;sheetStep='input';groupName='';nameLength=0;render();document.querySelector('#groupName')?.focus()}else if(action==='join'){route='join';render()}else if(action==='invite'){route='invite';render()}else if(action==='close-sheet'){sheetOpen=false;render()}else if(action==='edit-name'){nameEditing=true;editNameValue=groupNameValue;render()}else if(action==='save-name'){const value=document.querySelector('#editGroupName').value.trim();if(!value)return toast('グループ名を入力してください');groupNameValue=value;groups.friends.name=value;nameEditing=false;render();toast('名前変更後の表示例です')}else if(action==='create-group'){const value=document.querySelector('#groupName').value.trim();if(!value)return toast('グループ名を入力してください');createdGroupName=value;groups.created={name:value,today:0,sets:'0',volume:'0',live:0,members:1};order.unshift('created');sheetStep='invite';sheetOpen=true;render()}else if(action==='share'){toast('招待リンクを共有する動作の見本です')}else if(action==='scan'){route='joinConfirm';render()}else if(action==='join-confirm'){groups.morning.members++;toast('参加後の画面イメージです')}else if(action==='member-options'){selectedMemberName=button.dataset.member;sheetStep='memberActions';sheetOpen=true;render()}else if(action==='start-transfer'){sheetStep='transferConfirm';render()}else if(action==='confirm-transfer'){ownerName=selectedMemberName;role='member';myName='高橋';sheetOpen=false;route='settings';render();toast('オーナー変更後の表示例です')}else if(action==='remove-member'){sheetOpen=false;render();toast('退出確認の表示例です')}else if(action==='delete-group'){sheetStep='deleteConfirm';sheetOpen=true;render()}else if(action==='confirm-delete'){order=order.filter(id=>id!=='friends');sheetOpen=false;route='home';render();toast('グループ削除後の画面イメージです')}else if(action==='leave-group'){if(role==='owner'){sheetStep='leaveOwner';sheetOpen=true;render()}else{toast('退出確認の表示例です')}}else if(action==='leave-to-members'){sheetOpen=false;route='settings';memberExpanded=true;render();setTimeout(()=>document.querySelector('#memberCard')?.scrollIntoView({behavior:'smooth',block:'center'}),0)}});const nameInput=document.querySelector('#groupName');if(nameInput)nameInput.oninput=event=>{groupName=event.target.value;nameLength=groupName.length;document.querySelector('#nameCount').textContent=String(nameLength)};const editInput=document.querySelector('#editGroupName');if(editInput)editInput.oninput=event=>editNameValue=event.target.value;const memberCard=document.querySelector('#memberCard');if(memberCard){memberCard.onclick=event=>{if(event.target.closest('[data-action]'))return;memberExpanded=!memberExpanded;render()}}document.querySelectorAll('#groupCards [data-group]').forEach(card=>bindDrag(card))}
    function bindDrag(card){let timer=null,dragging=false,suppressClick=false;card.onclick=()=>{if(suppressClick){suppressClick=false;return}route='detail';detailTab='latest';render()};card.addEventListener('pointerdown',event=>{if(event.button!==0)return;timer=setTimeout(()=>{dragging=true;card.classList.add('is-dragging')},430)});card.addEventListener('pointermove',event=>{if(!dragging)return;const target=document.elementFromPoint(event.clientX,event.clientY)?.closest('#groupCards [data-group]');if(!target||target===card)return;const rect=target.getBoundingClientRect();target.parentElement.insertBefore(card,event.clientY<rect.top+rect.height/2?target:target.nextElementSibling)});const stop=()=>{if(timer)clearTimeout(timer);timer=null;if(dragging){dragging=false;card.classList.remove('is-dragging');suppressClick=true;order=[...document.querySelectorAll('#groupCards [data-group]')].map(item=>item.dataset.group);setTimeout(()=>{suppressClick=false},0)}};card.addEventListener('pointerup',stop);card.addEventListener('pointercancel',stop)}
    render();
  </script>
  <script>
    const renderAdoptedBase = render;
    render = function () {
      renderAdoptedBase();
      const nameButton = document.querySelector('.setting-line [data-action="edit-name"]');
      if (nameButton) nameButton.textContent = groupNameValue;
      const editor = document.querySelector('.name-editor');
      if (!editor || !nameButton) return;
      editor.querySelector('label')?.remove();
      const commit = editor.querySelector('[data-action="save-name"]');
      if (commit) commit.textContent = '決定';
      const cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.className = 'cancel-name';
      cancel.textContent = 'キャンセル';
      cancel.onclick = () => { nameEditing = false; render(); };
      editor.append(cancel);
      nameButton.replaceWith(editor);
    };
    render();
  </script>
</body>
</html>
