 solid var(--bg);border-radius:50%;background:var(--accent)}.avatar.two{--photo:linear-gradient(135deg,#8fa6c9,#d9cec0)}.avatar.three{--photo:linear-gradient(135deg,#d1aa87,#574b4a)}.best-fire{position:absolute;right:-8px;top:-9px;font-size:14px;line-height:1}.menu{min-height:48px;display:flex;align-items:center;border-bottom:1px solid var(--line);font-size:13px;font-weight:700}.menu span{margin-left:auto;margin-right:10px;color:var(--muted);font-size:11px;font-weight:400}.menu i{font-size:20px;font-style:normal;color:var(--muted);letter-spacing:1px}.parts{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));border-bottom:1px solid var(--line);margin-top:12px}.part{min-height:46px;border-bottom:2px solid transparent;padding:14px 0 3px;text-align:center;white-space:nowrap;font-size:10px;color:var(--muted)}.part.selected{border-bottom-color:var(--accent);color:var(--accent);font-weight:800}.option{min-height:57px;border-bottom:1px solid var(--line);padding:8px 0;display:flex;align-items:center;justify-content:space-between}.option b{display:block;font-size:15px}.option small{display:block;margin-top:2px;color:var(--muted);font-size:11px}.arrow{color:var(--muted);font-size:18px;padding:0 5px}.sheet{position:absolute;inset:0;background:#0004;display:flex;align-items:end}.sheet-card{width:100%;min-height:365px;background:var(--panel);border-top:1px solid var(--line);padding:16px}.sheet-card h3{margin:0;font-size:18px}.close{position:absolute;right:18px;border:0;background:transparent;color:var(--muted);font-size:20px}.meta{display:flex;gap:13px;border-bottom:1px solid var(--line);padding:8px 0;color:var(--muted);font-size:11px}.meta b{color:var(--text);font-size:14px}.exercise{padding:8px 0;border-bottom:1px solid var(--line)}.exercise h4{margin:0 0 4px;font-size:13px}.set{font-size:12px;font-variant-numeric:tabular-nums;line-height:1.9}.set.best{color:var(--accent);font-weight:800}.set .inline-fire{margin-left:3px;font-size:14px;vertical-align:-1px}.stamps{display:flex;gap:7px;padding-top:11px}.stamps button{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;background:var(--panel);font-size:15px}.stamps button:first-child{border-color:var(--accent);background:#fff0f0}
