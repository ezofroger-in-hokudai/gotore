<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-GOTORE 今日の活動案</title><style>
:root{--bg:#f4f4f5;--p:#fff;--t:#17191d;--m:#656a74;--l:#dedfe3;--r:#ce282b;--s:#fff0f0}*{box-sizing:border-box}body{margin:0;background:#e2e3e7;color:var(--t);font:14px -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}button{font:inherit;cursor:pointer}.tabs{position:sticky;top:0;z-index:3;display:flex;justify-content:center;gap:7px;flex-wrap:wrap;padding:10px;background:#fff;border-bottom:1px solid #d5d6da}.tabs button{min-height:35px;border:1px solid #b7bac1;border-radius:8px;padding:5px 10px;background:#fff}.tabs button[aria-pressed=true]{border-color:var(--r);background:var(--s);color:#9e1e22;font-weight:700}.note{max-width:430px;margin:12px auto;padding:0 16px;color:#4c5058;font-size:12px;line-height:1.5}.phone{position:relative;width:min(100%,430px);min-height:844px;margin:auto;background:var(--bg);overflow:hidden}.head{height:65px;padding:20px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:22px;font-weight:800}.logo b{color:var(--r)}.bell{border:0;background:none;font-size:22px}.main{padding:14px 20px 110px}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.title h1{margin:0;font-size:22px}.title button{border:0;background:none;color:var(--m);font-size:12px}.view{display:none}.view.active{display:block}.numbers{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--l);border-bottom:1px solid var(--l);margin-bottom:18px}.numbers div{padding:12px 7px 11px 0}.numbers div+div{padding-left:12px;border-left:1px solid var(--l)}.numbers span{display:block;color:var(--m);font-size:10px;font-weight:700;letter-spacing:.06em}.numbers b{display:block;margin-top:4px;font-size:19px}.red{color:var(--r)}.filters{display:flex;gap:7px;overflow:hidden;margin:0 -20px 18px;padding:0 20px}.filter{flex:none;min-height:36px;border:1px solid var(--l);border-radius:8px;padding:6px 11px;background:var(--p);color:var(--m);font-size:12px}.filter.on{border-color:#efcaca;background:var(--s);color:var(--r);font-weight:700}.section{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px}.section h2{margin:0;font-size:16px}.section span{color:var(--m);font-size:11px}.feed{border-top:1px solid var(--l)}.workout{padding:15px 0 13px;border-bottom:1px solid var(--l)}.workout header{display:flex;justify-content:space-between;gap:8px}.workout h3,.workout p{margin:0}.workout h3{font-size:14px}.workout time,.meta,.total{color:var(--m);font-size:11px}.meta{margin-top:5px!important}.exercises{margin-top:10px!important;font-weight:700;line-height:1.5}.total{margin-top:4px!important}.react{display:flex;gap:6px;margin-top:11px}.stamp{min-height:31px;border:1px solid var(--l);border-radius:7px;padding:4px 9px;background:var(--p);font-size:12px}.detail{margin-left:auto;border:0;background:none;color:var(--m);font-size:12px}.card{margin-bottom:12px;border:1px solid var(--l);border-radius:10px;padding:14px;background:var(--p)}.card .react{border-top:1px solid var(--l);padding-top:11px}.day{margin:18px 0 8px;color:var(--m);font-size:11px;font-weight:700;letter-spacing:.06em}.live-line{display:flex;align-items:center;gap:8px;margin:0 0 17px;padding:12px 0;border-top:1px solid var(--l);border-bottom:1px solid var(--l)}.dot{width:7px;height:7px;border-radius:50%;background:var(--r)}.start{position:absolute;right:20px;bottom:82px;min-height:52px;border:0;border-radius:10px;padding:0 18px;background:var(--r);box-shadow:0 5px 13px #0003;color:#fff;font-weight:700}.nav{position:absolute;right:0;bottom:0;left:0;display:grid;grid-template-columns:repeat(4,1fr);min-height:66px;border-top:1px solid var(--l);background:var(--p)}.nav span{text-align:center;padding:21px 0;color:var(--m);font-size:12px}.nav .on{border-top:2px solid var(--r);color:var(--r);font-weight:700}@media(max-width:340px){.phone{min-height:720px}.main{padding-right:14px;padding-left:14px}.head{padding-right:14px;padding-left:14px}.filters{margin-right:-14px;margin-left:-14px;padding-right:14px;padding-left:14px}.start{right:14px}}
</style><body><div class="tabs"><button data-view="a" aria-pressed=true>A 要約＋行</button><button data-view="b" aria-pressed=false>B カード</button><button data-view="c" aria-pressed=false>C 時系列</button><button data-view="d" aria-pressed=false>D LIVE分離</button></div><p class="note">各項目はセットではなく、1回のトレーニング全体です。スタンプは押して見た目を確認できます。</p><div class="phone"><header class="head"><div class="logo">E-GO<b>TORE</b></div><button class="bell">♧</button></header><main class="main"><div class="title"><h1>ホーム</h1><button>グループ一覧</button></div><section class="view active" data-panel="a"><div class="numbers"><div><span class=red>● LIVE</span><b>2人</b></div><div><span>TODAY</span><b>4人</b></div><div><span>SETS</span><b>18</b></div></div><div class="filters"><button class="filter on">すべて</button><button class="filter">GO TORE</button><button class="filter">朝トレ部</button></div><div class="section"><h2>トレーニング</h2><span>新しい順</span></div><div class="feed rows"></div></section><section class="view" data-panel="b"><div class="filters"><button class="filter on">すべて</button><button class="filter">GO TORE</button><button class="filter">朝トレ部</button></div><div class="section"><h2>今日の活動</h2><span>3件</span></div><div class="cards"></div></section><section class="view" data-panel="c"><div class="numbers"><div><span class=red>● LIVE</span><b>2人</b></div><div><span>TODAY</span><b>4人</b></div><div><span>SETS</span><b>18</b></div></div><p class="day">今日 · 9月25日</p><div class="feed rows"></div><p class="day">昨日 · 9月24日</p><div class="feed rows one"></div></section><section class="view" data-panel="d"><div class="live-line"><i class=dot></i><b>いま 2人がトレーニング中</b><button class="detail">見る ›</button></div><div class="filters"><button class="filter on">すべて</button><button class="filter">GO TORE</button><button class="filter">朝トレ部</button></div><div class="section"><h2>完了したトレーニング</h2><span>新しい順</span></div><div class="feed rows"></div></section></main><button class=start>START</button><nav class=nav><span class=on>ホーム</span><span>グループ</span><span>履歴</span><span>設定</span></nav></div><template id=row><article class=workout><header><h3></h3><time></time></header><p class=meta></p><p class=exercises></p><p class=total></p><div class=react><button class=stamp>🔥 2</button><button class=stamp>👏</button><button class=stamp>💪</button><button class=detail>詳細 ›</button></div></article></template><script>
const data=[['みお','GO TORE','いま','胸・肩 · 3種目 · 9セット','ベンチプレス · インクラインプレス · ペックフライ','総負荷 3,920 kg'],['たくみ','朝トレ部','12分前','脚 · 2種目 · 6セット','スクワット · レッグプレス','総負荷 5,240 kg'],['ゆう','GO TORE','38分前','背中 · 4種目 · 12セット','ラットプルダウン · ローイング · デッドリフト · シュラッグ','総負荷 4,680 kg']];function add(target,limit=3,card=false){data.slice(0,limit).forEach(d=>{let n=document.querySelector('#row').content.cloneNode(true),e=n.querySelector('.workout'),[name,group,time,meta,exercises,total]=d;if(card)e.classList.add('card');n.querySelector('h3').textContent=name;n.querySelector('time').textContent=time;n.querySelector('.meta').textContent=`${group} · ${meta}`;n.querySelector('.exercises').textContent=exercises;n.querySelector('.total').textContent=total;target.append(n)})}document.querySelectorAll('.rows').forEach(x=>add(x,x.classList.contains('one')?1:3));document.querySelectorAll('.cards').forEach(x=>add(x,3,true));document.addEventListener('click',e=>{let s=e.target.closest('.stamp');if(s)s.classList.toggle('on');let f=e.target.closest('.filter');if(f)f.parentElement.querySelectorAll('.filter').forEach(x=>x.classList.toggle('on',x===f))});document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.dataset.panel===b.dataset.view))}));
</script></body></html>
