<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>E-GOTORE 長い記録カード4案</title>
    <style>
      * { box-sizing:border-box; }
      html,body { height:100%; margin:0; background:#e6e7ea; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif; }
      body { display:grid; grid-template-rows:auto 1fr; }
      .chooser { z-index:2; padding:9px 10px 8px; border-bottom:1px solid #cfd1d6; background:rgba(246,246,247,.98); box-shadow:0 4px 14px rgba(20,22,28,.08); }
      .choices { display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; }
      .choices::-webkit-scrollbar { display:none; }
      button { flex:0 0 auto; min-height:34px; padding:0 12px; border:1px solid #c8cbd1; border-radius:18px; background:#fff; color:#565a63; font-family:inherit; font-size:11px; font-weight:700; }
      button[aria-pressed="true"] { border-color:#202127; background:#202127; color:#fff; }
      .description { margin:6px 3px 0; color:#656a73; font-size:10px; line-height:1.4; }
      iframe { width:100%; height:100%; border:0; background:#f5f5f6; }
    </style>
  </head>
  <body>
    <header class="chooser">
      <nav class="choices" aria-label="長い記録カードの案">
        <button data-mode="full" aria-pressed="true">A 全展開</button>
        <button data-mode="fade" aria-pressed="false">B 固定＋フェード（採用）</button>
        <button data-mode="accordion" aria-pressed="false">C 種目ごと</button>
        <button data-mode="summary" aria-pressed="false">D 概要＋詳細</button>
      </nav>
      <p class="description"></p>
    </header>
    <iframe title="長いトレーニング記録の表示案"></iframe>
    <script>
      const options={
        full:{hash:"a",description:"現在案。5種目・22セットを最初から1枚のカードに全て表示"},
        fade:{hash:"b",description:"採用案。カードを一定の高さにし、文字のない下端フェードを押すとその場に全展開"},
        accordion:{hash:"c",description:"種目名とセット数を並べ、見たい種目だけカード内で開閉"},
        summary:{hash:"d",description:"カードは種目ごとのセット数まで。全セットは下から開く詳細で表示"}
      };
      const frame=document.querySelector("iframe");
      const description=document.querySelector(".description");
      function show(mode){const selected=options[mode]?mode:"full";frame.src=`home-feed-filter-options.html?adopted=1&stress=1&recordMode=${selected}#a`;description.textContent=options[selected].description;document.querySelectorAll("button").forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.mode===selected)));history.replaceState(null,"",`#${options[selected].hash}`)}
      document.querySelectorAll("button").forEach(button=>button.addEventListener("click",()=>show(button.dataset.mode)));
      const initial=Object.entries(options).find(([,value])=>value.hash===location.hash.slice(1))?.[0]||"fade";
      show(initial);
    </script>
  </body>
</html>
