:root{--bg:#f4f4f5;--panel:#fff;--text:#17191d;--muted:#656a74;--line:#dedfe3;--accent:#d32f2f;--track:#eceef1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.intro{max-width:430px;margin:auto;padding:28px 16px 14px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--accent)}h1{margin:5px 0;font-size:26px;letter-spacing:-.04em}.intro p{margin:0;color:var(--muted)}.phone{max-width:430px;min-height:735px;margin:auto;background:var(--bg);border:1px solid #353a43;overflow:hidden;position:relative}.status{height:29px;padding:8px 16px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:800}.screen{padding:0 16px 18px}.heading{height:48px;margin:0 -16px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#202127;color:#fff}.heading h2{margin:0;font-size:22px;letter-spacing:-.7px}.heading h2 span{color:var(--accent)}.finish{flex:0 0 auto;min-height:40px;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:#fff;padding:4px 8px;font-size:12px;font-weight:700;white-space:nowrap}.groups{display:flex;justify-content:center;gap:6px;min-height:43px;margin-top:0;padding:4px;overflow-x:auto;border-radius:12px;background:var(--track)}.groups span{min-height:35px;padding:9px 12px;border-radius:9px;color:var(--muted);font-size:11px}.groups .selected{background:var(--panel);color:var(--text);box-shadow:0 1px 3px #0000000d;font-weight:800}.people{display:flex;gap:14px;min-height:69px;align-items:center;border-bottom:1px solid var(--line)}.person{width:49px;text-align:center;color:var(--muted);font-size:10px}.person b{display:block;height:15px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--accent)}.avatar{position:relative;display:block;width:38px;height:38px;margin:auto;border-radius:50%;background:linear-gradient(135deg,#e3bda4,#76645d);outline:2px solid var(--accent);outline-offset:2px}.avatar::after{content:"";position:absolute;width:10px;height:10px;right:-4px;bottom:-3px;border:2px solid var(--bg);border-radius:50%;background:var(--accent)}.best-fire{position:absolute;right:-8px;top:-9px;font-size:14px;line-height:1}.menu{min-height:48px;display:flex;align-items:center;border-bottom:1px solid var(--line);font-size:13px;font-weight:700}.menu span{margin-left:auto;margin-right:10px;color:var(--muted);font-size:11px;font-weight:400}.menu i{font-size:20px;font-style:normal;color:var(--muted);letter-spacing:1px}.parts{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px;padding:4px;border-radius:12px;background:var(--track);margin-top:4px}.part{min-height:35px;border-radius:9px;padding:0 2px;display:grid;place-items:center;text-align:center;white-space:nowrap;font-size:11px;color:var(--muted)}.part.selected{background:var(--panel);color:var(--text);box-shadow:0 1px 3px #0000000d;font-weight:800}.option{min-height:57px;border-bottom:1px solid var(--line);padding:8px 0;display:flex;align-items:center;justify-content:space-between}.option b{display:block;font-size:15px}.option small{display:block;margin-top:2px;color:var(--muted);font-size:11px}.arrow{color:var(--muted);font-size:18px;padding:0 5px}.sheet{position:absolute;inset:0;background:#0004;display:flex;align-items:end}.sheet-card{width:100%;min-height:408px;background:var(--panel);border-top:1px solid var(--line);padding:16px}.sheet-card h3{margin:0;font-size:18px}.close{position:absolute;right:18px;border:0;background:transparent;color:var(--muted);font-size:20px}.meta{display:flex;gap:12px;border-bottom:1px solid var(--line);padding:8px 0;color:var(--muted);font-size:11px}.meta b{color:var(--text);font-size:14px}.exercise{padding:8px 0;border-bottom:1px solid var(--line)}.exercise h4{margin:0 0 4px;font-size:13px}.set{display:flex;justify-content:space-between;font-size:12px;font-variant-numeric:tabular-nums;line-height:1.9}.set .rm{color:var(--muted)}.set.best{color:var(--accent);font-weight:800}.set.best .rm{color:var(--accent)}.inline-fire{margin-left:3px;font-size:14px;vertical-align:-1px}.stamps{display:flex;gap:5px;align-items:center;padding-top:12px}.stamps button{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:var(--panel);font-size:16px}.stamps button.selected{border-color:var(--accent);background:#fff0f0}.stamps button:active{transform:scale(.94)}.stamps .more{margin-left:auto;border:0;color:var(--muted);font-size:19px}
