<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GO TORE — 種目選択</title>
<style>
:root{color-scheme:light;--bg:#f2f3f5;--panel:#fff;--ink:#20242b;--muted:#68717c;--line:#d8dce2;--red:#d32f2f;--soft:#fff0ef;--green:#1d7449}[data-theme=dark]{color-scheme:dark;--bg:#17191e;--panel:#20242b;--ink:#f2f3f5;--muted:#a7aeb8;--line:#3d434d;--soft:#3a2427;--green:#83d9a9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--red);outline-offset:3px}.intro{max-width:1060px;margin:auto;padding:32px 24px 15px}.eyebrow{font-size:12px;letter-spacing:.13em;font-weight:800;color:var(--red)}h1{font-size:29px;letter-spacing:-.05em;margin:7px 0}.intro p{margin:0;color:var(--muted)}.tools{display:flex;gap:8px;margin-top:18px}.tools button{min-height:40px;padding:6px 13px;border:1px solid var(--line);border-radius:99px;background:var(--panel)}.tools button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--panel)}.tools .theme{margin-left:auto}.grid{max-width:1060px;margin:auto;padding:8px 24px 38px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.option h2{font-size:17px;margin:8px 0 12px}.phone{max-width:430px;margin:auto;border:1px solid #363c46;border-radius:25px;overflow:hidden;background:var(--panel);box-shadow:0 14px 30px #0001}.status{height:29px;padding:10px 18px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:800}.screen{min-height:708px;padding:9px 16px 20px}.head{display:flex;justify-content:space-between;align-items:center;min-height:43px}.head h3{margin:0;font-size:20px;letter-spacing:-.04em}.finish{border:0;background:none;color:var(--red);font-size:11px;padding:8px 0}.menu{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin:7px 0 13px}.menu-title{font-size:11px;color:var(--muted);margin:0 0 7px}.menu-track{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none}.menu-row{flex:0 0 auto;display:flex;align-items:baseline;gap:6px;min-height:29px;white-space:nowrap}.menu-row b{font-size:13px}.menu-row span{font-size:11px;color:var(--muted)}.metrics{display:grid;grid-template-columns:1.45fr .65fr 1fr;gap:8px;margin:10px 0 15px}.metric small{display:block;color:var(--muted);font-size:10px}.metric b{font-size:19px;letter-spacing:-.05em}.metric:last-child b{font-size:12px;color:var(--green);letter-spacing:0}.parts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 15px}.part{min-height:50px;border:1px solid var(--line);background:var(--panel);padding:5px 1px;font-size:12px}.part i{display:block;margin:auto auto 2px;width:5px;height:5px;border-radius:50%;background:transparent}.part[aria-pressed=true]{background:var(--soft);border-color:var(--red);color:var(--red);font-weight:800}.part[aria-pressed=true] i{background:var(--red)}.rows{border-top:1px solid var(--line)}.exercise{width:100%;min-height:62px;display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 0}.exercise strong{font-size:15px}.exercise small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.exercise span:last-child{color:var(--muted);font-size:15px}.compact-menu{display:flex;gap:5px;margin:5px 0 13px}.compact-menu span{border:1px solid var(--red);color:var(--red);background:var(--soft);padding:4px 8px;font-size:11px}.divider{height:1px;background:var(--line);margin:14px 0}.volume{display:flex;align-items:baseline;gap:8px;padding:10px 0}.volume b{font-size:25px;letter-spacing:-.06em}.volume small{color:var(--muted);font-size:11px}.accent{color:var(--green);font-weight:750;font-size:11px}.bottom{position:relative;margin-top:20px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.bottom small{color:var(--muted)}.add{width:35px;height:35px;border:1px solid var(--line);background:var(--panel);font-size:21px;line-height:1}.note{max-width:1060px;margin:-20px auto 32px;padding:0 24px;color:var(--muted);font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}}@media(max-width:600px){.intro{padding:22px 16px 12px}.intro h1{font-size:25px}.grid{padding:5px 0 30px}.option h2{margin-left:16px}.phone{max-width:none;border-left:0;border-right:0;border-radius:0}.tools .theme{margin-left:0}}
</style>
<header class="intro"><span class="eyebrow">GO TORE / 画面比較・試作 3</span><h1>今日のメニューから、次の種目へ。</h1><p>説明を消した3案です。赤い部位を複数選ぶと、その部位の種目だけが残ります。</p><div class="tools"><button data-view="all" aria-pressed="true">3案を比較</button><button data-view="A" aria-pressed="false">A</button><button data-view="B" aria-pressed="false">B</button><button data-view="C" aria-pressed="false">C</button><button class="theme" data-theme>ダーク表示</button></div></header><main class="grid" id="preview-grid"></main><p class="note">胸・腕を選択した例です。種目は最近使った順で並ぶ想定です。</p>
<script>
const views={A:"メニューを先に置く",B:"数値を横に置く",C:"最短表示"},parts=["胸","背中","脚","肩","腕","腹筋","お尻","他"],rows=[["ベンチプレス","72.5kg × 8"],["トライセプスプレスダウン","25kg × 12"],["ダンベルフライ","14kg × 12"]];let view="all";
const body=()=>`<div class="parts">${parts.map((p,i)=>`<button class="part" aria-pressed="${i===0||i===4}"><i></i>${p}</button>`).join("")}</div>`;const exercises=()=>`<div class="rows">${rows.map(([name,last])=>`<button class="exercise"><span><strong>${name}</strong><small>${last}</small></span><span>›</span></button>`).join("")}</div>`;const menu=()=>`<section class="menu"><p class="menu-title">今日のメニュー</p><div class="menu-track"><div class="menu-row"><b>ベンチプレス</b><span>72.5 × 8　70 × 10　70 × 10</span></div><div class="menu-row"><b>ラットプルダウン</b><span>55 × 10　55 × 10</span></div></div></section>`;const metrics=()=>`<section class="metrics"><div class="metric"><small>総負荷</small><b>3,240kg</b></div><div class="metric"><small>セット</small><b>5</b></div><div class="metric"><small>先週比</small><b>+420kg</b></div></section>`;const head=()=>`<header class="head"><h3>種目を選択</h3><button class="finish">今日のトレーニング終了</button></header>`;const phone=kind=>{if(kind==="A")return `<div class="phone"><div class="status"><span>9:41</span><span>● ▰</span></div><div class="screen">${head()}${menu()}${metrics()}${body()}${exercises()}<footer class="bottom"><small>＋で種目を追加・管理</small><button class="add" aria-label="種目を追加">＋</button></footer></div></div>`;if(kind==="B")return `<div class="phone"><div class="status"><span>9:41</span><span>● ▰</span></div><div class="screen">${head()}${menu()}${body()}${metrics()}${exercises()}<footer class="bottom"><small>＋</small><button class="add" aria-label="種目を追加">＋</button></footer></div></div>`;return `<div class="phone"><div class="status"><span>9:41</span><span>● ▰</span></div><div class="screen">${head()}${menu()}<div class="compact-menu"><span>胸</span><span>腕</span></div><div class="volume"><b>3,240kg</b><small>5 set</small><span class="accent">先週 +420kg</span></div>${body()}${exercises()}<footer class="bottom"><small>＋</small><button class="add" aria-label="種目を追加">＋</button></footer></div></div>`};function render(){document.querySelector("#preview-grid").innerHTML=Object.entries(views).filter(([id])=>view==="all"||view===id).map(([id,title])=>`<section class="option"><h2>${id} · ${title}</h2>${phone(id)}</section>`).join("")}document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.view){view=b.dataset.view;document.querySelectorAll("[data-view]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));render()}else if(b.dataset.theme!==undefined){const dark=document.documentElement.dataset.theme!=="dark";document.documentElement.dataset.theme=dark?"dark":"";b.textContent=dark?"ライト表示":"ダーク表示"}else if(b.classList.contains("part")){b.setAttribute("aria-pressed",String(b.getAttribute("aria-pressed")!=="true"))}});render();
</script>
</html>
