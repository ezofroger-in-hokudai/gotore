<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>採用A · 中央への高速カットイン</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9ebef;color:#202126;font-family:Arial,"Noto Sans JP",sans-serif}button,select{font:inherit}button{cursor:pointer}header{padding:22px max(18px,calc((100vw - 1300px)/2));background:white;border-bottom:1px solid #d4d7dc}h1{font-size:22px;margin:0 0 8px}header p{font-size:13px;line-height:1.7;color:#636b78;margin:0}.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:15px}.controls button,.controls select{padding:9px 12px;border:1px solid #ccd0d7;border-radius:8px;background:white;font-size:13px}.controls .primary{background:#d9292d;color:white;border-color:#d9292d}.controls button[aria-pressed=true]{background:#202126;color:white}label{font-size:12px;display:flex;align-items:center;gap:6px}main{display:flex;align-items:flex-start;justify-content:center;gap:22px;padding:25px 16px;flex-wrap:wrap}.example{width:var(--phone-width,390px);max-width:100%}.example h2{font-size:17px;margin:0 0 6px}.example p{font-size:12px;color:#636b78;margin:0 0 12px;line-height:1.6}.phone{position:relative;width:100%;height:844px;overflow:hidden;border:1px solid #cbd0d8;border-radius:14px;background:#f5f5f7;box-shadow:0 8px 24px #20212612}.phone iframe{height:100%;width:100%;border:0;display:block}.layer{position:absolute;inset:0;pointer-events:none;z-index:5}.position{position:absolute;left:12px;right:12px;top:50%;transform:translateY(-50%)}.ticket{position:relative;overflow:hidden;color:#fff;padding:18px;border:1px solid #ea637a;border-radius:16px;background:linear-gradient(110deg,#d62843,#70172d 65%,#2b202a);box-shadow:0 12px 28px #59172c40;visibility:hidden}.ticket.visible{visibility:visible}.live{display:inline-flex;font-size:9px;letter-spacing:2px;font-weight:800;color:#ffc1ce;padding:3px 7px;border-radius:5px;background:#ffffff16;margin-bottom:8px}.names{font-size:12px;color:#ffe3e7;margin-bottom:3px}.title{display:block;font-size:19px;font-weight:900;letter-spacing:-.3px;line-height:1.4;white-space:nowrap}.faces{display:flex;align-items:center;gap:7px;margin-top:9px;border-top:1px solid #ffffff38;padding-top:9px}.face{height:34px;width:34px;flex-shrink:0;overflow:hidden;border:2px solid #ffd0d5;border-radius:50%;background:#65707e}.face svg{width:100%;height:100%;display:block}.extra{font-size:11px;background:#ffffff20;border-radius:20px;padding:5px 7px;white-space:nowrap}.shine{position:absolute;inset:-30% -10%;background:linear-gradient(100deg,transparent 40%,#fff4 50%,transparent 60%);transform:translateX(-130%);pointer-events:none}.speed{position:absolute;left:0;right:0;top:50%;height:2px;background:linear-gradient(90deg,transparent,#ea637a,transparent);opacity:0;pointer-events:none}.a.enter{animation:snap .24s cubic-bezier(.12,.85,.2,1) both}.b.enter{animation:diagonal .28s cubic-bezier(.08,.88,.2,1) both}.c.enter{animation:open .25s cubic-bezier(.16,.9,.22,1) both}.enter .shine{animation:shine .3s .11s ease-out both}.layer.play .speed{animation:speed .24s ease-out both}.ticket.leave{animation:leave .20s cubic-bezier(.55,0,1,.45) both}.ticket.current.enter{animation:current .38s cubic-bezier(.12,.82,.23,1) both}.ticket.current .shine{display:none}.ticket.record{padding:10px 12px;background:#202126;border-color:#ffffff16}.ticket.record .title{font-size:12px}.ticket.record .faces{margin-top:6px;padding-top:0;border:0}.ticket.record .face{width:24px;height:24px}
@keyframes current{from{opacity:0;transform:translate(100%,-15px) rotate(-4deg)}to{opacity:1;transform:translate(0,0) rotate(0)}}
@keyframes snap{0%{transform:translateX(-115%);opacity:0}18%{opacity:1}72%{transform:translateX(7px)}100%{transform:translateX(0)}}
@keyframes diagonal{0%{transform:translate(-115%,-42px) skewX(-9deg);opacity:0}16%{opacity:1}72%{transform:translate(6px,2px) skewX(1deg)}100%{transform:translate(0,0) skewX(0)}}
@keyframes open{0%{clip-path:inset(44% 48% round 16px);transform:scale(.92);opacity:0}18%{opacity:1}72%{clip-path:inset(0 round 16px);transform:scale(1.025)}100%{clip-path:inset(0 round 16px);transform:scale(1)}}
@keyframes shine{to{transform:translateX(130%)}}@keyframes speed{0%{opacity:0;transform:scaleX(.1)}35%{opacity:.7}100%{opacity:0;transform:scaleX(1.1)}}@keyframes leave{to{opacity:0;transform:translateX(115%)}}
.stamp{position:absolute;left:12px;right:12px;top:56px;min-height:88px;background:#202126;border-radius:16px;border:1px solid #ffffff16;border-left:3px solid #ed2933;color:white;padding:10px 14px;display:none}.stamp.show{display:block;animation:stamp .22s ease-out both}.stamp strong{font-size:13px}.stamp-heading{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:23px}.senders{display:flex;align-items:center;flex-shrink:0}.senders .face{width:20px;height:20px;border:1px solid #9b9eaa}.senders .face+.face{margin-left:-4px}.senders small{font-size:9px;margin-left:3px}.kinds{display:flex;gap:4px;margin-top:8px}.kind{width:42px;padding:2px;text-align:center;background:#ffffff0e;border-radius:8px}.kind b{font-size:22px;font-weight:normal;display:block}.kind small{font-size:11px}@keyframes stamp{from{opacity:0;transform:translateY(-110%)}to{opacity:1;transform:translateY(0)}}
.example>button{margin-top:12px;width:100%;padding:11px;border:1px solid #c7cbd2;border-radius:8px;background:white;font-size:13px}.status{font-size:12px;color:#6c7280;min-height:20px;margin:10px 0}.reduced .enter,.reduced .leave{animation:none!important}.reduced .shine,.reduced .speed{display:none}@media(prefers-reduced-motion:reduce){.enter,.leave,.stamp.show{animation:none!important}.shine,.speed{display:none}}@media(max-width:600px){header{padding:18px}h1{font-size:19px}main{gap:28px}}
</style>
</head>
<body>
<header><h1>中央に「シュバッ」と入る、開始カットイン</h1><p>採用したグラデーションチケットのまま、登場を強く。着地後は水平、顔と「○人がトレーニング開始」を読める形です。<br>記録中は入力ドックより上の記録領域の中央へ。画面タップで閉じ、そのまま背景の操作も動きます。時計はドラッグでフォーム内にも置けます。左から登場して中央で止まり、右へ抜けます。</p>
<div class="controls"><button class="primary" id="play-all">Aを再生</button><button id="current">既存の位置・動きと比較</button><button id="home" aria-pressed="true">ホーム</button><button id="record" aria-pressed="false">記録中</button><label>人数<select id="count"><option>1</option><option>3</option><option selected>5</option><option>10</option><option>13</option></select></label><label>幅<select id="width"><option>320</option><option selected>390</option><option>430</option></select></label><label><input type="checkbox" id="hold">表示を固定</label><label><input type="checkbox" id="reduce">動きを減らす</label><button id="add">表示中に1人追加</button><button id="stamp">スタンプも受信</button></div></header>
<main>
<section class="example" data-style="a"><h2>採用A · 横から高速着地</h2><p>約0.24秒で中央へ。ごく小さい行き過ぎで勢いを出し、一筋の光で締める。</p><div class="phone"><iframe title="Aのアプリ画面"></iframe><div class="layer"><div class="position"><i class="speed"></i><div class="ticket a"><div class="content"></div><i class="shine"></i></div></div><div class="stamp"></div></div></div><button class="replay">Aを再生</button><div class="status"></div></section>


</main>
<script>
const examples=[...document.querySelectorAll('.example')];
const names=['高木透','柳町和音','森下快','佐藤蓮','三浦葵','田村湊','小林結衣','石井航','山本凛','松田悠','中村紬','斎藤陸','吉田晴'];
let screen='home',count=5,baseline=false,initialTimer=null;
const states=new Map(examples.map(el=>[el,{timer:null,exit:null,stampTimer:null,visible:false,deadline:0,draft:{},position:null}]));
function avatar(i){return `<span class="face" aria-label="${names[i%names.length]}"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" fill="${['#586572','#726657','#4d727b'][i%3]}"/><path d="M9 64c1-15 10-23 23-23s22 8 23 23" fill="#c3c9d0"/><circle cx="32" cy="25" r="13" fill="#f0d2b5"/><path d="M19 24c-3-13 9-19 18-14 8 0 12 9 8 17-4-7-10-9-18-8l-8 5Z" fill="#282d34"/></svg></span>`;}
function content(el){const ticket=el.querySelector('.ticket');ticket.classList.toggle('record',screen==='record');const size=screen==='record'?24:34;const row=el.querySelector('.faces')?.getBoundingClientRect(),clock=el.querySelector('.preview-watch')?.getBoundingClientRect();const blocked=row&&clock&&row.top<clock.bottom&&row.bottom>clock.top?88:0;const left=states.get(el).position?.side==='left';const width=el.querySelector('.phone').clientWidth-24-2-(screen==='record'?24:36)-blocked;let limit=Math.min(count,Math.floor((width+7)/(size+7)));while(limit>1&&limit*size+(limit-1)*7+(count>limit?35+String(count-limit).length*7:0)>width)limit--;el.querySelector('.content').innerHTML=`<div class="live">● LIVE</div>${count<3?`<div class="names">${names.slice(0,count).join('・')}</div>`:''}<strong class="title">${count}人がトレーニング開始</strong><div class="faces" style="padding-left:${blocked&&left?88:0}px;padding-right:${blocked&&!left?88:0}px">${Array.from({length:limit},(_,i)=>avatar(i)).join('')}${count>limit?`<span class="extra">+${count-limit}</span>`:''}</div>`;}
function place(el){const frame=el.querySelector('iframe'),doc=frame.contentDocument;const position=el.querySelector('.position');const dock=screen==='record'?doc?.querySelector('.recording-entry-dock'):null;const watch=el.querySelector('.preview-watch');const saved=states.get(el).position;if(watch){watch.style.top=Math.max(56,Math.min(el.querySelector('.phone').clientHeight-162,saved?saved.top:Math.min(438,dock?dock.getBoundingClientRect().top-94:438)))+'px';watch.style.left=saved?.side==='left'?'16px':'';watch.style.right=saved?.side==='left'?'':'16px';}if(baseline){position.style.top=(screen==='home'?232:156)+'px';position.style.transform='none';return;}position.style.transform='translateY(-50%)';if(screen==='home'){position.style.top='50%';return;}const top=dock?.getBoundingClientRect().top??550;position.style.top=Math.max(150,(48+top)/2)+'px';}
function dismiss(el){const state=states.get(el);if(!state.visible)return;clearTimeout(state.timer);state.visible=false;const ticket=el.querySelector('.ticket');ticket.classList.remove('enter');ticket.classList.add('leave');state.exit=setTimeout(()=>ticket.classList.remove('visible','leave'),200);el.querySelector('.status').textContent='閉じました。背景の操作はそのまま動きます。';}
function schedule(el){const state=states.get(el);clearTimeout(state.timer);if(document.querySelector('#hold').checked)return;state.timer=setTimeout(()=>dismiss(el),Math.max(0,state.deadline-Date.now()));}
function play(el){clearTimeout(initialTimer);el.querySelector('.ticket').classList.toggle('current',baseline);const state=states.get(el);clearTimeout(state.timer);clearTimeout(state.exit);content(el);place(el);content(el);const ticket=el.querySelector('.ticket'),layer=el.querySelector('.layer');ticket.classList.remove('enter','leave');layer.classList.remove('play');void ticket.offsetWidth;ticket.classList.add('visible','enter');layer.classList.add('play');state.visible=true;state.deadline=Date.now()+5000;schedule(el);el.querySelector('.status').textContent='5秒表示。画面をタップすると閉じます。';}
const watchCss=`.floating-training,.session-elapsed,.finish-training{display:none!important}.preview-watch{position:fixed;right:16px;top:438px;width:72px;height:80px;border:0;padding:0;background:transparent;color:white;font-family:inherit;font-weight:800;z-index:20;cursor:pointer;touch-action:none;user-select:none}.preview-watch:before{content:'';position:absolute;top:0;left:30px;width:12px;height:9px;border-radius:3px 3px 0 0;background:#b72028}.watch-dial{position:absolute;inset:8px 0 0;border-radius:50%;background:#d9292d;box-shadow:0 4px 7px #0002}.watch-dial:after{content:'';position:absolute;inset:5px;border:1px solid #ffffff60;border-radius:50%}.watch-time{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:19px;line-height:22px;letter-spacing:-.04em}.watch-label{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap}.watch-orbit{position:absolute;inset:3.5px;border-radius:50%;animation:orbit 60s linear infinite}.watch-orbit:before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);height:4px;width:4px;border-radius:50%;background:white}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.watch-orbit{animation:none}}`;
const outerWatchStyle=document.createElement('style');outerWatchStyle.textContent=watchCss+' .phone > .preview-watch{position:absolute;z-index:10}';document.head.appendChild(outerWatchStyle);
function load(el){const frame=el.querySelector('iframe');frame.src='notification-current-'+screen+'.html';}
for(const el of examples){try{const saved=JSON.parse(localStorage.getItem('gotore:center-preview-position:'+el.dataset.style)||'null');if((saved?.side==='left'||saved?.side==='right')&&Number.isFinite(saved.top))states.get(el).position=saved;}catch{}const frame=el.querySelector('iframe');frame.addEventListener('load',()=>{const doc=frame.contentDocument;if(!doc?.body)return;for(const label of ['重量','回数']){const input=doc.querySelector('input[aria-label="'+label+'"]');if(input){if(states.get(el).draft[label]!==undefined)input.value=states.get(el).draft[label];input.addEventListener('input',()=>states.get(el).draft[label]=input.value);}}const style=doc.createElement('style');style.textContent=watchCss;doc.head.appendChild(style);const watch=doc.createElement('button');watch.className='preview-watch';watch.type='button';watch.setAttribute('aria-label',screen==='home'?'記録画面へ戻る':'トレーニング終了');watch.innerHTML=`<span class="watch-dial"><span class="watch-time">0:12</span><span class="watch-orbit"></span><span class="watch-label">${screen==='home'?'記録へ':'■ 終了'}</span></span>`;const phone=el.querySelector('.phone');phone.querySelector('.preview-watch')?.remove();phone.appendChild(watch);doc.addEventListener('click',()=>dismiss(el),true);let dragging=null,suppressClick=false;watch.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0)return;const rect=watch.getBoundingClientRect(),bounds=phone.getBoundingClientRect();dragging={id:e.pointerId,x:e.clientX,y:e.clientY,left:rect.left-bounds.left-1,top:rect.top-bounds.top-1,moved:false};suppressClick=false;watch.setPointerCapture(e.pointerId);});watch.addEventListener('pointermove',e=>{if(!dragging||dragging.id!==e.pointerId)return;const dx=e.clientX-dragging.x,dy=e.clientY-dragging.y;if(!dragging.moved&&Math.hypot(dx,dy)<8)return;dragging.moved=true;watch.style.left=Math.max(16,Math.min(phone.clientWidth-88,dragging.left+dx))+'px';watch.style.right='auto';watch.style.top=Math.max(56,Math.min(phone.clientHeight-162,dragging.top+dy))+'px';});const release=e=>{if(!dragging||dragging.id!==e.pointerId)return;if(dragging.moved){const box=watch.getBoundingClientRect(),bounds=phone.getBoundingClientRect();states.get(el).position={side:box.left+36<bounds.left+bounds.width/2?'left':'right',top:box.top-bounds.top-1};suppressClick=true;try{localStorage.setItem('gotore:center-preview-position:'+el.dataset.style,JSON.stringify(states.get(el).position));}catch{}place(el);content(el);}if(watch.hasPointerCapture(e.pointerId))watch.releasePointerCapture(e.pointerId);dragging=null;};watch.addEventListener('pointerup',release);watch.addEventListener('pointercancel',release);watch.addEventListener('click',e=>{if(suppressClick&&e.detail!==0){suppressClick=false;e.stopPropagation();return;}dismiss(el);if(screen==='home')change('record');else el.querySelector('.status').textContent='時計のタップを受け取りました。本体では終了確認を開きます。';});doc.querySelectorAll('.bottom-nav button').forEach(button=>button.addEventListener('click',()=>{if(button.textContent.trim()==='ホーム')change('home');}));content(el);place(el);});el.querySelector('.replay').addEventListener('click',()=>{baseline=false;play(el);});el.querySelector('.phone').addEventListener('click',()=>dismiss(el));load(el);}
function change(next){screen=next;for(const id of ['home','record'])document.querySelector('#'+id).setAttribute('aria-pressed',String(screen===id));for(const el of examples){load(el);if(states.get(el).visible){content(el);place(el);}}}
document.querySelector('#play-all').onclick=()=>{baseline=false;examples.forEach(play);};document.querySelector('#current').onclick=()=>{baseline=true;examples.forEach(play);};
document.querySelector('#home').onclick=()=>change('home');document.querySelector('#record').onclick=()=>change('record');
document.querySelector('#count').onchange=event=>{count=Number(event.target.value);examples.forEach(play);};
document.querySelector('#width').onchange=event=>{document.documentElement.style.setProperty('--phone-width',event.target.value+'px');examples.forEach(el=>{content(el);place(el);});};
document.querySelector('#hold').onchange=()=>examples.forEach(el=>{if(states.get(el).visible)schedule(el);});
document.querySelector('#reduce').onchange=event=>{document.body.classList.toggle('reduced',event.target.checked);for(const el of examples){const dot=el.querySelector('iframe').contentDocument?.querySelector('.watch-orbit');if(dot)dot.style.animationPlayState=event.target.checked?'paused':'running';}};
document.querySelector('#add').onclick=()=>{count++;for(const el of examples){if(states.get(el).visible){content(el);place(el);el.querySelector('.status').textContent='人数を更新。再入場・表示時間の延長なし。';}else play(el);}};
document.querySelector('#stamp').onclick=()=>{for(const el of examples){const stamp=el.querySelector('.stamp');stamp.innerHTML='<div class="stamp-heading"><strong>12件のスタンプが届いた</strong><span class="senders">'+[0,1,2].map(avatar).join('')+'<small>+2</small></span></div><div class="kinds">'+['💪','🔥','👎','🤩','👏','👺'].map(emoji=>`<span class="kind"><b>${emoji}</b><small>×2</small></span>`).join('')+'</div>';stamp.classList.remove('show');void stamp.offsetWidth;stamp.classList.add('show');clearTimeout(states.get(el).stampTimer);states.get(el).stampTimer=setTimeout(()=>stamp.classList.remove('show'),2500);}};
initialTimer=setTimeout(()=>examples.forEach(play),900);
</script>
</body>
</html>
