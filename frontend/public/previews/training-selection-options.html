<!doctype html>
<html lang="ja">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GO TORE — 部位から選ぶ 3案</title>
  <style>
    :root{color-scheme:light;--bg:#f2f3f5;--panel:#fff;--ink:#20242b;--muted:#69717c;--line:#d8dce2;--red:#d32f2f;--soft:#fff0ef;--green:#247348} [data-theme=dark]{color-scheme:dark;--bg:#16181d;--panel:#20242b;--ink:#f1f3f6;--muted:#a9b0ba;--line:#3d424b;--soft:#3a2427;--green:#83d9a9} *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--red);outline-offset:3px}.intro{max-width:1120px;margin:auto;padding:34px 24px 15px}.eyebrow{color:var(--red);font-size:12px;font-weight:800;letter-spacing:.14em}h1{font-size:30px;letter-spacing:-.05em;margin:7px 0}.intro p{margin:0;color:var(--muted);max-width:720px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.controls button{min-height:40px;padding:6px 13px;border:1px solid var(--line);border-radius:99px;background:var(--panel)}.controls button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--panel)}.controls .theme{margin-left:auto}.grid{display:grid;grid-template-columns:repeat(3,minmax(270px,1fr));gap:22px;max-width:1120px;margin:auto;padding:8px 24px 36px}.option h2{font-size:17px;margin:8px 0 3px}.option>p{min-height:57px;color:var(--muted);font-size:13px;margin:0 0 12px}.recommended{font-size:11px;color:var(--red);font-weight:800}.phone{max-width:430px;margin:auto;border:1px solid #363c46;border-radius:25px;overflow:hidden;background:var(--panel);box-shadow:0 15px 30px #0001}.status{padding:11px 19px 3px;display:flex;justify-content:space-between;font-size:11px;font-weight:800}.screen{min-height:725px;padding:8px 16px 20px}.head{display:flex;align-items:center;justify-content:space-between;min-height:44px}.head h3{margin:0;font-size:20px;letter-spacing:-.04em}.finish{border:0;background:none;color:var(--red);font-size:11px;padding:9px 0}.week{margin:9px 0 17px;padding:10px 0;border-bottom:1px solid var(--line);display:flex;align-items:end;justify-content:space-between}.week small,.sub{color:var(--muted);font-size:11px}.week b{display:block;font-size:22px;letter-spacing:-.05em;line-height:1.1}.week strong{font-size:12px;color:var(--green)}.parts{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding:1px 0 8px}.parts button{flex:0 0 auto;min-height:37px;padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:0;font-size:12px;scroll-snap-align:start}.parts button[aria-pressed=true]{background:var(--soft);border-color:var(--red);color:var(--red);font-weight:800}.section{display:flex;align-items:baseline;justify-content:space-between;margin:15px 0 7px}.section h4{margin:0;font-size:13px}.section button{border:0;background:none;color:var(--muted);font-size:11px;padding:4px 0}.exercise{display:grid;grid-template-columns:1fr auto;width:100%;min-height:64px;padding:11px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}.exercise strong{font-size:15px}.exercise small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.exercise .last{text-align:right;align-self:center;white-space:nowrap;color:var(--muted);font-size:11px}.exercise .last b{display:block;color:var(--ink);font-size:12px}.arrow{color:var(--muted);padding-left:8px}.today{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}.today-row{display:flex;justify-content:space-between;align-items:center;min-height:36px}.today-row b{font-size:12px}.today-row span{font-size:11px;color:var(--muted)}.today-total{font-size:12px;color:var(--muted);padding-top:8px}.today-total b{font-size:17px;color:var(--ink);letter-spacing:-.04em}.part-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.part-card{min-height:73px;padding:10px;text-align:left;border:1px solid var(--line);background:var(--panel)}.part-card b{display:block;font-size:14px}.part-card small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.part-card[aria-pressed=true]{border-color:var(--red);background:var(--soft);color:var(--red)}.part-card[aria-pressed=true] small{color:var(--red)}.picked{margin:11px 0;padding:9px 10px;background:var(--soft);border-left:3px solid var(--red);font-size:12px}.picked b{font-size:14px}.compact{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;width:100%;min-height:48px;padding:7px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}.rank{width:21px;height:21px;border:1px solid var(--line);display:grid;place-items:center;font-size:10px;color:var(--muted)}.compact strong{font-size:14px}.compact small{display:block;color:var(--muted);font-size:10px}.quick{border:1px solid var(--red);background:var(--red);color:white;width:100%;min-height:47px;margin-top:15px;font-weight:750}.add{margin-top:10px;width:100%;min-height:40px;background:none;border:0;color:var(--muted);font-size:11px}.note{max-width:1120px;margin:-17px auto 32px;padding:0 24px;color:var(--muted);font-size:12px}@media(max-width:850px){.grid{grid-template-columns:1fr}.option>p{min-height:auto}}@media(max-width:600px){.intro{padding:22px 16px 12px}.intro h1{font-size:25px}.controls .theme{margin-left:0}.grid{padding:5px 0 30px}.option>h2,.option>p{margin-left:16px;margin-right:16px}.phone{max-width:none;border-left:0;border-right:0;border-radius:0}}
  </style>
  <header class="intro"><span class="eyebrow">GO TORE / 画面比較・試作 2</span><h1>部位を決めて、次の種目へ。</h1><p>今日鍛える部位を複数選び、その部位に紐づく種目を上から選ぶ案です。負荷は先週の同曜日までと比べます。</p><div class="controls"><button data-choice="all" aria-pressed="true">3案を比較</button><button data-choice="A" aria-pressed="false">A</button><button data-choice="B" aria-pressed="false">B</button><button data-choice="C" aria-pressed="false">C</button><button class="theme" data-theme>ダーク表示</button></div></header>
  <main class="grid" id="grid"></main><p class="note">どの案も、部位は複数選択できます。たとえば「胸・腕」なら、胸または腕に紐づく種目をまとめて表示します。並びは最近使った順を想定。総負荷は今日の開始時点から保存済みセットだけを足し、先週の同じ曜日までと比べます。</p>
  <script>
    const options={A:["上部フィルター","部位を横一列で固定。選んだ部位の種目を、前回の内容付きで即表示する。","tabs"],B:["部位を選ぶ","最初に大きめの部位カードを置く。今日のメニューを組む感覚が分かりやすい。","cards"],C:["最短リスト","部位を上で絞り、選ばれた部位の上位3種目だけを短く見せる。","short"]};
    const parts=["胸","背中","脚","肩","腕","腹筋","お尻","その他"], favs=[["ベンチプレス","胸・腕","前回 72.5kg × 8"],["トライセプスプレスダウン","腕","前回 25kg × 12"],["ダンベルフライ","胸","前回 14kg × 12"]];
    const tabs=()=>`<div class="parts">${parts.map((p,i)=>`<button data-part aria-pressed="${i===0||i===4}">${p}</button>`).join("")}</div>`;
    const row=([name,part,last])=>`<button class="exercise"><span><strong>${name}</strong><small>${part}　·　よく行う</small></span><span class="last">${last}<b>選ぶ <i class="arrow">›</i></b></span></button>`;
    const today=()=>`<section class="today"><div class="today-row"><span><b>ベンチプレス</b>　<span>3セット</span></span><span>72.5kg × 8</span></div><div class="today-row"><span><b>ラットプルダウン</b>　<span>2セット</span></span><span>55kg × 10</span></div><p class="today-total">今日の総負荷　<b>3,240kg</b></p></section>`;
    const headerContent=()=>`<header class="head"><h3>種目を選択</h3><button class="finish">今日のトレーニング終了</button></header><section class="week"><span><small>今日の総負荷</small><b>3,240kg</b></span><span><strong>先週より +420kg</strong><small>　先週 2,820kg</small></span></section>`;
    const shell=content=>`<div class="phone"><div class="status"><span>9:41</span><span>● ▰</span></div><div class="screen">${headerContent()}${content}</div></div>`;
    function build(kind){if(kind==="tabs")return shell(`${tabs()}<div class="section"><h4>胸・腕でよく行う種目</h4><button>種目を管理 ›</button></div>${favs.map(row).join("")}${today()}`);if(kind==="cards")return shell(`<div class="section"><h4>今日鍛える部位</h4><button>複数選べます</button></div><div class="part-cards">${parts.map((p,i)=>`<button class="part-card" data-card aria-pressed="${i===0||i===4}"><b>${p}</b><small>${i===0||i===4?"選択中":"よく行う 2種目"}</small></button>`).join("")}</div><div class="picked">選択中　<b>胸・腕</b></div>${favs.slice(0,2).map(row).join("")}${today()}`);return shell(`${tabs()}<div class="section"><h4>胸・腕でよく行う種目</h4><button>すべて ›</button></div>${favs.map(([n,p,last],i)=>`<button class="compact"><i class="rank">${i+1}</i><span><strong>${n}</strong><small>${p}　·　${last}</small></span><span>›</span></button>`).join("")}<button class="quick">ベンチプレスを選ぶ</button>${today()}`)}
    let choice="all";function render(){grid.innerHTML=Object.entries(options).filter(([key])=>choice==="all"||choice===key).map(([key,[title,copy,kind]])=>`<section class="option"><h2>${key} · ${title}${key==="A"?'<span class="recommended"> おすすめ</span>':""}</h2><p>${copy}</p>${build(kind)}</section>`).join("")}document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.choice){choice=b.dataset.choice;document.querySelectorAll("[data-choice]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));render()}if(b.dataset.theme!==undefined){const dark=document.documentElement.dataset.theme!=="dark";document.documentElement.dataset.theme=dark?"dark":"";b.textContent=dark?"ライト表示":"ダーク表示"}if(b.dataset.part||b.dataset.card){b.setAttribute("aria-pressed",String(b.getAttribute("aria-pressed")!=="true"))}});render();
  </script>
</html>
