<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-GOTORE グループ A・E 絞り込み案</title>
  <style>
    :root{--red:#d32f2f;--ink:#202127;--text:#202127;--muted:#6c6e74;--line:#dddfe3;--bg:#f4f4f5;--white:#fff;--track:#e9eaed}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:#e3e4e7;color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit}button:focus-visible{outline:3px solid #d32f2f44;outline-offset:2px}
    .controls{position:sticky;z-index:20;top:0;padding:10px 12px;background:#fffffff2;border-bottom:1px solid #d0d1d4;backdrop-filter:blur(12px)}.controls>div{max-width:900px;margin:auto}.title{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.title b{font-size:15px}.title span,.note{color:var(--muted);font-size:11px}.tabs{display:grid;gap:4px;margin-top:8px;padding:4px;border-radius:9px;background:var(--track)}.layout-tabs{grid-template-columns:1fr 1fr}.view-tabs{grid-template-columns:repeat(5,1fr)}.tabs button{min-height:38px;padding:3px 1px;border:0;border-radius:7px;background:transparent;font-weight:800;font-size:11px}.tabs button.on{background:#fff;box-shadow:0 1px 4px #0002}.note{min-height:31px;margin:7px 2px 0}
    .stage{display:flex;justify-content:center;padding:16px 0 40px}.phone{position:relative;width:min(100%,430px);min-height:844px;overflow:hidden;background:var(--bg);box-shadow:0 16px 42px #16181e2b}.header{height:48px;padding:0 16px;display:flex;align-items:center;background:var(--ink);color:#fff}.logo{font-size:22px;font-weight:900;letter-spacing:-.7px}.logo span{color:#ff625b}.screen{min-height:730px;padding:14px 16px 116px}h1,h2,h3,p{margin-top:0}h1{margin-bottom:8px;font-size:20px}h2{margin-bottom:7px;font-size:16px}.eyebrow{margin:0 0 2px;color:var(--muted);font-size:11px;font-weight:900;letter-spacing:.09em}.section{margin-top:16px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.section-head h1,.section-head h2{margin:0}.text-button{min-height:44px;padding:0 4px;border:0;background:transparent;font-weight:800}.muted{color:var(--muted)}.small{font-size:12px}
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);margin:8px -16px 0;border-block:1px solid var(--line);background:#ffffff80}.metric{padding:9px 3px;text-align:center}.metric+.metric{border-left:1px solid var(--line)}.metric b{display:block;font-size:16px;white-space:nowrap}.metric small{display:block;color:var(--muted);font-size:10px}.live{color:var(--red);font-weight:800}.dot{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--red);vertical-align:1px}
    .list{display:grid;gap:8px;margin-top:9px}.group-row{position:relative;display:grid;grid-template-columns:30px auto 1fr auto;align-items:center;gap:10px;width:100%;min-height:76px;padding:9px 10px 9px 4px;border:1px solid var(--line);border-radius:11px;background:#fff;box-shadow:0 2px 7px #2021270b;text-align:left}.avatars{display:flex;padding-left:5px}.avatar{display:grid;place-items:center;width:32px;height:32px;margin-left:-5px;border:2px solid #fff;border-radius:50%;background:#d9dde3;font-size:11px;font-weight:800}.avatar.hot{outline:2px solid var(--red);outline-offset:1px}.group-copy b,.group-copy small{display:block}.group-copy small{margin-top:3px;color:var(--muted)}.chev{color:#8b8d92;font-size:20px}.drag{display:grid;place-items:center;align-self:stretch;border-right:1px solid #ececef;color:#777980;font-size:22px;cursor:grab;touch-action:none}.drag:active{cursor:grabbing}.sort-tip{margin:8px 0 0;color:var(--muted);font-size:11px}
    .board{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.tile{position:relative;min-height:148px;padding:36px 13px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 3px 9px #20212710;text-align:left}.tile.dark{border-color:var(--ink);background:var(--ink);color:#fff}.tile h2{margin:5px 0 18px}.tile-handle{position:absolute;top:7px;left:9px;display:grid;place-items:center;width:34px;height:28px;border-radius:6px;background:#f0f0f2;color:#676970;font-size:20px;cursor:grab;touch-action:none}.tile.dark .tile-handle{background:#393a40;color:#d7d8db}.nums{display:flex;gap:10px;color:var(--muted);font-size:10px}.dark .nums{color:#c9cad0}.nums b{display:block;font-size:15px}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.primary,.secondary{min-height:48px;border-radius:8px;font-weight:850}.primary{border:1px solid var(--red);background:var(--red);color:#fff}.secondary{border:1px solid #b9bbc0;background:#fff}.wide{width:100%}.back{min-height:44px;margin:-7px 0 2px -8px;padding:0 8px;border:0;background:transparent;color:#55575c;font-weight:800}
    .invite-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:8px;background:var(--track)}.invite-tabs button{min-height:42px;border:0;border-radius:6px;background:transparent;font-size:11px;font-weight:800}.invite-tabs button.on{background:#fff;box-shadow:0 1px 4px #0002}.invite-card,.group-hero{margin-top:12px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 3px 10px #2021270d}.invite-card h2,.group-hero h1{margin:3px 0 4px}.group-hero.dark{border-color:var(--ink);background:var(--ink);color:#fff}.group-hero.dark .muted{color:#c8cad0}.hero-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;padding-top:11px;border-top:1px solid #dedfe2}.dark .hero-stats{border-color:#51535a}.hero-stats span{text-align:center;color:var(--muted);font-size:10px}.dark .hero-stats span{color:#c8cad0}.hero-stats b{display:block;color:inherit;font-size:16px}.share-hero{display:grid;place-items:center;min-height:150px;margin-top:12px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:center}.share-icon{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:#fbe8e8;color:var(--red);font-size:22px}.scenario{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:10px;width:100%;min-height:74px;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}.scenario-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;background:#fff;font-size:20px}.scenario b,.scenario small{display:block}.scenario small{color:var(--muted)}
    .ticket{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}.ticket-top{padding:14px 15px;background:var(--ink);color:#fff}.ticket-top h2{margin:2px 0}.ticket-body{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:14px;padding:15px}.qr{width:84px;height:84px;border:7px solid #fff;outline:1px solid var(--line);background:linear-gradient(90deg,#202127 25%,transparent 25% 50%,#202127 50% 75%,transparent 75%),linear-gradient(#202127 25%,transparent 25% 50%,#202127 50% 75%,transparent 75%);background-size:18px 18px}.code{font-size:13px;font-weight:900;letter-spacing:.1em}.fallback{margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}details summary{min-height:44px;display:flex;align-items:center;font-weight:800;cursor:pointer}details p{margin:0 0 10px}.landing{margin-top:15px;padding:15px;border:1px solid var(--line);border-radius:10px;background:#fff}.landing h2{margin:3px 0}.landing .avatars{margin:12px 0 7px}.join-code{width:100%;height:48px;padding:0 12px;border:1px solid #767676;border-radius:7px;background:#fff;font-size:16px;letter-spacing:.08em}
    .settings-row{display:flex;align-items:center;justify-content:space-between;min-height:58px;border-bottom:1px solid var(--line)}.member-row{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:9px;min-height:58px;border-bottom:1px solid var(--line)}.member-row .avatar{margin:0}.kick{min-height:40px;padding:0 8px;border:0;background:transparent;color:var(--red);font-weight:800}.danger{color:var(--red)}
    .segment{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:8px;background:var(--track)}.segment button{min-height:40px;border:0;border-radius:6px;background:transparent;font-weight:800;color:var(--muted)}.segment .on{background:#fff;color:var(--text);box-shadow:0 1px 4px #0002}.record{padding:13px 0;border-bottom:1px solid var(--line)}.record-head{display:flex;justify-content:space-between;gap:8px}.record p{margin:4px 0;color:var(--muted);font-size:12px}.exercise{display:flex;justify-content:space-between;padding:4px 0;font-size:12px}
    .start{position:absolute;z-index:8;right:16px;bottom:80px;width:112px;height:52px;border:0;border-radius:9px;background:var(--red);color:#fff;font-weight:900;box-shadow:0 7px 18px #55191947}.bottom{position:absolute;right:0;bottom:0;left:0;display:grid;grid-template-columns:repeat(4,1fr);height:66px;border-top:1px solid var(--line);background:#fffffff8}.bottom button{position:relative;border:0;background:transparent;color:#73757a;font-size:12px}.bottom .on{color:var(--red);font-weight:800}.bottom .on::before{content:"";position:absolute;top:0;right:18px;left:18px;height:2px;background:var(--red)}
    @media(max-width:520px){.title span{display:none}.stage{padding:0}.phone{min-height:calc(100vh - 174px);box-shadow:none}.screen{min-height:calc(100vh - 222px)}}
  </style>
</head>
<body>
  <aside class="controls"><div><div class="title"><b>A・E 絞り込み案</b><span>常時並べ替え＋リンク・QR招待</span></div><div class="tabs layout-tabs" id="layoutTabs"></div><div class="tabs view-tabs" id="viewTabs"></div><p class="note" id="note"></p></div></aside>
  <div class="stage"><main class="phone" id="phone"></main></div>
  <script>
    let layout="A",view="home",role="owner",order=["friends","university","morning"],showQr=false,joinStage="entry";
    const layoutLabels={A:"A　カードリスト",E:"E　2列ボード"};
    const viewLabels={home:"一覧",detail:"詳細",invite:"招待",join:"参加",settings:"設定"};
    const groups={friends:{name:"いつものトレ仲間",people:"5人",sets:"18",volume:"14,280",live:true,dark:true},university:{name:"大学トレ部",people:"3人",sets:"14",volume:"11,160",live:false},morning:{name:"朝トレ部",people:"2人",sets:"9",volume:"7,200",live:true,short:true}};
    const people=(short=false)=>`<span class="avatars"><span class="avatar hot">高</span><span class="avatar">佐</span>${short?"":"<span class=\"avatar\">森</span>"}</span>`;
    const metrics=()=>`<div class="metrics"><div class="metric"><small class="live"><i class="dot"></i>LIVE</small><b>2人</b></div><div class="metric"><small>グループ</small><b>3</b></div><div class="metric"><small>セット</small><b>41</b></div><div class="metric"><small>総負荷</small><b>32,640<small>kg</small></b></div></div>`;
    const row=(id,g)=>`<div class="group-row" role="button" tabindex="0" data-group="${id}"><span class="drag" role="button" tabindex="0" aria-label="${g.name}を並べ替え">⠿</span>${people(g.short)}<span class="group-copy"><b>${g.name}${g.live?' <span class="live"><i class="dot"></i>1人</span>':''}</b><small>${g.people}　${g.sets}セット　${g.volume}kg</small></span><span class="chev">›</span></div>`;
    const tile=(id,g)=>`<div class="tile ${g.dark?'dark':''}" role="button" tabindex="0" data-group="${id}"><span class="tile-handle" role="button" tabindex="0" aria-label="${g.name}を並べ替え">⠿</span><span class="${g.live?'live':'muted'} small">${g.live?'<i class="dot"></i>LIVE 1人':'3人が活動'}</span><h2>${g.name.replace('トレ','<br>トレ')}　›</h2><span class="nums"><span><b>${g.sets}</b>セット</span><span><b>${g.volume}</b>kg</span></span></div>`;
    const groupHero=()=>`<div class="group-hero ${layout==='E'?'dark':''}"><div class="hero-head"><div><span class="${layout==='E'?'live':'muted'} small">${layout==='E'?'<i class="dot"></i>LIVE 1人':'GROUP'}</span><h1>いつものトレ仲間</h1><span class="muted small">${layout==='E'?'5人が今日活動':'今日のグループ状況'}</span></div>${people()}</div><div class="hero-stats"><span><b>5人</b>活動</span><span><b>18</b>セット</span><span><b>14,280</b>kg</span></div></div>`;
    function home(){const list=layout==="A"?`<div class="list">${order.map(id=>row(id,groups[id])).join('')}</div>`:`<div class="board">${order.map(id=>tile(id,groups[id])).join('')}<button class="tile"><b style="font-size:26px">＋</b><br>グループを作成</button></div>`;return `<p class="eyebrow">GROUPS</p><div class="section-head"><h1>グループ</h1><span class="muted small">3件</span></div>${metrics()}<section class="section"><div class="section-head"><h2>所属グループ</h2><span class="muted small">⠿ そのまま移動</span></div>${list}<p class="sort-tip">カード左上のハンドルを動かすと、ホームの切替順も変わります。</p></section><div class="actions"><button class="primary">グループを作成</button><button class="secondary" data-view="join">グループに参加</button></div>`}
    function detail(){return `<button class="back" data-view="home">‹ グループ一覧</button>${groupHero()}<div class="actions"><button class="secondary" data-view="invite">メンバーを招待</button><button class="secondary" data-view="settings">グループ設定</button></div><section class="section"><div class="segment"><button>カレンダー</button><button class="on">最新記録</button><button>グラフ</button></div><article class="record"><div class="record-head"><b>高橋</b><span class="muted small">今日 10:42</span></div><p>3種目　9セット　5,460kg</p><div class="exercise"><b>ベンチプレス</b><span>75kg × 8回</span></div><div class="exercise"><span>スクワット</span><span>100kg × 5回</span></div></article><article class="record"><div class="record-head"><b>佐藤</b><span class="muted small">昨日 19:08</span></div><p>2種目　7セット　3,820kg</p><div class="exercise"><b>デッドリフト</b><span>120kg × 5回</span></div></article></section>`}
    function inviteView(){return `<button class="back" data-view="detail">‹ いつものトレ仲間</button><p class="eyebrow">INVITE</p><h1>メンバーを招待</h1><p class="muted small">このグループのメンバーなら誰でも招待できます。</p>${groupHero()}<div class="actions"><button class="primary">リンクを共有</button><button class="secondary" id="toggleQr">${showQr?'QRコードを閉じる':'QRコードを表示'}</button></div>${showQr?`<div class="share-hero"><div><div class="qr" style="margin:auto"></div><p class="muted small" style="margin:10px 0 0">相手のカメラで読み取ってもらいます</p></div></div>`:''}`}
    function joinView(){if(joinStage==='confirm')return `<button class="back" id="joinBack">‹ 戻る</button><p class="eyebrow">GROUP INVITE</p><h1>グループへの招待</h1><p class="muted small">招待リンクまたはQRコードから開きました。</p>${groupHero()}<button class="primary wide section">このグループに参加</button><button class="text-button wide">参加しない</button>`;return `<button class="back" data-view="home">‹ グループ一覧</button><p class="eyebrow">JOIN</p><h1>グループに参加</h1><p class="muted">招待リンクを受け取った場合は、そのリンクを開くだけで参加確認へ進みます。</p><button class="primary wide section">QRコードを読み取る</button><button class="text-button wide section" id="previewJoin">招待を開いた画面を確認</button>`}
    function settings(){const owner=role==='owner';return `<button class="back" data-view="detail">‹ いつものトレ仲間</button><p class="eyebrow">GROUP SETTINGS</p><h1>グループ設定</h1><div class="invite-tabs"><button data-role="owner" class="${owner?'on':''}">オーナー表示</button><button data-role="member" class="${!owner?'on':''}">メンバー表示</button><span></span></div><section class="section"><div class="settings-row"><span>グループ名</span><b>${owner?'いつものトレ仲間　›':'いつものトレ仲間'}</b></div><button class="scenario" data-view="invite"><span class="scenario-icon">↗</span><span><b>メンバーを招待</b><small>リンク・QR</small></span><span class="chev">›</span></button></section>${owner?`<section class="section"><div class="section-head"><h2>メンバー</h2><span class="muted small">8人</span></div><div class="member-row"><span class="avatar">佐</span><span><b>佐藤</b><br><small class="muted">メンバー</small></span><button class="kick">外す</button></div><div class="member-row"><span class="avatar">森</span><span><b>森</b><br><small class="muted">メンバー</small></span><button class="kick">外す</button></div></section><section class="section"><div class="settings-row danger"><span>グループを削除</span><span>›</span></div></section>`:`<section class="section"><p class="muted small">メンバーの削除とグループ名の変更はオーナーだけが行えます。</p><div class="settings-row danger"><span>グループから抜ける</span><span>›</span></div></section>`}`}
    function shell(body){return `<header class="header"><div class="logo">E-GO<span>TORE</span></div></header><section class="screen">${body}</section><button class="start">START</button><nav class="bottom"><button>ホーム</button><button class="on">グループ</button><button>履歴</button><button>設定</button></nav>`}
    function render(){document.querySelector('#layoutTabs').innerHTML=Object.entries(layoutLabels).map(([key,label])=>`<button data-layout="${key}" class="${layout===key?'on':''}">${label}</button>`).join('');document.querySelector('#viewTabs').innerHTML=Object.entries(viewLabels).map(([key,label])=>`<button data-view="${key}" class="${view===key?'on':''}">${label}</button>`).join('');const notes={home:'カードらしさと常時操作できるハンドルで、並べ替え可能だと伝えます。',detail:'一覧のカードをそのまま広げた見た目で、詳細との連続性を保ちます。',invite:'招待する側は「リンク共有」「QR表示」の2操作だけです。',join:'一覧からの参加と、招待を開いた後の確認を分離しています。',settings:'オーナーと一般メンバーで操作範囲を切り替えられます。'};document.querySelector('#note').textContent=notes[view];const screens={home,detail,invite:inviteView,join:joinView,settings};document.querySelector('#phone').innerHTML=shell(screens[view]());bind()}
    function moveGroup(id,delta){const from=order.indexOf(id),to=Math.max(0,Math.min(order.length-1,from+delta));if(from===to)return;order.splice(to,0,order.splice(from,1)[0]);render()}
    function bindReorder(){document.querySelectorAll('.drag,.tile-handle').forEach(handle=>{let x=0,y=0;handle.onpointerdown=e=>{e.stopPropagation();x=e.clientX;y=e.clientY;handle.setPointerCapture(e.pointerId)};handle.onpointerup=e=>{e.stopPropagation();const dx=e.clientX-x,dy=e.clientY-y,motion=layout==='A'?dy:(Math.abs(dx)>Math.abs(dy)?dx:dy);if(Math.abs(motion)>18)moveGroup(handle.closest('[data-group]').dataset.group,motion>0?1:-1)};handle.onkeydown=e=>{if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();e.stopPropagation();moveGroup(handle.closest('[data-group]').dataset.group,-1)}if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();e.stopPropagation();moveGroup(handle.closest('[data-group]').dataset.group,1)}}})}
    function bind(){document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{layout=b.dataset.layout;render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;showQr=false;if(view==='join')joinStage='entry';render()});document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;render()});document.querySelectorAll('[data-group]').forEach(card=>{card.onclick=e=>{if(e.target.closest('.drag,.tile-handle'))return;view='detail';render()};card.onkeydown=e=>{if(e.key==='Enter'&&!e.target.closest('.drag,.tile-handle')){view='detail';render()}}});const qr=document.querySelector('#toggleQr');if(qr)qr.onclick=()=>{showQr=!showQr;render()};const preview=document.querySelector('#previewJoin');if(preview)preview.onclick=()=>{joinStage='confirm';render()};const joinBack=document.querySelector('#joinBack');if(joinBack)joinBack.onclick=()=>{joinStage='entry';render()};bindReorder()}
    render();
  </script>
</body>
</html>
