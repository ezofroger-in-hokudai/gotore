  <body>
    <aside class="controls" aria-label="比較する案"><div class="controls-inner"><div class="controls-title"><strong>履歴・B案のスワイプ操作</strong><small>架空データの操作可能なプレビュー</small></div><p class="option-note">B案をベースに、過去へ送れるグラフと既存に近い部位選択を試せます。</p></div></aside>
    <main class="stage"><div class="phone" id="phone"></div></main>
    <script>

      const parts=["胸","背中","脚","腕","肩","腹筋","お尻","その他"];
      const catalog=[
        ["ベンチプレス","胸"],["ダンベルフライ","胸"],["インクラインベンチプレス","胸"],["チェストプレス","胸"],["腕立て伏せ","胸"],["ケーブルクロスオーバー","胸"],
        ["スクワット","脚"],["レッグプレス","脚"],["ランジ","脚"],["レッグカール","脚"],["レッグエクステンション","脚"],
        ["ラットプルダウン","背中"],["懸垂","背中"],["シーテッドロー","背中"],["ベントオーバーロー","背中"],["ワンハンドロー","背中"],
        ["ショルダープレス","肩"],["サイドレイズ","肩"],["リアレイズ","肩"],["アップライトロー","肩"],
        ["アームカール","腕"],["ハンマーカール","腕"],["トライセプスプレスダウン","腕"],["ディップス","腕"],
        ["クランチ","腹筋"],["レッグレイズ","腹筋"],["プランク","腹筋"],["ヒップスラスト","お尻"],["グルートブリッジ","お尻"],["デッドリフト","その他"]
      ];
      const itemPart=new Map(catalog);
      const special={
        "2026-09-27":[{time:"07:35",items:[{name:"ベンチプレス",sets:[[70,5],[65,8],[60,10]]},{name:"ダンベルフライ",sets:[[16,10],[16,10],[14,12]]},{name:"ショルダープレス",sets:[[24,8],[22,10],[20,12]]}]},{time:"19:10",items:[{name:"スクワット",sets:[[80,8],[80,8],[75,10],[70,12]]},{name:"ラットプルダウン",sets:[[50,10],[50,10],[45,12]]},{name:"アームカール",sets:[[14,10],[14,10]]}]}],
        "2026-09-24":[{time:"18:20",items:[{name:"スクワット",sets:[[90,5],[85,8],[80,10]]},{name:"レッグプレス",sets:[[120,10],[120,10],[110,12]]}]}],
        "2026-09-21":[{time:"09:15",items:[{name:"懸垂",sets:[[0,8],[0,7],[0,6]]},{name:"ラットプルダウン",sets:[[50,10],[45,12],[45,12]]}]}]
      };
      const first=new Date(Date.UTC(2026,5,29));
      const days=Array.from({length:91},(_,index)=>new Date(first.getTime()+index*86400000).toISOString().slice(0,10));
      const format=(value)=>Number(value).toLocaleString("ja-JP",{maximumFractionDigits:1});
      const dayLabel=(day)=>`${Number(day.slice(5,7))}月${Number(day.slice(8,10))}日`;
      let variant=1,scope={kind:"all",value:"",label:"全種目"},grain="month",metric="volume",point=2,page=0,selectedDay="2026-09-27",overlay="",search="",partFilter="すべて";
      function workoutsFor(day,index){if(special[day])return special[day];if((index*11+Math.floor(index/7)*5)%17<8)return[];const base=["ベンチプレス","スクワット","ラットプルダウン"][index%3],second=catalog[(index*7)%catalog.length][0],names=[...new Set([base,second])];return[{time:"18:00",items:names.map((name,j)=>{const weight=base===name?45+index%8*3:18+index%5*4;return{name,sets:[[weight,8],[weight,8],[weight-5,10]]}})}]}
      const records=days.map((day,index)=>({day,workouts:workoutsFor(day,index)}));
      const archiveFirst=new Date(Date.UTC(2025,10,3)),archiveCount=Math.round((first.getTime()-archiveFirst.getTime())/86400000);
      const archiveRecords=Array.from({length:archiveCount},(_,index)=>{const day=new Date(archiveFirst.getTime()+index*86400000).toISOString().slice(0,10);return{day,workouts:workoutsFor(day,index)}}),allRecords=[...archiveRecords,...records];
      function inScope(name){return scope.kind==="all"||scope.kind==="part"&&itemPart.get(name)===scope.value||scope.kind==="exercise"&&name===scope.value}
      function setsFor(record){return record.workouts.flatMap(workout=>workout.items.filter(item=>inScope(item.name)).flatMap(item=>item.sets.map(([weight,reps])=>({name:item.name,weight,reps}))))}
      function stats(items){return{sets:items.length,volume:items.reduce((sum,item)=>sum+item.weight*item.reps,0),weight:items.length?Math.max(...items.map(item=>item.weight)):null,rm:items.reduce((best,item)=>item.weight>0&&item.reps<=10?Math.max(best,item.weight*(1+item.reps/30)):best,0)||null}}
      const daily=()=>records.map(record=>({day:record.day,all:record.workouts,items:setsFor(record)}));
      function heatmap(){const data=daily(),monthMax=new Map();for(const day of data){const key=day.day.slice(0,7);monthMax.set(key,Math.max(monthMax.get(key)??0,stats(day.items).volume))}const cells=data.map(day=>{const volume=stats(day.items).volume,max=Math.max(1,monthMax.get(day.day.slice(0,7))??0),level=day.items.length?Math.max(1,Math.min(4,Math.ceil(volume/max*4))):0;return `<button type="button" data-day="${day.day}" data-level="${level}" aria-label="${dayLabel(day.day)} ${day.items.length?`${day.items.length}セット`:"対象の記録なし"}" aria-pressed="${day.day===selectedDay}"></button>`}).join("");const selected=data.find(day=>day.day===selectedDay),selectedStats=stats(selected.items),allSets=selected.all.flatMap(workout=>workout.items.flatMap(item=>item.sets));return `<div class="heatmap-card"><div class="month-labels"><span>7月</span><span>8月</span><span>9月</span></div><div class="heatmap-wrap"><div class="weekdays"><span>月</span><span></span><span>水</span><span></span><span>金</span><span></span><span>日</span></div><div class="heatmap">${cells}</div></div><div class="heatmap-foot"><span>6/29–9/27 · ${scope.label}の総負荷</span><span class="heatmap-key">少 <i></i><i></i><i></i><i></i><i></i> 多</span></div><div class="day-head"><b>${dayLabel(selectedDay)}</b><small>${selected.items.length?`${selectedStats.sets}セット · ${format(selectedStats.volume)}kg`:"対象の記録なし"}</small></div>${allSets.length?`<button type="button" class="day-open" data-open-day>この日の全メニューを見る　›</button>`:""}</div>`}
      function series(){
        const source=grain==="month"
          ?Array.from({length:3},(_,index)=>{const date=new Date(Date.UTC(2026,6-page*3+index,1)),year=date.getUTCFullYear(),month=date.getUTCMonth()+1,start=`${year}-${String(month).padStart(2,"0")}-01`,last=new Date(Date.UTC(year,month,0)).getUTCDate(),end=`${year}-${String(month).padStart(2,"0")}-${String(last).padStart(2,"0")}`;return{label:`${month}月`,start,end}})
          :Array.from({length:6},(_,index)=>{const date=new Date(Date.UTC(2026,8,21)+((index-5)-page*6)*7*86400000),start=date.toISOString().slice(0,10),end=new Date(date.getTime()+6*86400000).toISOString().slice(0,10);return{label:`${Number(start.slice(5,7))}/${Number(start.slice(8,10))}`,start,end}});
        return source.filter(period=>period.end>="2025-11-03").map(period=>{const items=allRecords.filter(record=>record.day>=period.start&&record.day<=period.end).flatMap(setsFor),numbers=stats(items),candidates=items.filter(item=>metric==="weight"?item.weight===numbers.weight:item.weight>0&&item.reps<=10&&Math.abs(item.weight*(1+item.reps/30)-(numbers.rm??0))<.001);return{...period,value:numbers[metric],source:candidates[0]?.name??""}});
      }
      function graph(){
        const values=series(),selected=values[point]??values.at(-1),numbers=values.map(item=>item.value).filter(value=>value!==null),min=metric==="volume"?0:Math.min(...numbers,0)-10,max=Math.max(...numbers,1)*1.12,y=value=>111-((value-min)/(max-min))*88,step=values.length>1?275/(values.length-1):0;
        const marks=values.map((item,index)=>{if(item.value===null)return"";const x=24+index*step;return metric==="volume"?`<rect data-point="${index}" x="${x-12}" y="${y(item.value)}" width="24" height="${111-y(item.value)}" rx="3" fill="${index===point?'#d32f2f':'#eaa19d'}"/>`:`<circle cx="${x}" cy="${y(item.value)}" r="${index===point?5:3.5}" fill="${index===point?'#d32f2f':'#fff'}" stroke="#d32f2f" stroke-width="2"/><circle data-point="${index}" cx="${x}" cy="${y(item.value)}" r="18" fill="transparent"/>`}).join("");
        const polyline=values.filter(item=>item.value!==null).map(item=>`${24+values.indexOf(item)*step},${y(item.value)}`).join(" "),metricNames={volume:"総負荷",weight:"最大重量",rm:"最大推定1RM"};
        const periodTabs=`<div class="period-tabs" aria-label="グラフの集計期間">${[["week","週"],["month","月"]].map(([key,label])=>`<button type="button" data-grain="${key}" aria-pressed="${grain===key}">${label}</button>`).join("")}</div>`;
        const metricTabs=`<div class="metric-tabs" aria-label="グラフの指標">${Object.entries(metricNames).map(([key,name])=>`<button type="button" data-metric="${key}" aria-pressed="${metric===key}">${name}</button>`).join("")}</div>`;
        const label=grain==="month"?`${values[0].label}–${values.at(-1).label}`:`${Number(values[0].start.slice(5,7))}/${Number(values[0].start.slice(8,10))}–${Number(values.at(-1).end.slice(5,7))}/${Number(values.at(-1).end.slice(8,10))}`;
        return `<div class="graph-card graph-variant-1"><div class="graph-head"><h2>記録の推移</h2></div>${metricTabs}<p class="graph-period">${label} · ${metric==="volume"?"期間の合計":"期間の最高値"}</p><div class="graph-value"><strong>${selected.value===null?"—":format(selected.value)}<small>${selected.value===null?"":"kg"}</small></strong><span>${selected.label}${metric!=="volume"&&scope.kind!=="exercise"&&selected.source?` · ${selected.source}`:""}</span></div><div class="period-row"><span>表示単位</span>${periodTabs}</div><div class="graph-swipe-shell" aria-label="左右にスワイプして表示期間を移動">${page<(grain==="month"?3:7)?'<span class="graph-peek graph-peek-left" aria-hidden="true"></span>':""}<svg class="graph-svg" viewBox="0 0 320 132" role="img" aria-label="${scope.label}の${metricNames[metric]}を${grain==="week"?"週別":"月別"}で表示"><path d="M18 111H308M18 67H308M18 22H308" fill="none" stroke="#e9eaec" stroke-width="1"/>${metric!=="volume"&&polyline?`<polyline points="${polyline}" fill="none" stroke="#d32f2f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`:""}${marks}</svg>${page>0?'<span class="graph-peek graph-peek-right" aria-hidden="true"></span>':""}</div><div class="graph-labels" style="grid-template-columns:repeat(${values.length},1fr)">${values.map(item=>`<span>${item.label}</span>`).join("")}</div><div class="graph-pagination"><button type="button" data-page="older" ${page>=(grain==="month"?3:7)?"disabled":""}>‹ 過去へ</button><span>グラフを横にスワイプ</span><button type="button" data-page="newer" ${page===0?"disabled":""}>新しく ›</button></div><p class="graph-help">${metric==="volume"?"重量 × 回数の合計。":"最高値は足し合わせず、実際の1セットから選ぶ。"}ヒートマップと同じ表示範囲です。</p></div>`;
      }
      function shiftPage(direction){page=Math.max(0,Math.min(grain==="month"?3:7,page+direction));point=grain==="month"?2:5;render()}
      function dayDetails(){const selected=records.find(record=>record.day===selectedDay),allItems=selected.workouts.flatMap(workout=>workout.items.flatMap(item=>item.sets.map(([weight,reps])=>({weight,reps})))),total=stats(allItems);return `<div class="sheet-head"><h2>${dayLabel(selectedDay)}の全メニュー</h2><button type="button" class="close" data-close aria-label="閉じる">×</button></div><p class="muted" style="font-size:12px">${selected.workouts.length}回 · ${total.sets}セット · ${format(total.volume)}kg</p><p class="muted" style="margin-top:3px;font-size:10px">表示範囲に関係なく、その日の全記録</p>${selected.workouts.map(workout=>{const items=workout.items.flatMap(item=>item.sets.map(([weight,reps])=>({weight,reps}))),sum=stats(items);return `<article class="workout"><div class="workout-title"><b>${workout.time}</b><small>${workout.items.length}種目 · ${sum.sets}セット · ${format(sum.volume)}kg</small></div>${workout.items.map(item=>`<div class="exercise-row"><h3>${item.name}<small>${item.sets.length}セット</small></h3>${item.sets.map(([weight,reps],index)=>`<div class="set-row"><span>${index+1}セット</span><b>${weight?`${weight}kg`:"自重"} × ${reps}回</b></div>`).join("")}</div>`).join("")}</article>`}).join("")}`}
      function pickerRows(){
        const query=search.trim().toLocaleLowerCase("ja-JP"),matches=catalog.filter(([name,part])=>name.toLocaleLowerCase("ja-JP").includes(query)&&(partFilter==="すべて"||partFilter===part));
        return `<button type="button" class="all-row" data-choose-all><b>全種目</b><small>すべての記録</small></button><p class="picker-caption">部位から探す</p><div class="part-chips" role="group" aria-label="部位で絞り込み">${parts.map(part=>`<button type="button" data-filter-part="${part}" aria-pressed="${partFilter===part}">${part}</button>`).join("")}</div>${partFilter!=="すべて"?`<button type="button" class="part-row" data-choose-part="${partFilter}"><b>${partFilter}全体を見る</b><small>部位の合計</small></button>`:""}<p class="picker-caption">種目を選ぶ · ${matches.length}件</p>${matches.map(([name,part])=>`<button type="button" class="picker-row" data-choose-exercise="${name}"><b>${name}</b><small>${part}</small></button>`).join("")}${matches.length?"":"<p class=\"muted\">該当する種目はありません</p>"}`;
      }
      function overlayContent(){if(!overlay)return"";const content=overlay==="day"?dayDetails():`<div class="sheet-head"><h2>表示する記録</h2><button type="button" class="close" data-close aria-label="閉じる">×</button></div><input class="search" id="scopeSearch" type="search" placeholder="種目名で検索" value="${search.replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;")}" aria-label="種目名で検索"/><div id="pickerRows">${pickerRows()}</div>`;return `<div class="overlay" data-backdrop><div class="sheet" role="dialog" aria-label="${overlay==="day"?"その日の全メニュー":"表示する記録"}"><div class="sheet-body">${content}</div></div></div>`}
      function render(reset=false){const phone=document.getElementById("phone"),scroll=phone.querySelector(".screen")?.scrollTop??0;phone.innerHTML=`<header class="app-header"><div class="logo">E-GO<span>TORE</span></div></header><div class="screen"><p class="eyebrow">MY HISTORY</p><h1>自分の積み重ね</h1><p class="intro">2025年11月から</p><div class="lifetime"><p class="lifetime-label">全種目・これまでの総負荷</p><div class="lifetime-number">246,380<small>kg</small></div><div class="lifetime-row"><div><strong>84回</strong><small>トレーニング</small></div><div><strong>1,026</strong><small>セット</small></div></div></div><button type="button" class="scope-button" data-open-scope><span><small>表示する記録 · ヒートマップとグラフ共通</small><b>${scope.label}</b></span><span class="arrow">⌄</span></button><section class="section"><div class="section-head"><h2>トレーニングの足あと</h2><small>直近13週間</small></div>${heatmap()}</section><section class="section">${graph()}</section></div><button type="button" class="start" aria-label="記録を開始する見本">START</button><nav class="bottom-nav" aria-label="メインナビゲーション"><button type="button">ホーム</button><button type="button">グループ</button><button type="button" class="on" aria-current="page">履歴</button><button type="button">設定</button></nav>${overlayContent()}`;phone.querySelector(".screen").scrollTop=reset?0:scroll}
      function setScope(kind,value,label){scope={kind,value,label};overlay="";point=grain==="month"?2:5;render()}
      document.addEventListener("click",event=>{const day=event.target.closest("[data-day]");if(day){selectedDay=day.dataset.day;render();return}if(event.target.closest("[data-open-day]")){overlay="day";render();return}if(event.target.closest("[data-open-scope]")){overlay="scope";search="";partFilter="すべて";render();return}if(event.target.closest("[data-close]")||event.target.hasAttribute("data-backdrop")){overlay="";render();return}if(event.target.closest("[data-choose-all]")){setScope("all","","全種目");return}const part=event.target.closest("[data-choose-part]");if(part){setScope("part",part.dataset.choosePart,`${part.dataset.choosePart}全体`);return}const exercise=event.target.closest("[data-choose-exercise]");if(exercise){setScope("exercise",exercise.dataset.chooseExercise,exercise.dataset.chooseExercise);return}const filter=event.target.closest("[data-filter-part]");if(filter){partFilter=partFilter===filter.dataset.filterPart?"すべて":filter.dataset.filterPart;document.getElementById("pickerRows").innerHTML=pickerRows();return}const g=event.target.closest("[data-grain]");if(g){grain=g.dataset.grain;page=0;point=grain==="month"?2:5;render();return}const pager=event.target.closest("[data-page]");if(pager){shiftPage(pager.dataset.page==="older"?1:-1);return}const m=event.target.closest("[data-metric]");if(m){metric=m.dataset.metric;render();return}const selected=event.target.closest("[data-point]");if(selected){point=Number(selected.dataset.point);render()}});
      document.addEventListener("input",event=>{if(event.target.id==="scopeSearch"){search=event.target.value;document.getElementById("pickerRows").innerHTML=pickerRows()}});
      document.addEventListener("keydown",event=>{if(event.key==="Escape"&&overlay){overlay="";render()}});
      let swipeStartX=null;
      document.addEventListener("pointerdown",event=>{if(event.target.closest(".graph-swipe-shell"))swipeStartX=event.clientX});
      document.addEventListener("pointerup",event=>{if(swipeStartX===null)return;const delta=event.clientX-swipeStartX;swipeStartX=null;if(Math.abs(delta)>40)shiftPage(delta>0?1:-1)});
      render();
    </script>
  </body>
</html>
