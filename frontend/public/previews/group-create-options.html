<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>E-GOTORE グループ作成3案</title>
  <style>
    :root{--red:#d32f2f;--ink:#202127;--muted:#6b6d73;--line:#dddfe3;--bg:#f4f4f5;--track:#e9eaed}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:#e4e5e8;color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}button,input{font:inherit;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid #d32f2f44;outline-offset:2px}.controls{position:sticky;z-index:20;top:0;padding:10px 12px;background:#fffffff2;border-bottom:1px solid #d0d1d4;backdrop-filter:blur(12px)}.controls>div{max-width:900px;margin:auto}.preview-title{display:flex;justify-content:space-between;align-items:baseline}.preview-title b{font-size:15px}.preview-title span,.note{color:var(--muted);font-size:11px}.tabs{display:grid;gap:4px;margin-top:8px;padding:4px;border-radius:9px;background:var(--track)}.option-tabs{grid-template-columns:repeat(3,1fr)}.state-tabs{grid-template-columns:repeat(2,1fr)}.tabs button{min-height:38px;border:0;border-radius:7px;background:transparent;font-weight:800;font-size:11px}.tabs .on{background:#fff;box-shadow:0 1px 4px #0002}.note{min-height:32px;margin:7px 2px 0}.stage{display:flex;justify-content:center;padding:16px 0 40px}.phone{position:relative;width:min(100%,430px);min-height:844px;overflow:hidden;background:var(--bg);box-shadow:0 16px 42px #16181e2b}.header{height:48px;padding:0 16px;display:flex;align-items:center;background:var(--ink);color:#fff}.logo{font-size:22px;font-weight:900;letter-spacing:-.7px}.logo span{color:#ff625b}.screen{min-height:730px;padding:14px 16px 116px}h1,h2,p{margin-top:0}h1{margin-bottom:8px;font-size:20px}.eyebrow{margin:0 0 2px;color:var(--muted);font-size:11px;font-weight:900;letter-spacing:.09em}.muted{color:var(--muted)}.small{font-size:11px}.back{min-height:44px;margin:-7px 0 2px -8px;padding:0 8px;border:0;background:transparent;color:#55575c;font-weight:800}.field{display:block;margin-top:20px;font-size:12px;font-weight:800}.field-head{display:flex;justify-content:space-between;margin-bottom:6px}.field-head span:last-child{color:var(--muted);font-size:10px}.field input{width:100%;height:50px;padding:0 13px;border:1px solid #bfc1c5;border-radius:9px;background:#fff;font-size:16px}.create-button,.confirm{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;margin-top:16px;border:0;border-radius:9px;background:var(--ink);color:#fff;font-weight:850}.utility-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.utility{display:flex;align-items:center;justify-content:center;gap:5px;min-height:42px;padding:0 11px;border:1px solid #b9bbc0;border-radius:21px;background:#fff;font-size:12px;font-weight:850}.utility b{color:var(--red);font-size:18px}.form-card{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff}.form-card .field{margin-top:0}.preview-label{margin:17px 0 7px;color:var(--muted);font-size:10px;font-weight:850}.community-card{position:relative;min-height:166px;padding:16px;border-radius:14px;background:#202127;color:#fff;text-align:left}.card-status{display:block;min-height:18px;color:#c7c9cf;font-size:10px}.community-card h2{margin:1px 0 7px;color:#fff;font-size:18px}.card-people{display:flex;align-items:center;min-height:31px;margin-bottom:9px;color:#c7c9cf;font-size:10px}.avatar{display:grid;place-items:center;width:29px;height:29px;margin-right:8px;border:2px solid #202127;border-radius:50%;background:#555963;color:#fff;font-size:10px;font-weight:800}.card-stats{display:flex;gap:24px;padding-top:11px;border-top:1px solid #555}.card-stats span{color:#c7c9cf;font-size:9px}.card-stats b{color:#fff;font-size:18px}.card-stats small{margin-left:2px}.card-input{width:100%;margin:1px 0 7px;padding:0;border:0;border-bottom:1px solid #666;background:transparent;color:#fff;font-size:18px;font-weight:850}.card-input::placeholder{color:#8d8f96}.card-edit-note{margin:8px 0 0;color:#c7c9cf;font-size:10px}.created{display:flex;align-items:center;gap:7px;margin-bottom:12px;color:#287a46;font-size:12px;font-weight:850}.check{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#dcefe3}.qr-wrap{display:grid;place-items:center;min-height:160px;margin-top:12px;border:1px solid var(--line);border-radius:11px;background:#fff;text-align:center}.qr{width:90px;height:90px;border:8px solid #fff;outline:1px solid var(--line);background:linear-gradient(90deg,#202127 25%,transparent 25% 50%,#202127 50% 75%,transparent 75%),linear-gradient(#202127 25%,transparent 25% 50%,#202127 50% 75%,transparent 75%);background-size:19px 19px}.start{position:absolute;z-index:8;right:16px;bottom:80px;width:112px;height:52px;border:0;border-radius:9px;background:var(--red);color:#fff;font-weight:900;box-shadow:0 7px 18px #55191947}.bottom{position:absolute;right:0;bottom:0;left:0;display:grid;grid-template-columns:repeat(4,1fr);height:66px;border-top:1px solid var(--line);background:#fffffff8}.bottom button{border:0;background:transparent;color:#73757a;font-size:12px}.bottom .on{color:var(--red);font-weight:850}@media(max-width:520px){.preview-title span{display:none}.stage{padding:0}.phone{min-height:calc(100vh - 174px);box-shadow:none}.screen{min-height:calc(100vh - 222px)}}
  </style>
</head>
<body>
  <aside class="controls"><div><div class="preview-title"><b>グループ作成 3案</b><span>入力はグループ名だけ</span></div><div class="tabs option-tabs" id="optionTabs"></div><div class="tabs state-tabs" id="stateTabs"></div><p class="note" id="note"></p></div></aside>
  <div class="stage"><main class="phone" id="phone"></main></div>
  <script>
    let option='A',state='input',name='いつものトレ仲間',showQr=false;
    const options={A:{name:'最小フォーム',note:'入力と作成だけに絞った最短の案。'},B:{name:'カード確認',note:'入力中に、作成後の既存グループカードをその場で確認できる案。'},C:{name:'カード入力',note:'グループカードへ直接名前を入れる、少し攻めた一体型の案。'}};
    const states={input:'入力',complete:'作成後'};
    const escaped=value=>value.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;');
    const safe=()=>escaped(name.trim()||'グループ名');
    const card=(editable=false)=>`<div class="community-card"><span class="card-status">${editable?'NEW GROUP':'まだ活動はありません'}</span>${editable?`<input class="card-input" id="cardName" maxlength="40" value="${escaped(name)}" placeholder="グループ名">`:`<h2 id="cardPreview">${safe()}</h2>`}<div class="card-people"><span class="avatar">高</span><span>1人</span></div><div class="card-stats"><span><b>0</b><small>セット</small></span><span><b>0</b><small>kg</small></span></div>${editable?'<p class="card-edit-note"><span id="count">'+name.length+'</span> / 40</p>':''}</div>`;
    const field=()=>`<label class="field"><span class="field-head"><span>グループ名</span><span><span id="count">${name.length}</span> / 40</span></span><input id="name" maxlength="40" value="${escaped(name)}" placeholder="例：いつものトレ仲間" autocomplete="off"></label>`;
    function input(){if(option==='A')return `<button class="back">‹ グループ一覧</button><p class="eyebrow">NEW GROUP</p><h1>グループを作成</h1>${field()}<button class="create-button" id="create">作成する</button>`;if(option==='B')return `<button class="back">‹ グループ一覧</button><p class="eyebrow">NEW GROUP</p><h1>グループを作成</h1><div class="form-card">${field()}</div><p class="preview-label">作成後のカード</p>${card()}<button class="create-button" id="create">作成する</button>`;return `<button class="back">‹ グループ一覧</button><p class="eyebrow">NEW GROUP</p><h1>グループを作成</h1><p class="muted small">カードにグループ名を入力</p>${card(true)}<button class="create-button" id="create">この名前で作成</button>`}
    function complete(){return `<button class="back">‹ グループ一覧</button><div class="created"><span class="check">✓</span>グループを作成しました</div>${card()}<div class="utility-grid"><button class="utility"><b>↗</b>リンクを共有</button><button class="utility" id="qrButton"><b>▦</b>${showQr?'QRを閉じる':'QRを表示'}</button></div>${showQr?'<div class="qr-wrap"><div><div class="qr"></div><p class="muted small" style="margin:10px 0 0">相手のカメラで読み取ってもらいます</p></div></div>':''}<button class="confirm">グループ詳細へ</button>`}
    function shell(body){return `<header class="header"><div class="logo">E-GO<span>TORE</span></div></header><section class="screen">${body}</section><button class="start">START</button><nav class="bottom"><button>ホーム</button><button class="on">グループ</button><button>履歴</button><button>設定</button></nav>`}
    function updateName(value){name=value;const count=document.querySelector('#count');if(count)count.textContent=String(name.length);const preview=document.querySelector('#cardPreview');if(preview)preview.textContent=name.trim()||'グループ名'}
    function bind(){document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{option=b.dataset.option;state='input';render()});document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{state=b.dataset.state;render()});const nameInput=document.querySelector('#name');if(nameInput)nameInput.oninput=e=>updateName(e.target.value);const cardInput=document.querySelector('#cardName');if(cardInput)cardInput.oninput=e=>updateName(e.target.value);const create=document.querySelector('#create');if(create)create.onclick=()=>{if(name.trim()){state='complete';render()}};const qr=document.querySelector('#qrButton');if(qr)qr.onclick=()=>{showQr=!showQr;render()}}
    function render(){document.querySelector('#optionTabs').innerHTML=Object.entries(options).map(([key,o])=>`<button data-option="${key}" class="${option===key?'on':''}">${key}<br>${o.name}</button>`).join('');document.querySelector('#stateTabs').innerHTML=Object.entries(states).map(([key,label])=>`<button data-state="${key}" class="${state===key?'on':''}">${label}</button>`).join('');document.querySelector('#note').textContent=state==='complete'?'作成後は同じグループカードを表示し、そのままリンク・QRで招待できます。':options[option].note;document.querySelector('#phone').innerHTML=shell(state==='input'?input():complete());bind()}render();
  </script>
</body>
</html>
