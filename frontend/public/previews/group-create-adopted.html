<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>E-GOTORE グループ作成 ボトムシート案</title>
  <style>
    :root{--red:#d32f2f;--ink:#202127;--muted:#6b6d73;--line:#dddfe3;--bg:#f4f4f5}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:#e4e5e8;color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}button,input{font:inherit;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid #d32f2f44;outline-offset:2px}.stage{display:flex;justify-content:center;padding:16px 0 40px}.phone{position:relative;width:min(100%,430px);min-height:844px;overflow:hidden;background:var(--bg);box-shadow:0 16px 42px #16181e2b}.header{height:48px;padding:0 16px;display:flex;align-items:center;background:var(--ink);color:#fff}.logo{font-size:22px;font-weight:900;letter-spacing:-.7px}.logo span{color:#ff625b}.screen{min-height:796px;padding:14px 16px 116px}h1,h2,p{margin-top:0}h1{margin-bottom:8px;font-size:20px}.eyebrow{margin:0 0 2px;color:var(--muted);font-size:11px;font-weight:900;letter-spacing:.09em}.section{margin-top:16px}.section-head,.title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.section-head h2,.title-row h1{margin:0}.muted{color:var(--muted)}.small{font-size:11px}.utility-actions{display:flex;gap:6px}.utility{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:42px;padding:0 11px;border:1px solid #b9bbc0;border-radius:21px;background:#fff;font-size:12px;font-weight:850}.utility b{display:grid;place-items:center;color:var(--red);font-size:18px}.utility svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.order-action{min-height:40px;padding:0;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:800}.cards{display:grid;gap:10px}.community-card{min-height:166px;padding:16px;border-radius:14px;background:#202127;color:#fff;text-align:left;box-shadow:0 4px 12px #20212726}.card-live{display:flex;min-height:18px;align-items:center;gap:5px;color:#ff625b;font-size:10px;font-weight:700}.card-live.idle{color:#c7c9cf}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red)}.community-card h2{margin:1px 0 7px;color:#fff;font-size:18px}.card-people{display:flex;align-items:center;min-height:31px;margin-bottom:9px;color:#c7c9cf;font-size:10px}.avatar{display:grid;place-items:center;width:29px;height:29px;margin-right:8px;border:2px solid #202127;border-radius:50%;background:#555963;color:#fff;font-size:10px;font-weight:800}.card-stats{display:flex;gap:24px;padding-top:11px;border-top:1px solid #555}.card-stats span{color:#c7c9cf;font-size:9px}.card-stats b{color:#fff;font-size:18px}.card-stats small{margin-left:2px}.start{position:absolute;z-index:8;right:16px;bottom:80px;width:112px;height:52px;border:0;border-radius:9px;background:var(--red);color:#fff;font-weight:900;box-shadow:0 7px 18px #55191947}.bottom{position:absolute;right:0;bottom:0;left:0;display:grid;grid-template-columns:repeat(4,1fr);height:66px;border-top:1px solid var(--line);background:#fffffff8}.bottom button{border:0;background:transparent;color:#73757a;font-size:12px}.bottom .on{color:var(--red);font-weight:850}
    .backdrop{position:absolute;z-index:30;inset:0;background:#11182766;opacity:0;pointer-events:none;transition:opacity 160ms ease}.backdrop.open{opacity:1;pointer-events:auto}.sheet{position:absolute;z-index:31;right:0;bottom:0;left:0;max-height:calc(100dvh - 64px);padding:8px 16px calc(18px + env(safe-area-inset-bottom));overflow-y:auto;overscroll-behavior:contain;border-radius:20px 20px 0 0;background:#fff;box-shadow:0 -12px 34px #0003;transform:translateY(105%);transition:transform 180ms ease}.sheet.fixed{height:390px}.sheet.open{transform:translateY(0)}.handle{width:38px;height:4px;margin:0 auto 14px;border-radius:4px;background:#c9cacf}.sheet-head{display:flex;min-height:42px;align-items:center;justify-content:space-between;gap:12px}.sheet-head h2{margin:0;font-size:19px}.close{width:42px;height:42px;border:0;border-radius:50%;background:#f0f0f2;font-size:20px}.field{display:block;margin-top:18px;font-size:12px;font-weight:800}.field-head{display:flex;justify-content:space-between;margin-bottom:6px}.field-head span:last-child{color:var(--muted);font-size:10px}.field input{width:100%;height:50px;padding:0 13px;border:1px solid #bfc1c5;border-radius:9px;background:#fff;font-size:16px}.confirm{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;margin-top:16px;border:0;border-radius:9px;background:var(--ink);color:#fff;font-weight:850}.created{display:flex;align-items:center;gap:7px;margin:2px 0 12px;color:#287a46;font-size:12px;font-weight:850}.check{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#dcefe3}.success-title{margin:0 0 12px}.success-title .created{margin:0 0 3px}.success-title h2{margin:0;font-size:20px}.success-hero{display:grid;place-items:center;margin:0 0 14px;text-align:center}.success-hero .check{width:42px;height:42px;margin-bottom:7px;font-size:20px}.success-hero h2{margin:0}.sheet .community-card{box-shadow:none}.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.sheet-actions.one{grid-template-columns:1fr}.sheet-actions .utility{width:100%}.invite-name{margin:12px 0 2px;font-size:17px;font-weight:900}.qr-wrap{display:grid;place-items:center;min-height:156px;margin-top:12px;border:1px solid var(--line);border-radius:11px;background:#fafafa;text-align:center}.qr-wrap.plain{min-height:126px;margin-top:4px;border:0;background:transparent}.qr{width:90px;height:90px;border:8px solid #fff;outline:1px solid var(--line);background:linear-gradient(90deg,#202127 25%,transparent 25% 50%,#202127 50% 75%,transparent 75%),linear-gradient(#202127 25%,transparent 25% 50%,#202127 50% 75%,transparent 75%);background-size:19px 19px}.invite-compact{display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:center;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.invite-compact .qr{margin:auto}.invite-compact p{margin:0 0 10px;font-size:12px;font-weight:750}.invite-compact .utility{width:100%}.finish{width:100%;min-height:46px;margin-top:12px;border:0;background:transparent;font-weight:850}.detail-top{display:flex;align-items:center;gap:10px}.detail-back{width:38px;height:38px;border:0;border-radius:50%;background:#fff;font-size:20px}.detail-top h1{margin:0}.detail-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:16px;padding:4px;border-radius:10px;background:#e5e6e9}.detail-tabs span{display:grid;place-items:center;min-height:38px;border-radius:8px;color:var(--muted);font-size:11px;font-weight:800}.detail-tabs .on{background:#fff;color:var(--red);box-shadow:0 1px 4px #0002}.invite-page{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);text-align:center}.invite-page h2{margin:0;font-size:19px}.invite-page .invite-name{margin-top:4px}.invite-page .utility{width:100%;margin-top:12px}.invite-page .qr-wrap{background:transparent;border:0}@media(max-width:520px){.stage{padding:0}.phone{min-height:100dvh;box-shadow:none}.screen{min-height:calc(100dvh - 48px)}}@media(prefers-reduced-motion:reduce){.backdrop,.sheet{transition:none}}
  </style>
</head>
<body>
  <div class="stage"><main class="phone" id="phone">
    <header class="header"><div class="logo">E-GO<span>TORE</span></div></header>
    <section class="screen" id="mainScreen"></section>
    <button class="start">START</button>
    <nav class="bottom"><button>ホーム</button><button class="on">グループ</button><button>履歴</button><button>設定</button></nav>
    <div class="backdrop" id="backdrop"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section>
  </main></div>
  <script>
    const icons={plus:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',door:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5M8 12h11M15 8l4 4-4 4"/></svg>',share:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="18" cy="19" r="2"/><path d="M8 11l8-5M8 13l8 5"/></svg>',qr:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM15 14h2v2h-2zM19 14v3M14 19h3M20 20h-1"/></svg>'};
    const previewParams=new URLSearchParams(location.search);
    const previewVariant=previewParams.get('complete');
    const nextVariant=previewParams.get('next')||'A';
    const inviteVariant=previewParams.get('invite')||'A';
    const afterVariant=previewParams.get('after')||'A';
    const detailPreview=!!previewVariant&&afterVariant==='B';
    let open=!!previewVariant&&!detailPreview,step=previewVariant?'complete':'input',name='',createdName=previewVariant?'いつものトレ仲間':'',showQr=false,created=!!previewVariant;
    const escapeText=value=>value.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
    const utility=(icon,label,attrs='')=>`<button class="utility" ${attrs}><b>${icon}</b><span>${label}</span></button>`;
    const card=(title,fresh=false)=>`<article class="community-card"><span class="card-live ${fresh?'idle':''}">${fresh?'まだ活動はありません':'<i class="dot"></i>1人がトレーニング中'}</span><h2>${escapeText(title)}</h2><div class="card-people"><span class="avatar">高</span><span>${fresh?'1人':'5人'}</span></div><div class="card-stats"><span><b>${fresh?'0':'18'}</b><small>セット</small></span><span><b>${fresh?'0':'14,280'}</b><small>kg</small></span></div></article>`;
    function main(){if(detailPreview){document.querySelector('#mainScreen').innerHTML=`<div class="detail-top"><button class="detail-back" aria-label="グループ一覧へ戻る">←</button><div><p class="eyebrow">GROUP</p><h1>${escapeText(createdName)}</h1></div></div><div class="detail-tabs"><span class="on">最新記録</span><span>カレンダー</span><span>グラフ</span><span>設定</span></div><section class="invite-page"><h2>メンバーを招待</h2><p class="invite-name">${escapeText(createdName)}</p><div class="qr-wrap"><div><div class="qr"></div><p class="muted small" style="margin:10px 0 0">カメラで読み取って参加</p></div></div>${utility(icons.share,'リンクを共有')}</section>`;return}const newCard=created?card(createdName,true):'';document.querySelector('#mainScreen').innerHTML=`<div class="title-row"><div><p class="eyebrow">GROUPS</p><h1>グループ</h1></div><div class="utility-actions">${utility(icons.plus,'作成','id="openCreate"')}${utility(icons.door,'参加')}</div></div><section class="section"><div class="section-head"><h2>所属グループ</h2><button class="order-action">タップで表示順を変更</button></div><div class="cards">${newCard}${card('いつものトレ仲間')}${card('大学トレ部')}</div></section>`;document.querySelector('#openCreate').onclick=startCreate}
    function sheetInput(){return `<div class="handle"></div><div class="sheet-head"><h2 id="sheetTitle">グループを作成</h2><button class="close" id="close" aria-label="閉じる">×</button></div><label class="field"><span class="field-head"><span>グループ名</span><span><span id="count">${name.length}</span> / 40</span></span><input id="groupName" maxlength="40" value="${escapeText(name)}" placeholder="例：いつものトレ仲間" autocomplete="off"></label><button class="confirm" id="create">作成する</button>`}
    function completeHeading(){const close='<button class="close" id="close" aria-label="閉じる">×</button>';if(!previewVariant||previewVariant==='C')return `<div class="sheet-head"><h2 id="sheetTitle">メンバーを招待</h2>${close}</div>`;if(previewVariant==='B')return `<div class="sheet-head"><div class="success-title"><span class="created"><span class="check">✓</span>作成完了</span><h2 id="sheetTitle">${escapeText(createdName)}</h2></div>${close}</div>`;if(previewVariant==='D')return `<div class="sheet-head"><span></span>${close}</div><div class="success-hero"><span class="check">✓</span><h2 id="sheetTitle">グループができました</h2></div>`;return `<div class="sheet-head"><div class="created"><span class="check">✓</span><h2 id="sheetTitle">作成しました</h2></div>${close}</div>`}
    function inviteActions(){if(inviteVariant==='B')return `<div class="qr-wrap"><div><div class="qr"></div><p class="muted small" style="margin:10px 0 0">カメラで読み取って参加</p></div></div><div class="sheet-actions one">${utility(icons.share,'リンクを共有')}</div>`;if(inviteVariant==='C')return `<div class="invite-compact"><div class="qr"></div><div><p>近くにいる人はQRから参加できます</p>${utility(icons.share,'リンクを共有')}</div></div>`;return `<div class="sheet-actions">${utility(icons.share,'リンクを共有')}${utility(icons.qr,showQr?'QRを閉じる':'QRを表示','id="qrButton"')}</div>${showQr?'<div class="qr-wrap"><div><div class="qr"></div><p class="muted small" style="margin:10px 0 0">カメラで読み取って参加</p></div></div>':''}`}
    function sheetComplete(){if(afterVariant==='A')return `<div class="handle"></div>${completeHeading()}<p class="invite-name">${escapeText(createdName)}</p><div class="qr-wrap plain"><div><div class="qr"></div><p class="muted small" style="margin:10px 0 0">カメラで読み取って参加</p></div></div><div class="sheet-actions one">${utility(icons.share,'リンクを共有')}</div><button class="finish" id="finish">完了</button>`;return `<div class="handle"></div>${completeHeading()}${card(createdName,true)}${inviteActions()}<button class="finish" id="finish">完了</button>`}
    function renderSheet(){const sheet=document.querySelector('#sheet'),backdrop=document.querySelector('#backdrop');sheet.innerHTML=step==='input'?sheetInput():sheetComplete();sheet.classList.toggle('fixed',afterVariant==='A');sheet.classList.toggle('open',open);backdrop.classList.toggle('open',open);document.querySelector('#mainScreen').setAttribute('aria-hidden',String(open));document.querySelector('.start').setAttribute('aria-hidden',String(open));document.querySelector('.bottom').setAttribute('aria-hidden',String(open));const close=document.querySelector('#close');if(close)close.onclick=closeSheet;const input=document.querySelector('#groupName');if(input)input.oninput=e=>{name=e.target.value;document.querySelector('#count').textContent=String(name.length)};const create=document.querySelector('#create');if(create)create.onclick=()=>{if(!name.trim())return;createdName=name.trim();created=true;step='complete';main();renderSheet()};const qr=document.querySelector('#qrButton');if(qr)qr.onclick=()=>{showQr=!showQr;renderSheet()};const finish=document.querySelector('#finish');if(finish)finish.onclick=closeSheet}
    function startCreate(){name='';step='input';showQr=false;open=true;history.pushState({createSheet:true},'');renderSheet();requestAnimationFrame(()=>document.querySelector('#groupName')?.focus())}
    function closeSheet(){open=false;renderSheet();if(history.state?.createSheet)history.back()}
    document.querySelector('#backdrop').onclick=closeSheet;window.addEventListener('popstate',()=>{if(open){open=false;renderSheet()}});main();renderSheet();
  </script>
</body>
</html>
