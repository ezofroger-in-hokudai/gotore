<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>E-GOTORE グループ画面 参加矢印5案</title>
  <style>
    :root{--red:#d32f2f;--ink:#202127;--muted:#6b6d73;--line:#dddfe3;--bg:#f4f4f5;--track:#e9eaed}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:#e4e5e8;color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit}button:focus-visible{outline:3px solid #d32f2f44;outline-offset:2px}.controls{position:sticky;z-index:20;top:0;padding:10px 12px;background:#fffffff2;border-bottom:1px solid #d0d1d4;backdrop-filter:blur(12px)}.controls>div{max-width:900px;margin:auto}.preview-title{display:flex;justify-content:space-between;align-items:baseline}.preview-title b{font-size:15px}.preview-title span,.note{color:var(--muted);font-size:11px}.tabs{display:grid;gap:4px;margin-top:8px;padding:4px;border-radius:9px;background:var(--track)}.option-tabs{grid-template-columns:repeat(5,1fr)}.state-tabs{grid-template-columns:repeat(4,1fr)}.tabs button{min-height:38px;padding:3px 1px;border:0;border-radius:7px;background:transparent;font-weight:800;font-size:10px}.tabs button.on{background:#fff;box-shadow:0 1px 4px #0002}.note{min-height:32px;margin:7px 2px 0}.stage{display:flex;justify-content:center;padding:16px 0 40px}.phone{position:relative;width:min(100%,430px);min-height:844px;overflow:hidden;background:var(--bg);box-shadow:0 16px 42px #16181e2b}.header{height:48px;padding:0 16px;display:flex;align-items:center;background:var(--ink);color:#fff}.logo{font-size:22px;font-weight:900;letter-spacing:-.7px}.logo span{color:#ff625b}.screen{min-height:730px;padding:14px 16px 116px}h1,h2,h3,p{margin-top:0}h1{margin-bottom:8px;font-size:20px}h2{margin-bottom:7px;font-size:16px}.eyebrow{margin:0 0 2px;color:var(--muted);font-size:11px;font-weight:900;letter-spacing:.09em}.muted{color:var(--muted)}.small{font-size:11px}.section{margin-top:16px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.section-head h1,.section-head h2{margin:0}.back{min-height:44px;margin:-7px 0 1px -8px;padding:0 8px;border:0;background:transparent;color:#55575c;font-weight:800}
    .direct-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.action{display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;border:1px solid #b9bbc0;border-radius:9px;background:#fff;font-weight:850}.action.primary{border-color:var(--red);background:var(--red);color:#fff}.action-icon{font-size:19px}.heading-action{width:44px;height:44px;border:0;border-radius:50%;background:var(--red);color:#fff;font-size:25px;font-weight:500}.heading-icons{display:flex;gap:7px}.heading-icons button{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:19px}.heading-icons .red{border-color:var(--red);background:var(--red);color:#fff}.action-rail{display:grid;grid-template-columns:1fr 1fr;margin:10px -16px 0;border-block:1px solid var(--line);background:#fff}.action-rail button{min-height:52px;border:0;background:transparent;font-weight:850}.action-rail button+button{border-left:1px solid var(--line)}.plus-menu{display:grid;gap:6px;margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:11px;background:#fff}.plus-menu button{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 12px;border:0;border-radius:7px;background:#f4f4f5;text-align:left;font-weight:800}
    .equal-actions .action{border-color:var(--line);background:#fff;color:var(--ink)}.equal-actions .action-icon{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#f8e6e6;color:var(--red)}.action-panel{margin-top:10px;padding:4px 12px;border:1px solid var(--line);border-radius:11px;background:#fff}.action-panel button{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:9px;width:100%;min-height:58px;padding:0;border:0;background:transparent;text-align:left}.action-panel button+button{border-top:1px solid var(--line)}.action-panel i{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:#f8e6e6;color:var(--red);font-style:normal;font-size:18px}.action-panel b,.action-panel small{display:block}.action-panel small{color:var(--muted);font-weight:400}.compact-heading{display:flex;align-items:center;justify-content:space-between;gap:8px}.compact-heading h1{margin:0}.compact-actions{display:flex;gap:6px}.compact-actions button{min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:20px;background:#fff;font-size:12px;font-weight:850}.compact-actions .make{border-color:var(--red);background:var(--red);color:#fff}.compact-segment{display:flex;padding:3px;border-radius:10px;background:var(--track)}.compact-segment button{min-height:38px;padding:0 10px;border:0;border-radius:7px;background:transparent;font-size:11px;font-weight:850}.compact-segment .make{background:#fff;color:var(--red);box-shadow:0 1px 3px #0002}.compact-icons{display:flex;gap:5px}.compact-icons button{display:grid;grid-template-rows:18px 12px;place-items:center;width:46px;height:44px;padding:3px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:10px;font-weight:850}.compact-icons b{color:var(--red);font-size:18px;line-height:1}.compact-icons .make{border-color:#efc7c7;background:#fff7f7}.plus-priority{display:flex;align-items:center;gap:4px}.plus-priority .make{display:grid;place-items:center;width:42px;height:42px;border:0;border-radius:50%;background:var(--red);color:#fff;font-size:25px}.plus-priority .join{min-height:42px;padding:0 8px;border:0;background:transparent;font-size:12px;font-weight:850;text-decoration:underline;text-underline-offset:4px}
    .utility-actions{display:flex;justify-content:flex-end;gap:6px}.utility-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.utility-grid.single{grid-template-columns:1fr}.utility{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:42px;padding:0 11px;border:1px solid #b9bbc0;border-radius:21px;background:#fff;font-size:12px;font-weight:850;white-space:nowrap}.utility b,.utility em{display:grid;place-items:center;color:var(--red);font-size:18px;font-style:normal;line-height:1}.utility svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.utility.wide{width:100%}.utility-grid .utility{width:100%}.confirm{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin-top:12px;border:0;border-radius:9px;background:var(--ink);color:#fff;font-weight:850}
    .cards{display:grid;gap:10px}.community-card{position:relative;min-height:166px;padding:16px;border:0;border-radius:14px;background:#202127;color:#fff;text-align:left;box-shadow:0 4px 12px #20212726}.card-live{display:flex;min-height:18px;align-items:center;gap:5px;color:#ff625b;font-size:10px;font-weight:700}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#d32f2f}.card-heading{display:flex;align-items:center;margin:1px 0 6px}.card-heading h2{margin:0;color:#fff;font-size:18px}.card-people{display:flex;align-items:center;min-height:31px;margin-bottom:9px;color:#c7c9cf;font-size:10px}.avatars{display:flex;padding-left:2px}.avatar{display:grid;place-items:center;width:29px;height:29px;margin-left:-6px;border:2px solid #202127;border-radius:50%;background:#555963;color:#fff;font-size:10px;font-weight:800}.avatar:first-child{margin-left:0}.avatar.live{outline:2px solid var(--red);outline-offset:1px}.card-people>span:last-child{margin-left:8px}.card-stats{display:flex;gap:24px;padding-top:11px;border-top:1px solid #555}.card-stats span{color:#c7c9cf;font-size:9px}.card-stats b{color:#fff;font-size:18px}.card-stats small{margin-left:2px}.order-action{min-height:40px;padding:0;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:800}.detail-card{width:100%;box-shadow:none}
    .detail-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.segment{display:grid;grid-template-columns:1.15fr 1fr .8fr .8fr;gap:4px;padding:4px;border-radius:9px;background:var(--track)}.segment button{min-height:40px;padding:2px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:11px;font-weight:800}.segment .on{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0002}.record{padding:13px 0;border-bottom:1px solid var(--line)}.record-head{display:flex;justify-content:space-between}.record p{margin:4px 0;color:var(--muted);font-size:12px}.exercise{display:flex;justify-content:space-between;padding:4px 0;font-size:12px}
    .invite-summary{padding:14px;border-radius:12px;background:var(--ink);color:#fff}.invite-summary h2{margin:2px 0}.invite-summary span{color:#c7c9cf}.qr-wrap{display:grid;place-items:center;min-height:175px;margin-top:10px;border:1px solid var(--line);border-radius:11px;background:#fff;text-align:center}.qr{width:96px;height:96px;border:8px solid #fff;outline:1px solid var(--line);background:linear-gradient(90deg,#202127 25%,transparent 25% 50%,#202127 50% 75%,transparent 75%),linear-gradient(#202127 25%,transparent 25% 50%,#202127 50% 75%,transparent 75%);background-size:20px 20px}.join-card{padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff}.join-card h2{margin:3px 0}.wide{width:100%;margin-top:12px}.settings-content{display:grid;gap:18px;padding-top:16px}.settings-content h3{margin:0 0 7px;font-size:13px}.setting-card{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#fff}.setting-line{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;min-height:60px;padding:10px 13px}.setting-line+.setting-line{border-top:1px solid #ececef}.setting-copy b,.setting-copy small{display:block}.setting-copy small{margin-top:2px;color:var(--muted)}.setting-value{display:flex;align-items:center;gap:6px;color:#55575c;font-size:12px;font-weight:800}.member-card{position:relative;-webkit-tap-highlight-color:transparent;cursor:pointer}.member-list{max-height:496px;transition:max-height 160ms ease}.member-card.is-collapsed .member-list{max-height:217px;overflow:hidden}.member-setting{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:9px;min-height:62px;padding:8px 11px}.member-setting+.member-setting{border-top:1px solid #ececef}.member-setting .avatar{width:34px;height:34px;margin:0}.member-setting b,.member-setting small{display:block}.member-setting small{color:var(--muted)}.owner-badge{padding:3px 7px;border-radius:10px;background:#ececef;color:#5d5f65;font-size:9px;font-weight:850}.member-remove{position:relative;z-index:2;min-height:38px;padding:0 8px;border:0;background:transparent;color:var(--red);font-size:11px;font-weight:850}.member-reveal{position:absolute;right:0;bottom:0;left:0;z-index:1;width:100%;height:104px;padding:0;border:0;background:linear-gradient(to bottom,rgb(32 33 39 / 0%),rgb(32 33 39 / 7%) 58%,rgb(32 33 39 / 16%));box-shadow:inset 0 -14px 22px rgb(32 33 39 / 10%);cursor:pointer}.member-card.is-expanded .member-reveal{right:0;bottom:0;left:auto;width:44px;height:44px;background:transparent;box-shadow:none}.danger-zone{padding-top:2px}.danger-button{width:100%;min-height:48px;border:1px solid #e7bcbc;border-radius:10px;background:#fff;color:#b32626;font-weight:850}.danger-zone p{margin:7px 2px 0;color:var(--muted);font-size:10px}@media(prefers-reduced-motion:reduce){.member-list{transition:none}}
    .start{position:absolute;z-index:8;right:16px;bottom:80px;width:112px;height:52px;border:0;border-radius:9px;background:var(--red);color:#fff;font-weight:900;box-shadow:0 7px 18px #55191947}.bottom{position:absolute;right:0;bottom:0;left:0;display:grid;grid-template-columns:repeat(4,1fr);height:66px;border-top:1px solid var(--line);background:#fffffff8}.bottom button{position:relative;border:0;background:transparent;color:#73757a;font-size:12px}.bottom .on{color:var(--red);font-weight:800}.bottom .on:before{content:"";position:absolute;top:0;right:18px;left:18px;height:2px;background:var(--red)}@media(max-width:520px){.preview-title span{display:none}.stage{padding:0}.phone{min-height:calc(100vh - 174px);box-shadow:none}.screen{min-height:calc(100vh - 222px)}}
  </style>
  <style>
    #groupCards{touch-action:pan-y}#groupCards [data-group]{user-select:none;-webkit-user-select:none}#groupCards [data-group].is-dragging{opacity:.72;transform:scale(.985);box-shadow:0 10px 28px #0004}
  </style>

<body>
  <aside class="controls"><div><div class="preview-title"><b>グループ画面 参加矢印5案</b><span>白ピル＋赤矢印は固定</span></div><div class="tabs option-tabs" id="optionTabs"></div><div class="tabs state-tabs" id="stateTabs"></div><p class="note" id="note"></p></div></aside>
  <div class="stage"><main class="phone" id="phone"></main></div>
  <script>
    const adopted=new URLSearchParams(location.search).get('adopted')==='1';
    let option=adopted?"E":"A",state="home",order=["friends","university","morning"],menu=true,showQr=false,membersExpanded=false;
    const options={A:{name:"参加 →",note:"文字を先に読み、右向き矢印で次へ進むことを示す最も素直な案。"},B:{name:"参加 ›",note:"画面遷移でよく使う細い山括弧。軽いが、赤アイコンとしての存在感は小さい。"},C:{name:"→ 参加",note:"矢印を先に置いて入口を強調する案。作成の＋と位置が揃う。"},D:{name:"丸矢印",note:"丸の中へ進む矢印。独立したアイコンとして認識しやすい案。"},E:{name:"入る矢印",note:"ドアへ入る矢印。参加という意味は強いが、少しログインに見える可能性がある。"}};
    const states={home:"一覧",detail:"詳細",invite:"招待",join:"参加"};
    const groups={friends:{name:"いつものトレ仲間",today:"5人",sets:"18",volume:"14,280",live:true},university:{name:"大学トレ部",today:"3人",sets:"14",volume:"11,160",live:false},morning:{name:"朝トレ部",today:"2人",sets:"9",volume:"7,200",live:true}};
    const avatars=()=>`<span class="avatars"><span class="avatar live">高</span><span class="avatar">佐</span><span class="avatar">森</span></span>`;
    const card=(id,detail=false)=>{const g=groups[id];return `<div class="community-card ${detail?'detail-card':''}" role="button" tabindex="0" ${detail?'':`data-group="${id}"`}><span class="card-live">${g.live?'<i class="dot"></i>1人がトレーニング中':'今日は3人が活動'}</span><div class="card-heading"><h2>${g.name}</h2></div><div class="card-people">${avatars()}<span>${g.today}</span></div><div class="card-stats"><span><b>${g.sets}</b><small>セット</small></span><span><b>${g.volume}</b><small>kg</small></span></div></div>`};
    const icons={plus:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',arrow:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M15 8l4 4-4 4"/></svg>',circleArrow:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M7 12h10M13 8l4 4-4 4"/></svg>',door:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5M8 12h11M15 8l4 4-4 4"/></svg>',member:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.5-4 2.4-6 5.5-6 2.2 0 3.8 1 4.7 3M18 7v6M15 10h6"/></svg>',share:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="18" cy="19" r="2"/><path d="M8 11l8-5M8 13l8 5"/></svg>',qr:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM15 14h2v2h-2zM19 14v3M14 19h3M20 20h-1"/></svg>'};
    const utility=(icon,label,attrs='',tail='')=>`<button class="utility" ${attrs}>${icon?`<b>${icon}</b>`:''}<span>${label}</span>${tail?`<em>${tail}</em>`:''}</button>`;
    const joinButton=()=>option==='A'?utility('','参加','data-state="join"','→'):option==='B'?utility('','参加','data-state="join"','›'):option==='C'?utility(icons.arrow,'参加','data-state="join"'):option==='D'?utility(icons.circleArrow,'参加','data-state="join"'):utility(icons.door,'参加','data-state="join"');
    function topActions(){return `<div class="compact-heading"><div><p class="eyebrow">GROUPS</p><h1>グループ</h1></div><div class="utility-actions">${utility(icons.plus,'作成')}${joinButton()}</div></div>`}
    function home(){return `${topActions()}<section class="section"><div class="section-head"><h2>所属グループ</h2></div><p class="order-action">長押しドラッグで表示順を変更</p><div class="cards" id="groupCards">${order.map(id=>card(id)).join('')}</div></section>`}
    function detail(){return `<button class="back" data-state="home">‹ グループ一覧</button><div class="detail-top"><div><p class="eyebrow">GROUP</p><h1>グループ詳細</h1></div>${utility(icons.member,'招待','data-state="invite"')}</div>${card('friends',true)}<section class="section"><div class="segment"><button class="on">最新記録</button><button>カレンダー</button><button>グラフ</button><button>設定</button></div><div id="detailBody"><article class="record"><div class="record-head"><b>高橋</b><span class="muted small">今日 10:42</span></div><p>3種目　9セット　5,460kg</p><div class="exercise"><b>ベンチプレス</b><span>75kg × 8回</span></div><div class="exercise"><span>スクワット</span><span>100kg × 5回</span></div></article><article class="record"><div class="record-head"><b>佐藤</b><span class="muted small">昨日 19:08</span></div><p>2種目　7セット　3,820kg</p></article></div></section>`}
    function invite(){return `<button class="back" data-state="detail">‹ グループ詳細</button><p class="eyebrow">INVITE</p><h1>メンバーを招待</h1><h2>いつものトレ仲間</h2><div class="qr-wrap"><div><div class="qr"></div><p class="muted small" style="margin:10px 0 0">7日間有効</p></div></div><div class="utility-grid single">${utility(icons.share,'リンクを共有')}</div>`}
    function join(){return `<button class="back" data-state="home">‹ グループ一覧</button><p class="eyebrow">JOIN</p><h1>グループに参加</h1><p class="muted">受け取った招待リンクを開くか、QRコードを読み取ります。</p><div class="utility-grid single">${utility(icons.qr,'QRコードを読み取る')}</div><section class="section"><p class="eyebrow">招待を開いた場合</p><div class="join-card"><h2>いつものトレ仲間</h2>${avatars()}<p class="muted small" style="margin:8px 0">メンバー 8人</p><button class="confirm">このグループに参加</button></div></section>`}
    function shell(content){return `<header class="header"><div class="logo">E-GO<span>TORE</span></div></header><section class="screen">${content}</section><button class="start">START</button><nav class="bottom"><button>ホーム</button><button class="on">グループ</button><button>履歴</button><button>設定</button></nav>`}
    const member=(initial,name,me=false)=>`<div class="member-setting"><span class="avatar ${me?'live':''}">${initial}</span><span><b>${name}</b><small>${me?'あなた':'メンバー'}</small></span>${me?'<span class="owner-badge">オーナー</span>':'<button class="member-remove">退出させる</button>'}</div>`;
    function settingsMarkup(){return `<div class="settings-content"><section><h3>グループ情報</h3><div class="setting-card"><div class="setting-line"><span class="setting-copy"><b>グループ名</b></span><span class="setting-value">いつものトレ仲間　›</span></div><div class="setting-line"><span class="setting-copy"><b>オーナー</b></span><span class="setting-value">高橋　<button class="member-remove" type="button">変更</button></span></div></div></section><section><div class="section-head"><h3>メンバー管理</h3><span class="muted small">8人</span></div><div class="setting-card member-card ${membersExpanded?'is-expanded':'is-collapsed'}" aria-expanded="${membersExpanded}"><div class="member-list">${member('高','高橋',true)}${member('佐','佐藤')}${member('森','森')}${member('石','石井')}${member('田','田中')}${member('山','山本')}${member('伊','伊藤')}${member('鈴','鈴木')}</div><button class="member-reveal" aria-label="${membersExpanded?'メンバーを小さく表示':'すべてのメンバーを表示'}"></button></div></section><section class="danger-zone"><button class="danger-button">グループを削除</button><p>この操作は元に戻せません。実行前にもう一度確認します。</p></section></div>`}
    function bindMemberCard(){const card=document.querySelector('.member-card');if(!card)return;card.onclick=e=>{if(e.target.closest('.member-remove'))return;membersExpanded=!membersExpanded;const active=document.querySelector('.segment .on');if(active)detailTab(active)}}
    function detailTab(button){const body=document.querySelector('#detailBody'),label=button.textContent;button.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===button));if(label==='設定')body.innerHTML=settingsMarkup();else if(label==='カレンダー')body.innerHTML='<div class="join-card section"><h2>9月</h2><p class="muted">月　 火　 水　 木　 金　 土　 日</p><p style="font-size:22px;word-spacing:9px">21　22　23　<span style="color:#d32f2f">24</span>　25　<span style="color:#d32f2f">26</span>　27</p></div>';else if(label==='グラフ')body.innerHTML='<div class="join-card section"><h2>総負荷の推移</h2><p style="font-size:32px;letter-spacing:5px;color:#d32f2f">▂▅▃▇▆</p><p class="muted small">今週 62,840kg</p></div>';else body.innerHTML='<article class="record"><div class="record-head"><b>高橋</b><span class="muted small">今日 10:42</span></div><p>3種目　9セット　5,460kg</p><div class="exercise"><b>ベンチプレス</b><span>75kg × 8回</span></div><div class="exercise"><span>スクワット</span><span>100kg × 5回</span></div></article><article class="record"><div class="record-head"><b>佐藤</b><span class="muted small">昨日 19:08</span></div><p>2種目　7セット　3,820kg</p></article>';if(label==='設定')bindMemberCard()}
    function bind(){document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{option=b.dataset.option;state='home';menu=true;render()});document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{state=b.dataset.state;showQr=false;render()});document.querySelectorAll('[data-group]').forEach(c=>{let timer=null,dragging=false,suppressClick=false;c.onclick=()=>{if(suppressClick){suppressClick=false;return}state='detail';render()};c.addEventListener('pointerdown',event=>{if(event.button!==0)return;timer=setTimeout(()=>{dragging=true;c.classList.add('is-dragging')},420)});c.addEventListener('pointermove',event=>{if(!dragging)return;const target=document.elementFromPoint(event.clientX,event.clientY)?.closest('#groupCards [data-group]');if(!target||target===c)return;const rect=target.getBoundingClientRect(),before=event.clientY<rect.top+rect.height/2;target.parentElement.insertBefore(c,before?target:target.nextElementSibling)});const stop=()=>{if(timer)clearTimeout(timer);timer=null;if(dragging){dragging=false;c.classList.remove('is-dragging');suppressClick=true;order=[...document.querySelectorAll('#groupCards [data-group]')].map(item=>item.dataset.group);setTimeout(()=>{suppressClick=false},0)}};c.addEventListener('pointerup',stop);c.addEventListener('pointercancel',stop)});const plus=document.querySelector('#plus');if(plus)plus.onclick=()=>{menu=!menu;render()};const qr=document.querySelector('#qr');if(qr)qr.onclick=()=>{showQr=!showQr;render()};document.querySelectorAll('.segment button').forEach(b=>b.onclick=()=>detailTab(b))}
    function render(){document.querySelector('#optionTabs').innerHTML=adopted?'':Object.entries(options).map(([key,o])=>`<button data-option="${key}" class="${option===key?'on':''}">${key}<br>${o.name}</button>`).join('');document.querySelector('#optionTabs').style.display=adopted?'none':'';document.querySelector('.preview-title b').textContent=adopted?'グループ画面 現時点の採用案':'グループ画面 参加矢印5案';document.querySelector('.preview-title span').textContent=adopted?'入る矢印＋白ピル':'白ピル＋赤矢印は固定';document.querySelector('#stateTabs').innerHTML=Object.entries(states).map(([key,label])=>`<button data-state="${key}" class="${state===key?'on':''}">${label}</button>`).join('');document.querySelector('#note').textContent=adopted?'カードを長押ししてドラッグすると表示順を変更できます。短いタップはグループ詳細を開きます。':options[option].note;document.querySelector('#phone').innerHTML=shell(({home,detail,invite,join})[state]());bind()}render();
  </script>
</body>
</html>
