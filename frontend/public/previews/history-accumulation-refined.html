<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-GOTORE 履歴・積み重ね案の整理</title>
    <style>
      :root{color-scheme:light;--ink:#202127;--red:#d32f2f;--paper:#f5f5f6;--line:#e1e2e5;--muted:#696b71;--track:#ececef}
      *{box-sizing:border-box}html,body{margin:0;min-height:100%}
      body{background:#e9eaed;color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
      button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #d32f2f66;outline-offset:2px}
      .preview-note{max-width:390px;margin:0 auto;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);font-size:12px;color:#57595f}
      .preview-note b{display:block;color:var(--ink);font-size:14px}
      .stage{display:flex;justify-content:center;padding:12px 0 24px}
      .phone{position:relative;display:flex;flex-direction:column;width:min(100%,390px);height:min(844px,calc(100dvh - 78px));min-height:520px;overflow:hidden;background:var(--paper);box-shadow:0 16px 42px #16181e2b}
      .app-header{flex:none;display:flex;align-items:center;height:48px;padding:0 16px;background:var(--ink);color:#fff}
      .logo{font-size:22px;font-weight:900;letter-spacing:-.7px}.logo span{color:#ff625b}
      .screen{flex:1;overflow-y:auto;padding:15px 16px 120px;scrollbar-width:thin}
      h1,h2,p{margin:0}h1{font-size:21px;line-height:1.25}h2{font-size:16px;line-height:1.3}
      .eyebrow{color:var(--red);font-size:10px;font-weight:800;letter-spacing:.12em}.intro{margin:3px 0 15px;color:var(--muted);font-size:12px}
      .section{margin-top:19px}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:9px}.section-head small{color:var(--muted);font-size:11px}
      .lifetime{padding:15px 15px 13px;border-radius:12px;background:var(--ink);color:#fff}
      .lifetime-label{color:#c7c8ce;font-size:11px}.lifetime-number{margin:3px 0 13px;font-size:32px;font-weight:850;line-height:1.15;letter-spacing:-1.4px;white-space:nowrap}.lifetime-number small{margin-left:3px;font-size:15px;letter-spacing:0}
      .lifetime-row{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #55575d}
      .lifetime-row div{padding:10px 0 0}.lifetime-row div+div{padding-left:15px;border-left:1px solid #55575d}
      .lifetime-row strong{font-size:17px}.lifetime-row small{margin-left:4px;color:#c7c8ce;font-size:11px}
      .heatmap-card,.graph-card{padding:12px 11px;border:1px solid var(--line);border-radius:11px;background:#fff}
      .month-labels{display:flex;justify-content:space-around;margin:0 0 7px 16px;color:var(--muted);font-size:10px}
      .heatmap-wrap{display:flex;gap:5px}.weekdays{display:grid;grid-template-rows:repeat(7,11px);gap:3px;width:15px;color:var(--muted);font-size:9px;line-height:11px}
      .heatmap{display:grid;flex:1;grid-auto-flow:column;grid-template-rows:repeat(7,11px);grid-auto-columns:minmax(0,1fr);gap:3px}
      .heatmap button{min-width:0;width:100%;height:11px;padding:0;border:0;border-radius:2px;background:#e9eaec}
      .heatmap button[data-level="1"]{background:#f6d8d6}.heatmap button[data-level="2"]{background:#eaa19d}.heatmap button[data-level="3"]{background:#d95550}.heatmap button[data-level="4"]{background:#ad2525}
      .heatmap button[aria-pressed="true"]{outline:2px solid #27282d;outline-offset:1px}
      .heatmap-foot{display:flex;justify-content:space-between;gap:6px;margin-top:8px;color:var(--muted);font-size:10px}.heatmap-key{display:flex;align-items:center;gap:3px;white-space:nowrap}.heatmap-key i{width:9px;height:9px;border-radius:2px;background:#e9eaec}.heatmap-key i:nth-of-type(2){background:#f6d8d6}.heatmap-key i:nth-of-type(3){background:#eaa19d}.heatmap-key i:nth-of-type(4){background:#d95550}.heatmap-key i:nth-of-type(5){background:#ad2525}
      .day-result{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-top:9px;padding:9px 1px 0;border-top:1px solid var(--line);font-size:12px}.day-result span{color:var(--muted);text-align:right}
      .day-open{min-height:39px;padding:0 8px;border:0;background:transparent;color:var(--red);font-size:12px;font-weight:700;white-space:nowrap}
      .day-record{margin-top:5px;padding:10px;border-radius:7px;background:var(--paper);font-size:12px}.day-record b{display:block;margin-bottom:3px}
      .graph-top{display:flex;align-items:center;justify-content:space-between;gap:9px}.graph-top select{width:118px;height:38px;padding:0 7px;border:1px solid #cfd0d3;border-radius:7px;background:#fff;font-size:12px}
      .metric-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:11px;padding:4px;border-radius:7px;background:var(--track)}
      .metric-tabs button{min-height:40px;padding:4px 2px;border:0;border-radius:5px;background:transparent;color:#64666c;font-size:11px;font-weight:700}
      .metric-tabs button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0002}
      .graph-period{margin-top:12px;color:var(--muted);font-size:11px}
      .graph-value{display:flex;align-items:baseline;gap:7px;margin-top:2px}.graph-value strong{font-size:29px;line-height:1.2;letter-spacing:-1px}.graph-value small{font-size:13px;letter-spacing:0}.graph-value span{color:var(--muted);font-size:11px}
      .graph-svg{display:block;width:100%;height:132px;margin-top:5px;overflow:visible}.graph-labels{display:grid;grid-template-columns:repeat(6,1fr);color:var(--muted);font-size:10px;text-align:center}
      .graph-help{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
      .bottom-nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);height:66px;border-top:1px solid var(--line);background:#fff}.bottom-nav button{position:relative;border:0;background:transparent;color:#73757a;font-size:12px}.bottom-nav button.on{color:var(--red);font-weight:800}.bottom-nav button.on:before{content:"";position:absolute;top:0;left:20%;right:20%;height:2px;background:var(--red)}
      .start{position:absolute;right:16px;bottom:78px;z-index:4;width:112px;height:52px;border:0;border-radius:12px;background:var(--red);color:#fff;box-shadow:0 7px 20px #661d1d46;font-weight:900;letter-spacing:.08em}
      @media(max-width:520px){.stage{padding:0}.phone{width:100%;height:calc(100dvh - 52px);min-height:480px;box-shadow:none}}
    </style>
  </head>
  <body>
    <aside class="preview-note"><b>履歴・積み重ね案の整理</b>累計、ヒートマップ、グラフの3要素に絞ったプレビュー</aside>
    <main class="stage"><div class="phone"><header class="app-header"><div class="logo">E-GO<span>TORE</span></div></header><div class="screen" id="screen"></div><button type="button" class="start" aria-label="記録を開始する見本">START</button><nav class="bottom-nav" aria-label="メインナビゲーション"><button type="button">ホーム</button><button type="button">グループ</button><button type="button" class="on" aria-current="page">履歴</button><button type="button">設定</button></nav></div></main>
    <script>
      const exerciseData={
        all:{name:"全種目",volume:[18000,22000,26000,30500,35000,37790],weight:[70,80,85,90,95,100],rm:[82,93,105,111,120,126],source:["スクワット","スクワット","スクワット","スクワット","スクワット","スクワット"]},
        bench:{name:"ベンチプレス",volume:[5500,6900,7500,8100,9000,11000],weight:[50,55,57.5,62.5,65,70],rm:[60,67,70,76,82,90]},
        squat:{name:"スクワット",volume:[7400,8500,10400,11800,14000,16000],weight:[70,75,80,85,90,100],rm:[82,89,99,106,115,126]},
        lat:{name:"ラットプルダウン",volume:[2300,2800,3500,4000,4900,5600],weight:[35,37.5,40,42.5,47.5,50],rm:[42,45,49,52,57,63]}
      };
      const metrics={volume:{name:"総負荷",unit:"kg"},weight:{name:"最大重量",unit:"kg"},rm:{name:"最大推定1RM",unit:"kg"}};
      const sampleDays={"2026-09-27":{level:3,sets:12,volume:4890,exercises:"ベンチプレス・ダンベルフライ・スクワット"},"2026-09-24":{level:4,sets:10,volume:9000,exercises:"スクワット・レッグプレス"},"2026-09-21":{level:2,sets:9,volume:2500,exercises:"懸垂・ラットプルダウン"}};
      let selectedDay="2026-09-27",openDay=false,exercise="all",metric="volume",selectedPoint=5;
      const first=new Date(Date.UTC(2026,5,29));
      const label=(day)=>`${Number(day.slice(5,7))}月${Number(day.slice(8,10))}日`;
      function dataForDay(day,index){if(sampleDays[day])return sampleDays[day];const level=(index*11+Math.floor(index/7)*5)%17<8?0:1+((index*3+Math.floor(index/6))%4);return{level,sets:level*2+1,volume:level*620+480,exercises:"その日のトレーニング"};}
      function heatmap(){
        const cells=Array.from({length:91},(_,index)=>{const day=new Date(first.getTime()+index*86400000).toISOString().slice(0,10);const item=dataForDay(day,index);return `<button type="button" data-day="${day}" data-level="${item.level}" aria-label="${label(day)} ${item.level?`${item.sets}セット`:"記録なし"}" aria-pressed="${day===selectedDay}"></button>`}).join("");
        const selectedIndex=Math.round((Date.parse(`${selectedDay}T00:00:00Z`)-first.getTime())/86400000);
        const item=dataForDay(selectedDay,selectedIndex);
        return `<div class="heatmap-card"><div class="month-labels"><span>7月</span><span>8月</span><span>9月</span></div><div class="heatmap-wrap"><div class="weekdays"><span>月</span><span></span><span>水</span><span></span><span>金</span><span></span><span>日</span></div><div class="heatmap">${cells}</div></div><div class="heatmap-foot"><span>6/29–9/27 · 日別の総負荷</span><span class="heatmap-key">少 <i></i><i></i><i></i><i></i><i></i> 多</span></div><div class="day-result"><b>${label(selectedDay)}</b>${item.level?`<span>${item.sets}セット · ${item.volume.toLocaleString("ja-JP")}kg</span>`:"<span>記録なし</span>"}</div>${item.level?`<button type="button" class="day-open" data-open-day aria-expanded="${openDay}">${openDay?"記録を閉じる":"この日の記録を見る　›"}</button>`:""}${openDay&&item.level?`<div class="day-record"><b>${item.exercises}</b>${item.sets}セット · ${item.volume.toLocaleString("ja-JP")}kg</div>`:""}</div>`;
      }
      function graph(){
        const group=exerciseData[exercise],values=group[metric],unit=metrics[metric].unit,value=values[selectedPoint];
        const min=metric==="volume"?0:Math.min(...values)-12,max=Math.max(...values)*1.13;
        const y=(v)=>112-((v-min)/(max-min))*90;
        const nodes=values.map((v,index)=>`<circle cx="${24+index*55}" cy="${y(v)}" r="${index===selectedPoint?5:3.5}" fill="${index===selectedPoint?'#d32f2f':'#fff'}" stroke="#d32f2f" stroke-width="2"/><circle data-point="${index}" cx="${24+index*55}" cy="${y(v)}" r="17" fill="transparent"><title>${["11月","1月","3月","5月","7月","9月"][index]} ${v.toLocaleString("ja-JP")}${unit}</title></circle>`).join("");
        const coordinates=values.map((v,index)=>`${24+index*55},${y(v)}`).join(" ");
        const bars=values.map((v,index)=>`<rect data-point="${index}" x="${12+index*55}" y="${y(v)}" width="24" height="${112-y(v)}" rx="3" fill="${index===selectedPoint?'#d32f2f':'#eaa19d'}"><title>${["11月","1月","3月","5月","7月","9月"][index]} ${v.toLocaleString("ja-JP")}${unit}</title></rect>`).join("");
        const source=exercise==="all"&&metric!=="volume"?` · ${group.source[selectedPoint]}`:"";
        return `<div class="graph-card"><div class="graph-top"><h2>記録の推移</h2><select id="exercise" aria-label="グラフの種目">${Object.entries(exerciseData).map(([key,data])=>`<option value="${key}" ${exercise===key?'selected':''}>${data.name}</option>`).join("")}</select></div><div class="metric-tabs" aria-label="グラフの指標">${Object.entries(metrics).map(([key,data])=>`<button type="button" data-metric="${key}" aria-pressed="${metric===key}">${data.name}</button>`).join("")}</div><p class="graph-period">2025年11月–2026年9月 · ${metric==="volume"?"月別合計":"各月の最高値"}</p><div class="graph-value"><strong>${value.toLocaleString("ja-JP")}<small>${unit}</small></strong><span>${["11月","1月","3月","5月","7月","9月"][selectedPoint]}${source}</span></div><svg class="graph-svg" viewBox="0 0 320 136" role="img" aria-label="${group.name}の${metrics[metric].name}推移"><path d="M18 112H308M18 67H308M18 22H308" fill="none" stroke="#e9eaec" stroke-width="1"/>${metric==="volume"?bars:`<polyline points="${coordinates}" fill="none" stroke="#d32f2f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${nodes}`}</svg><div class="graph-labels"><span>11月</span><span>1月</span><span>3月</span><span>5月</span><span>7月</span><span>9月</span></div><p class="graph-help">${exercise==="all"&&metric!=="volume"?"全種目で、その月の1セットの最大値。点を押すと種目も分かります。":metric==="volume"?"各月の重量 × 回数を合計。棒を押すと値が見られます。":"点を押すと、その月の最高値が見られます。"}</p></div>`;
      }
      function render(){
        const screen=document.getElementById("screen"),scroll=screen.scrollTop;
        screen.innerHTML=`<p class="eyebrow">MY HISTORY</p><h1>自分の積み重ね</h1><p class="intro">2025年11月から</p><div class="lifetime"><p class="lifetime-label">これまでの総負荷</p><div class="lifetime-number">246,380<small>kg</small></div><div class="lifetime-row"><div><strong>84回</strong><small>トレーニング</small></div><div><strong>1,026</strong><small>セット</small></div></div></div><section class="section"><div class="section-head"><h2>トレーニングの足あと</h2><small>直近13週間</small></div>${heatmap()}</section><section class="section">${graph()}</section>`;
        screen.scrollTop=scroll;
      }
      document.addEventListener("click",event=>{
        const day=event.target.closest("[data-day]");if(day){selectedDay=day.dataset.day;openDay=false;render();return}
        if(event.target.closest("[data-open-day]")){openDay=!openDay;render();return}
        const tab=event.target.closest("[data-metric]");if(tab){metric=tab.dataset.metric;selectedPoint=5;render();return}
        const point=event.target.closest("[data-point]");if(point){selectedPoint=Number(point.dataset.point);render()}
      });
      document.addEventListener("change",event=>{if(event.target.id==="exercise"){exercise=event.target.value;selectedPoint=5;render()}});
      render();
    </script>
  </body>
</html>
