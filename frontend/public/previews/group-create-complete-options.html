<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>E-GOTORE グループ作成後の遷移 2案</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#e4e5e8;font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.controls{height:94px;padding:9px 12px;background:#fff;border-bottom:1px solid #d3d4d7}.controls>div{max-width:900px;margin:auto}.title{display:flex;justify-content:space-between;align-items:center}.title b{font-size:14px}.title span{color:#6b6d73;font-size:10px}.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-top:7px;padding:4px;border-radius:9px;background:#e9eaed}.tabs button{min-height:42px;padding:2px;border:0;border-radius:7px;background:transparent;font:inherit;font-weight:800}.tabs button.on{background:#fff;box-shadow:0 1px 4px #0002}.preview{display:block;width:100%;height:calc(100% - 94px);border:0;background:#f4f4f5}@media(max-width:520px){.title span{display:none}}
  </style>
</head>
<body>
  <div class="controls"><div><div class="title"><b>作成後の遷移 2案</b><span>カードなし・QR初期表示で固定</span></div><div class="tabs" id="tabs"></div></div></div>
  <iframe class="preview" id="preview" title="グループ作成後の遷移比較"></iframe>
  <script>
    const options={A:'同じ高さのシート',B:'グループ詳細へ'};let selected='A';function render(){document.querySelector('#tabs').innerHTML=Object.entries(options).map(([key,label])=>`<button data-key="${key}" class="${selected===key?'on':''}">${key}<br>${label}</button>`).join('');document.querySelector('#preview').src=`group-create-adopted.html?complete=C&after=${selected}`;document.querySelectorAll('[data-key]').forEach(button=>button.onclick=()=>{selected=button.dataset.key;render()})}render();
  </script>
</body>
</html>
