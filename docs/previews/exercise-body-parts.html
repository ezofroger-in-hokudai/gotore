<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GO TORE 種目選択の画面案</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8e9ec;color:#17191d;font:14px/1.5 Arial,"Noto Sans CJK JP",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #1679d2;outline-offset:2px}button{color:inherit} .review{max-width:1250px;margin:30px auto;padding:0 20px}.review h1{font-size:24px;margin-bottom:8px}.review>p{color:#656a74;max-width:850px}.examples{display:flex;gap:24px;align-items:flex-start;overflow-x:auto;padding:16px 0 32px}.example{flex:0 0 390px}.example>h2{font-size:17px;margin:0 0 4px}.caption{min-height:48px;margin:0 0 12px;color:#656a74;font-size:13px}.phone{width:390px;min-height:844px;background:#f4f4f5;position:relative;border:1px solid #d9dce1;overflow:hidden;padding-bottom:76px}.brand{height:65px;padding:19px 20px;font-size:21px;font-weight:800;letter-spacing:-.5px}.brand em{font-style:normal;color:#d32f2f}.content{padding:8px 20px 20px}.session{display:flex;justify-content:space-between;font-size:12px;color:#656a74;align-items:center;margin:0 0 19px}.dot{display:inline-block;background:#d32f2f;width:7px;height:7px;border-radius:50%;margin-right:6px}.text{border:0;background:none;padding:8px 0;color:#656a74}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.heading h2{font-size:22px;margin:0}.heading button{color:#d32f2f;font-size:13px}.recent{display:flex;justify-content:space-between;width:100%;border:0;border-top:1px solid #dedfe3;border-bottom:1px solid #dedfe3;background:none;padding:12px 0;margin-bottom:18px;text-align:left;font-size:12px}.recent b{font-size:13px}.muted{color:#656a74}.search{display:block;position:relative;margin-bottom:14px}.search input{width:100%;height:44px;border:1px solid #dedfe3;border-radius:8px;background:#fff;padding:10px 12px;font-size:14px}.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.filters button{min-width:44px;height:40px;padding:0 11px;border-radius:5px;background:#fff;border:1px solid #dedfe3;font-size:12px}.filters button[aria-pressed=true]{background:#d32f2f;border-color:#d32f2f;color:white;font-weight:700}.list-title{display:flex;align-items:center;justify-content:space-between;margin:12px 0 8px;font-size:12px;color:#656a74}.rows{background:#fff;border-radius:8px;overflow:hidden}.exercise{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;border:0;border-bottom:1px solid #eceef1;background:none;text-align:left;min-height:68px}.exercise:last-child{border-bottom:0}.exercise b{display:block;font-size:15px;margin-bottom:5px}.exercise small{font-size:11px;color:#656a74}.tag{color:#b82124;background:#fff0f0;border-radius:3px;display:inline-block;padding:2px 6px;margin-right:6px;font-size:11px}.chevron{color:#8d929c;font-size:22px}.add{border:1px dashed #bfc3cb;background:none;color:#d32f2f;border-radius:8px;min-height:44px;width:100%;margin-top:14px;font-size:13px}.nav{position:absolute;bottom:0;left:0;right:0;height:65px;border-top:1px solid #dedfe3;background:#fff;display:flex;align-items:center;justify-content:space-around;font-size:11px;color:#656a74}.nav .active{color:#d32f2f;font-weight:bold}.part-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.part-grid button{border:1px solid #dedfe3;background:#fff;border-radius:8px;height:88px;text-align:left;padding:13px}.part-grid b{display:block;font-size:18px;margin-bottom:6px}.part-grid small{font-size:11px;color:#656a74}.part-grid button:first-child{border-color:#d32f2f;background:#fff8f8}.part-grid button:first-child b{color:#c0292c}.unclassified{display:flex;justify-content:space-between;align-items:center;border:0;border-top:1px solid #dedfe3;border-bottom:1px solid #dedfe3;width:100%;background:none;padding:14px 0;font-size:13px}.breadcrumb{display:flex;align-items:center;gap:12px;margin-bottom:14px}.breadcrumb button{border:0;background:none;font-size:20px;padding:8px}.breadcrumb b{font-size:19px}.overlay{position:absolute;inset:0;background:#17191d50;display:flex;align-items:flex-end}.sheet{width:100%;border-radius:16px 16px 0 0;background:#fff;padding:13px 20px 30px}.handle{height:4px;width:36px;background:#dedfe3;border-radius:3px;margin:0 auto 18px}.sheet h3{font-size:19px;margin:0 0 5px}.sheet label{display:block;font-weight:bold;font-size:13px;margin:20px 0 7px}.sheet select{width:100%;height:46px;background:#f4f4f5;border:1px solid #dedfe3;border-radius:7px;padding:8px}.sheet details{margin-top:22px}.sheet summary{cursor:pointer;font-size:13px;font-weight:bold}.secondary{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0 20px}.secondary button{border:1px solid #dedfe3;background:#fff;border-radius:6px;padding:9px 16px;font-size:13px}.secondary button[aria-pressed=true]{background:#fff0f0;border-color:#d32f2f;color:#bd2428}.primary{background:#d32f2f;color:#fff;border:0;border-radius:8px;min-height:47px;width:100%;font-weight:bold;margin-top:22px}.cancel{width:100%;border:0;background:none;color:#656a74;margin-top:10px;padding:10px}.toast{font-size:12px;color:#167743;margin-top:9px}.record-header{font-size:22px;margin:14px 0 4px}.input-mock{margin-top:32px;background:#fff;border-radius:8px;padding:28px 12px;text-align:center}.input-mock strong{font-size:36px}.back{border:0;background:none;color:#d32f2f;padding:10px 0}.empty{padding:22px;text-align:center;color:#656a74;font-size:13px}[hidden]{display:none!important}
@media(max-width:600px){.review{margin:20px auto;padding:0 12px}.examples{flex-direction:column;align-items:center;overflow:visible}.example{flex:none;max-width:100%;width:390px}.phone{max-width:100%}.caption{min-height:0}}
</style>
<main class="review"><h1>種目を、部位から選べるように。</h1><p>操作できる画面案です。架空の種目リストを使っています。部位・検索・種目選択・「種目一覧」の分類編集を試せます。入力した内容はサーバーへ保存しません。</p><div class="examples">
<section class="example"><h2>A｜一覧を部位で絞る</h2><p class="caption">おすすめ。種目をすぐ選べて、部位でも絞れます。<br>部位を選ぶ → 種目をタップ。</p><article class="phone" id="proposal-a"></article></section>
<section class="example"><h2>B｜部位から探す</h2><p class="caption">最初に部位を大きく見せます。<br>部位を開く → 種目をタップ。一覧へは戻る操作が必要。</p><article class="phone" id="proposal-b"></article></section>
<section class="example"><h2>共通｜部位を編集</h2><p class="caption">主な部位を選び、補助部位は必要なときだけ。<br>普段の記録画面に設定項目を増やしません。</p><article class="phone" id="proposal-edit"></article></section>
</div></main>
<script>
const parts=['胸','背中','肩','腕','脚','お尻','腹','全身','その他'];
const records=[{name:'ベンチプレス',primary:'胸',secondary:['肩','腕']},{name:'ペックフライ',primary:'胸',secondary:['肩']},{name:'腕立て伏せ',primary:'胸',secondary:['肩','腕']},{name:'インクラインプレス',primary:'胸',secondary:['肩','腕']},{name:'ラットプルダウン',primary:'背中',secondary:['腕']},{name:'懸垂',primary:'背中',secondary:['腕']},{name:'スクワット',primary:'脚',secondary:['お尻']},{name:'デッドリフト',primary:'お尻',secondary:['背中','脚']},{name:'ショルダープレス',primary:'肩',secondary:['腕']},{name:'ダンベルカール',primary:'腕',secondary:[]},{name:'レッグレイズ',primary:'腹',secondary:[]},{name:'自分の種目',primary:'未分類',secondary:[]}];
const nav='<nav class="nav"><span>ホーム</span><span>グループ</span><span class="active">記録中</span><span>履歴</span><span>設定</span></nav>';
function shell(root){root.innerHTML='<header class="brand">GO <em>TORE</em></header><div class="content"></div>'+nav;return root.querySelector('.content')}
function rows(items,onChoose){const list=document.createElement('div');list.className='rows';if(!items.length)list.innerHTML='<div class="empty">この部位の種目はまだありません</div>';for(const r of items){const b=document.createElement('button');b.className='exercise';b.innerHTML='<span><b>'+r.name+'</b><small><span class="tag">'+r.primary+'</span>'+(r.secondary.length?'補助：'+r.secondary.join('・'):'')+'</small></span><span class="chevron">›</span>';b.onclick=()=>onChoose(r);list.append(b)}return list}
function render(root,mode,selected=mode==='a'?'胸':null){const c=shell(root);c.innerHTML='<div class="session"><span><i class="dot"></i>トレーニング中</span><span>終了</span></div><div class="heading"><h2>種目を選択</h2><button class="text manage">種目一覧</button></div><button class="recent"><span class="muted">今回のトレーニング</span><b>スクワット <span class="muted">3セット ›</span></b></button><label class="search"><input aria-label="種目を検索" placeholder="種目名で検索"></label><div class="choices"></div><button class="add">＋ 種目を追加</button>';
c.querySelector('.manage').onclick=()=>edit(root,records[0],()=>render(root,mode,selected));c.querySelector('.add').onclick=()=>edit(root,records[11],()=>render(root,mode,selected));c.querySelector('.recent').onclick=()=>record(root,records[6],()=>render(root,mode,selected));
const choices=c.querySelector('.choices'), search=c.querySelector('input');function update(){const query=search.value.trim();choices.innerHTML='';if(mode==='b'&&!selected&&!query){const grid=document.createElement('div');grid.className='part-grid';for(const part of parts){const count=records.filter(r=>r.primary===part||r.secondary.includes(part)).length;const b=document.createElement('button');b.innerHTML='<b>'+part+'</b><small>'+count+'種目</small>';b.onclick=()=>{selected=part;update()};grid.append(b)}choices.append(grid);const un=document.createElement('button');un.className='unclassified';un.innerHTML='<span>未分類</span><span class="muted">1種目 ›</span>';un.onclick=()=>{selected='未分類';update()};choices.append(un);return}
if(mode==='a'){const tabs=document.createElement('div');tabs.className='filters';tabs.setAttribute('aria-label','部位');for(const part of ['すべて',...parts,'未分類']){const b=document.createElement('button');b.textContent=part;b.setAttribute('aria-pressed',String((selected||'すべて')===part));b.onclick=()=>{selected=part==='すべて'?null:part;update()};tabs.append(b)}choices.append(tabs)}else if(selected){const back=document.createElement('div');back.className='breadcrumb';back.innerHTML='<button aria-label="部位一覧へ戻る">‹</button><b>'+selected+'</b>';back.querySelector('button').onclick=()=>{selected=null;update()};choices.append(back)}
const items=records.filter(r=>(!selected||r.primary===selected||r.secondary.includes(selected))&&r.name.includes(query));const title=document.createElement('div');title.className='list-title';title.innerHTML='<span>'+(selected||'すべての種目')+'</span><span>'+items.length+'種目</span>';choices.append(title,rows(items,r=>record(root,r,()=>render(root,mode,selected))))}search.oninput=update;update()}
function record(root,r,onBack){const c=shell(root);c.innerHTML='<button class="back">‹ 種目を変更</button><h2 class="record-header">'+r.name+'</h2><span class="tag">'+r.primary+'</span><small class="muted">'+(r.secondary.length?'補助：'+r.secondary.join('・'):'')+'</small><div class="input-mock"><small class="muted">SET 1</small><p><strong>60</strong> kg　×　<strong>10</strong> 回</p></div><button class="primary">次のセットへ</button>';c.querySelector('.back').onclick=onBack;c.querySelector('.primary').onclick=e=>e.currentTarget.textContent='画面案：ここからいつもの記録へ'}
function edit(root,r,onBack){const overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML='<section class="sheet"><div class="handle"></div><h3>'+r.name+'</h3><p class="muted" style="font-size:12px;margin:0">部位を編集</p><label>主な部位<select aria-label="主な部位">'+['未分類',...parts].map(p=>'<option '+(p===r.primary?'selected':'')+'>'+p+'</option>').join('')+'</select></label><details open><summary>補助部位 <span class="muted">任意</span></summary><div class="secondary"></div></details><button class="primary">保存する</button><button class="cancel">キャンセル</button></section>';const choice=overlay.querySelector('select');let secondary=[...r.secondary];function update(){const wrap=overlay.querySelector('.secondary');wrap.innerHTML='';for(const p of parts.filter(p=>p!==choice.value)){const b=document.createElement('button');b.textContent=p;b.disabled=choice.value==='未分類';b.setAttribute('aria-pressed',String(secondary.includes(p)));b.onclick=()=>{secondary=secondary.includes(p)?secondary.filter(x=>x!==p):[...secondary,p];update()};wrap.append(b)}}choice.onchange=()=>{secondary=choice.value==='未分類'?[]:secondary.filter(p=>p!==choice.value);update()};update();overlay.querySelector('.primary').onclick=()=>{r.primary=choice.value;r.secondary=secondary;onBack()};overlay.querySelector('.cancel').onclick=onBack;root.append(overlay)}
render(document.getElementById('proposal-a'),'a');render(document.getElementById('proposal-b'),'b');const editor=document.getElementById('proposal-edit');render(editor,'a');edit(editor,records[0],()=>render(editor,'a'));
</script></html>
