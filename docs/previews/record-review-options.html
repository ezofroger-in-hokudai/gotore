<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GO TORE — 記録の見せ方 3案</title>
<style>
:root{color-scheme:light;--bg:#f2f3f5;--panel:#fff;--line:#d7dae0;--muted:#606672;--red:#d32f2f;--text:#20232a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}button,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:0;background:var(--panel);padding:10px 14px;min-height:48px}button:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:3px}button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:white}button:disabled{cursor:default;opacity:.45}.intro{max-width:1280px;margin:auto;padding:40px 24px 24px}.eyebrow{font-size:0.75rem;letter-spacing:.16em;color:var(--red);font-weight:800}h1{font-size:1.75rem;margin:10px 0}p{margin:6px 0}.muted{color:var(--muted)}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px;align-items:end}.toolbar>div{display:flex;gap:6px;flex-wrap:wrap}.toolbar label{display:flex;gap:8px;align-items:center}select{background:var(--panel);border:1px solid var(--line);border-radius:0;padding:11px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;max-width:1280px;margin:auto;padding:0 24px 40px}.option h2{font-size:1.1875rem;margin:12px 0 4px}.option>p{min-height:54px;font-size:0.875rem;color:var(--muted)}.phone{border:1px solid #383d48;background:#fff;border-radius:24px;overflow:hidden;max-width:430px;min-width:0;margin:auto}.statusbar{padding:12px 20px 4px;display:flex;justify-content:space-between;font-size:0.75rem;font-weight:700}.screen{padding:12px 17px 22px;min-height:760px}.nav{color:var(--muted);display:flex;align-items:center;justify-content:space-between}.nav button{background:none;border:0;padding:8px 0;min-height:48px}.brand{font-size:0.75rem;font-style:italic;font-weight:900;letter-spacing:.12em}.day{font-size:1.5rem;margin:10px 0 4px;line-height:1.25;letter-spacing:-.04em}.day small{font-size:0.9375rem;margin-left:6px;color:var(--muted);font-weight:400}.who{display:flex;align-items:center;gap:8px;margin:8px 0 12px}.avatar{width:30px;height:30px;border-radius:50%;background:#dee6ed;display:grid;place-items:center;font-size:0.75rem}.tags{display:flex;gap:6px;margin:12px 0}.tag{font-size:0.75rem;padding:2px 9px;border:1px solid #454951;border-radius:0;color:#59616c}.totals{display:flex;gap:20px;padding:14px 0 20px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}.totals b{font-size:1.5rem;font-weight:750;letter-spacing:-.03em}.totals small{font-size:0.75rem;color:var(--muted);margin-left:3px}.totals label{display:block;font-size:0.75rem;color:var(--muted)}.notice{font-size:0.75rem;background:#fff6e3;border:1px solid #b69b65;border-radius:0;padding:10px 12px;margin:12px 0;color:#5a4826;display:flex;gap:8px;justify-content:space-between;align-items:center}.notice button{white-space:nowrap;padding:5px 9px;font-size:0.75rem}.exercise{margin:20px 0}.exercise h3{font-size:1rem;margin:0 0 2px;letter-spacing:-.02em}.subtitle{font-size:0.75rem;color:var(--muted);display:flex;gap:8px;align-items:center}.mark{color:var(--red);font-size:0.75rem;font-weight:700}.metric-hot{color:var(--red)}table{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:10px;font-variant-numeric:tabular-nums}th{font-size:0.75rem;color:var(--muted);font-weight:400;text-align:right;padding:6px 0}td{text-align:right;font-size:1.0625rem;padding:7px 0;border-top:1px solid #e5e7eb;font-weight:650}td:first-child,th:first-child{text-align:left;width:14%;font-size:0.75rem;font-weight:400;color:var(--muted)}td small{font-size:0.75rem;color:var(--muted)}th:last-child{width:29%}.section-title{font-size:0.75rem;color:var(--muted);font-weight:600;margin:20px 0 9px}.card{border:1px solid var(--line);border-radius:0;background:#fff;margin:10px 0;overflow:hidden}.card summary{cursor:pointer;list-style:none;padding:16px;min-height:104px}.card summary::-webkit-details-marker{display:none}.card summary::after{content:'セットを見る ＋';font-size:0.75rem;color:var(--muted);display:block;text-align:right;margin-top:8px}.card[open] summary::after{content:'閉じる −'}.card[open] summary{padding-bottom:8px}.card .inside{padding:0 16px 13px}.card .title{display:flex;gap:8px;align-items:center;justify-content:space-between}.card h3{font-size:0.9375rem;margin:0}.card .best{margin-top:10px;display:flex;align-items:baseline;gap:5px}.best b{font-size:1.5rem;line-height:1.2;letter-spacing:-.04em}.best small{font-size:0.75rem;color:var(--muted)}.card .smallstats{display:flex;justify-content:space-between;font-size:0.75rem;color:var(--muted);margin-top:6px}.comparison{border-left:3px solid #414651;padding-left:13px;margin:22px 0}.comparison h3{font-size:1rem;margin:0 0 10px}.compare-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-top:12px}.compare-head b{font-size:1.25rem}.compare-head small{color:var(--muted);font-size:0.75rem}.change{color:#2d664a;font-size:0.75rem}.comparison table td{font-size:0.875rem}.comparison table th:first-child{width:14%}.comparison table th:last-child{width:40%}.actions{border-top:1px solid var(--line);padding-top:16px;margin-top:24px;display:flex;gap:8px}.actions button:first-child{flex:1;background:var(--red);color:white;font-weight:650}.footer-note{font-size:0.75rem;color:var(--muted);padding-top:14px}.empty{border:1px dashed var(--line);padding:50px 18px;text-align:center;margin:20px 0;color:var(--muted)}.list-row{width:100%;text-align:left;margin:8px 0;padding:15px;background:#fff}.list-row strong{display:block;font-size:0.9375rem}.list-row span{display:block;color:var(--muted);font-size:0.75rem}.list-row .row-bottom{display:flex;justify-content:space-between;margin-top:10px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:90%;border:1px solid #676c76;background:#fff;padding:12px 18px;border-radius:0;z-index:2;box-shadow:0 4px 30px #0009}.toast:empty{display:none}.comparison-note{font-size:0.75rem;color:var(--muted);max-width:1280px;margin:0 auto 40px;padding:0 24px}.recommended{font-size:0.75rem;color:#9e2525;background:#fdecec;padding:3px 7px;border-radius:0;vertical-align:middle;margin-left:6px}.view-only .option{display:none}.view-only .option.shown{display:block}.view-only{display:block;max-width:480px}@media(max-width:1000px){.grid{grid-template-columns:1fr;max-width:480px}.option>p{min-height:0;margin-bottom:16px}.intro{max-width:700px;padding:22px 16px}.phone{max-width:430px}.screen{min-height:0}.grid{padding:0 12px 30px}h1{font-size:1.5rem}.option{margin-bottom:26px}.totals{gap:18px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style>
<header class="intro">
<span class="eyebrow">GO TORE / 画面比較・試作</span>
<h1>記録を、ひと目で読めるように。</h1>
<p class="muted">同じ9セットを3通りで表示。架空の記録です。カードを開いたり、一覧・共有・通信状態を切り替えて比較できます。</p>
<div class="toolbar">
<div aria-label="比較する案"><button data-option="all" aria-pressed="true">3案を比較</button><button data-option="A" aria-pressed="false">A</button><button data-option="B" aria-pressed="false">B</button><button data-option="C" aria-pressed="false">C</button></div>
<div aria-label="閲覧する場所"><button data-scope="self" aria-pressed="true">自分の履歴</button><button data-scope="group" aria-pressed="false">グループ共有</button></div>
<label>通信状態 <select id="state"><option value="fresh">最新</option><option value="cached">端末の記録を表示中</option><option value="failed">取得失敗・保存なし</option><option value="empty">記録なし</option></select></label>
</div></header>
<main class="grid" id="grid"></main>
<p class="comparison-note">B案は全体を把握してからセットを開く構成。毎セットをすぐ見たい場合はA案が向いています。C案の前回比較と端末キャッシュは追加仕様の提案で、現在のアプリには反映していません。共有記録の端末永続保存は採用未定のため、この試作では切り替え対象外です。</p>
<div class="toast" role="status" id="toast"></div>
<script>
const exercises=[
 {name:'ベンチプレス',part:'胸',sets:[[95,1],[80,10],[75,10]],previous:[[90,1],[77.5,10],[75,10]],weightBest:0,rmBest:1},
 {name:'ショルダープレス',part:'肩',sets:[[40,10],[40,10],[40,10]],previous:[[35,10],[35,10],[35,10]]},
 {name:'ダンベルフライ',part:'胸',sets:[[12,12],[12,12],[12,12]],previous:[[10,12],[10,12],[10,12]]}
];
const labels={A:['セット一覧','全セットを開いたまま、重量・回数・推定1RMを縦に揃える。'],B:['種目カード','種目ごとの最大重量を大きく。セットは必要な種目だけ開く。'],C:['前回と比較','前回と今回を隣に置く。どのセットが伸びたかを確認する。']};
let scope='self',state='fresh',selected='all';const screens={A:'detail',B:'detail',C:'detail'};
const fmt=n=>n.toLocaleString('ja-JP');const volume=sets=>sets.reduce((n,[w,r])=>n+w*r,0);
const rm=([w,r])=>r===1?w:r<=10?Math.round(w*(1+r/30)*10)/10:'—';
const total=exercises.reduce((n,e)=>n+volume(e.sets),0);
function table(e){return `<table aria-label="${e.name}のセット"><thead><tr><th>セット</th><th>重量 kg</th><th>回数</th><th>推定1RM kg</th></tr></thead><tbody>${e.sets.map((s,i)=>`<tr><td>${i+1}</td><td class="${e.weightBest===i?'metric-hot':''}">${s[0]}</td><td>${s[1]}</td><td class="${e.rmBest===i?'metric-hot':''}">${rm(s)}</td></tr>`).join('')}</tbody></table>`}
function detail(code){if(code==='A')return exercises.map(e=>`<section class="exercise"><h3>${e.name}</h3><div class="subtitle">${e.part}${e.weightBest!==undefined?' <span class="mark">🔥 最高重量・RM更新</span>':''}</div>${table(e)}</section>`).join('');
 if(code==='B')return `<h3 class="section-title">3種目</h3>${exercises.map((e,i)=>`<details class="card" ><summary><div class="title"><h3>${e.name}</h3><span class="tag">${e.part}</span></div><div class="best"><b class="${e.weightBest!==undefined?'metric-hot':''}">${Math.max(...e.sets.map(s=>s[0]))}</b><small>kg / 最大重量</small>${e.weightBest!==undefined?'<span class="mark">🔥 自己最高</span>':''}</div><div class="smallstats"><span>${e.sets.length}セット</span><span>総負荷 ${fmt(volume(e.sets))}kg</span></div></summary><div class="inside">${table(e)}${e.rmBest!==undefined?'<p class="mark">推定1RMも更新 · 106.7kg</p>':''}</div></details>`).join('')}`;
 return `<p class="footer-note">前回 9/10(木) との比較</p>${exercises.map(e=>`<section class="comparison"><h3>${e.name} <span class="tag">${e.part}</span></h3><div class="compare-head"><span><small>総負荷</small> <b>${fmt(volume(e.sets))}</b><small>kg</small></span><span class="change">+${fmt(volume(e.sets)-volume(e.previous))}kg</span></div><table aria-label="${e.name}の前回比較"><thead><tr><th>セット</th><th>前回 kg × 回</th><th>今回 kg × 回</th></tr></thead><tbody>${e.sets.map((s,i)=>`<tr><td>${i+1}</td><td>${e.previous[i][0]} × ${e.previous[i][1]}</td><td class="${e.weightBest===i?'metric-hot':''}">${s[0]} × ${s[1]}</td></tr>`).join('')}</tbody></table>${e.rmBest!==undefined?'<p class="mark">最高重量95kg · 推定1RM106.7kg</p>':''}</section>`).join('')}`;}
function list(code){return `<h2 class="day">${scope==='self'?'最近の記録':'仲間の記録'}</h2><button class="list-row" data-open="${code}"><strong>9/13(日) · 胸 / 肩</strong><span>${scope==='group'?'タクミ · ':''}ベンチプレス、ショルダープレス ほか1種目</span><div class="row-bottom"><span>3種目 · 9セット · ${fmt(total)}kg</span><span class="mark">自己最高 ↗</span></div></button><p class="footer-note">記録をタップして詳細へ</p>`;}
function phone(code){const isList=screens[code]==='list';const missing=state==='failed'||state==='empty';return `<div class="statusbar"><span>9:41</span><span aria-hidden="true">● ▰</span></div><div class="screen"><div class="nav"><button data-back="${code}">${isList?'‹ ホーム':scope==='self'?'‹ 履歴':'‹ グループ'}</button><span class="brand">GO TORE</span></div>${state==='cached'?'<div class="notice"><span>端末の記録を表示中<br><span class="muted">最終更新 14:32</span></span><button data-retry>更新</button></div>':''}${missing?`<h2 class="day">${scope==='self'?'履歴':'仲間の記録'}</h2><div class="empty">${state==='failed'?'記録を取得できませんでした。<br><button data-retry>再試行</button>':'まだ記録がありません。'}</div>`:isList?list(code):`${scope==='group'?'<div class="who"><span class="avatar">タ</span><strong>タクミ</strong></div>':''}<h2 class="day">9月13日<small>日曜日</small></h2><div class="tags"><span class="tag">胸</span><span class="tag">肩</span></div><div class="totals"><div><label>総負荷</label><b>${fmt(total)}</b><small>kg</small></div><div><label>セット</label><b>9</b></div><div><label>時間</label><b>48</b><small>分</small></div></div>${detail(code)}${scope==='self'?'<div class="actions"><button data-demo="この記録で次のトレーニングを始める操作の配置案です。">このメニューで始める</button><button data-demo="編集・削除・メモの操作をまとめる配置案です。">その他</button></div><p class="footer-note">トレーニング仲間に共有済み</p>':''}`}</div>`;}
function render(){document.querySelector('#grid').className=selected==='all'?'grid':'grid view-only';document.querySelector('#grid').innerHTML=Object.keys(labels).map(code=>`<section class="option ${selected===code?'shown':''}" data-code="${code}"><h2>${code} · ${labels[code][0]}${code==='B'?'<span class="recommended">おすすめ</span>':''}</h2><p>${labels[code][1]}</p><div class="phone">${phone(code)}</div></section>`).join('');document.querySelector('[value=cached]').disabled=scope==='group';}
function toast(message){const node=document.querySelector('#toast');node.textContent=message;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>node.textContent='',3500);}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.option){selected=b.dataset.option;document.querySelectorAll('[data-option]').forEach(n=>n.setAttribute('aria-pressed',String(n===b)));render();}else if(b.dataset.scope){scope=b.dataset.scope;if(scope==='group'&&state==='cached'){state='fresh';document.querySelector('#state').value=state;}document.querySelectorAll('[data-scope]').forEach(n=>n.setAttribute('aria-pressed',String(n===b)));render();}else if(b.dataset.open){screens[b.dataset.open]='detail';render();}else if(b.dataset.back){screens[b.dataset.back]='list';render();}else if(b.hasAttribute('data-retry')){state='fresh';document.querySelector('#state').value=state;render();toast('更新後の表示例です。実際の通信は行いません。');}else if(b.dataset.demo)toast(b.dataset.demo);});
document.querySelector('#state').addEventListener('change',event=>{state=event.target.value;render();});
const params=new URLSearchParams(location.search);if(labels[params.get('option')]){selected=params.get('option');document.querySelectorAll('[data-option]').forEach(n=>n.setAttribute('aria-pressed',String(n.dataset.option===selected)));}render();
</script>
</html>
